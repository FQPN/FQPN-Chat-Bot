<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FQPN Leaderboard</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="pn" id="pn">
  <div class="hd"><img src="logo.png" alt=""><div><b id="ttl">Leaderboard</b><small id="sub"></small></div></div>
  <div class="tb" id="tabs" role="tablist"></div>
  <div class="main" id="main">
    <div class="pod" id="pod"></div>
    <div class="th" id="th"><span>#</span><span id="thn"></span><span id="thv"></span></div>
    <div class="ls" id="ls"></div>
    <div class="me" id="me"></div>
  </div>
  <div class="msg" id="msg" hidden></div>
  <div class="per" id="per"></div>
  <div class="ft"><span id="note"></span><span class="ftr"><button type="button" class="lng" id="lng">ع</button><a id="link" href="https://fqpnbot.com" target="_blank" rel="noopener" dir="ltr">fqpnbot.com ↗</a></span></div>
</div>
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<script src="panel.js"></script>
</body>
</html>
