name: Build installer

# Runs when you publish a version tag such as v1.0.0, or when you press "Run workflow" on the Actions page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The version comes from ONE place: the tag (v1.16.0). It goes into core/version.py (the app and the exe's
      # Properties read it from there) and into Setup.exe. NUMBER is the same version as four plain numbers (1.16.0.0).
      - name: Work out the version number
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-test" >> "$GITHUB_ENV"
          fi
          V="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/v* ]] || V="0.0.0"
          IFS=. read -r A B C _ <<< "${V%%-*}"
          echo "NUMBER=$((10#${A:-0})).$((10#${B:-0})).$((10#${C:-0})).0" >> "$GITHUB_ENV"

      # The app reads its own version from this file to know when a newer release exists.
      - name: Put the version number into the app
        shell: bash
        run: printf 'VERSION = "%s"\n' "$VERSION" > core/version.py

      - name: Install the bot's libraries
        run: pip install -r requirements.txt

      # Fewer antivirus false alarms: PyInstaller's "starter" (bootloader) is compiled here, on this build machine,
      # instead of using the ready-made one that every PyInstaller program in the world shares (antivirus programs
      # sometimes flag that one because of other people's programs). The machine already has the C compiler it needs.
      - name: Install PyInstaller with its own freshly built bootloader
        id: bootloader
        continue-on-error: true
        shell: cmd
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller pyinstaller==6.22.3

      # If compiling the bootloader failed, the build still works with the normal PyInstaller (and says so).
      - name: Fall back to the normal PyInstaller
        if: steps.bootloader.outcome == 'failure'
        run: |
          echo "::warning::The bootloader could not be compiled: this build uses PyInstaller's ready-made one."
          pip install --force-reinstall pyinstaller==6.22.3

      - name: Build the program folder
        run: pyinstaller TwitchChatBot.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=%VERSION% /DAppNumber=%NUMBER% installer.iss'

      # Microsoft Store package: only built once the three Store values exist as repository variables
      # (Settings > Secrets and variables > Actions > Variables). See MICROSOFT-STORE.md.
      - name: Build the Microsoft Store package
        if: ${{ vars.MSIX_IDENTITY_NAME != '' }}
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          pip install pillow
          python make_msix.py

      - name: Keep the Store package from this run
        if: ${{ vars.MSIX_IDENTITY_NAME != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: Output/*.msix

      - name: Keep the installer from this run
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Output/*.exe

      - name: Put the installer on the Releases page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          generate_release_notes: true
