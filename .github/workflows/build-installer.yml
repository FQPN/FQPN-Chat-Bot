name: Build installer

# Runs when you publish a version tag such as v1.0.0, or when you press "Run workflow" on the Actions page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the bot's libraries and PyInstaller
        run: pip install -r requirements.txt pyinstaller

      - name: Build the program folder
        run: pyinstaller TwitchChatBot.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Work out the version number
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-test" >> "$GITHUB_ENV"
          fi

      - name: Build Setup.exe
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=%VERSION% installer.iss'

      - name: Keep the installer from this run
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Output/*.exe

      - name: Put the installer on the Releases page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          generate_release_notes: true
