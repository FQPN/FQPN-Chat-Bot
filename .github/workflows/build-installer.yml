name: Build installer

# Runs when you publish a version tag such as v1.0.0, or when you press "Run workflow" on the Actions page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1.19.0 Voice on AMD graphics cards: whisper.cpp's own Releases page has no engine for AMD cards (Vulkan) on Windows, so
  # this job builds it ONCE from whisper.cpp's source and keeps it on this project's Releases page (as a "pre-release"
  # named amd-voice-engine-..., so the app's update check never mistakes it for a new version). Later releases find it
  # there and skip the build. If anything here fails, the installer is still built: that version just doesn't offer the
  # "Use my graphics card" switch on AMD cards.
  amd-engine:
    runs-on: windows-latest
    continue-on-error: true
    outputs:
      url: ${{ steps.info.outputs.url }}
      sha: ${{ steps.info.outputs.sha }}
      size: ${{ steps.info.outputs.size }}
    env:
      GH_TOKEN: ${{ github.token }}
      WHISPER_REF: v1.9.1                              # the same whisper.cpp version as the other engines (core/voice.py)
      ENGINE_TAG: amd-voice-engine-1.9.1
      ENGINE_FILE: whisper-vulkan-bin-x64.zip
    steps:
      - name: Is the AMD engine already on the Releases page?
        id: have
        shell: bash
        run: |
          mkdir -p out
          if gh release download "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ENGINE_FILE" --dir out; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
          else
            echo "found=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Get whisper.cpp's source
        if: steps.have.outputs.found == 'no'
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_REF }}
          path: whisper

      - name: Install the Vulkan tools
        if: steps.have.outputs.found == 'no'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      - name: Build the engine for AMD cards
        if: steps.have.outputs.found == 'no'
        shell: pwsh
        run: |
          $env:PATH = "$env:VULKAN_SDK\Bin;$env:PATH"
          cmake -S whisper -B whisper\build -DGGML_VULKAN=1 -DWHISPER_BUILD_TESTS=OFF
          if ($LASTEXITCODE) { throw "cmake could not set up the build" }
          cmake --build whisper\build --config Release -j 4
          if ($LASTEXITCODE) { throw "the build failed" }
          New-Item -ItemType Directory -Force pack\Release | Out-Null
          Copy-Item whisper\build\bin\Release\whisper-server.exe pack\Release\ -ErrorAction Stop
          Copy-Item whisper\build\bin\Release\*.dll pack\Release\
          Get-ChildItem pack\Release | Format-Table Name, Length
          Push-Location pack
          7z a -tzip "..\out\$env:ENGINE_FILE" Release
          if ($LASTEXITCODE) { throw "could not pack the engine" }
          Pop-Location

      - name: Keep the engine on the Releases page
        if: steps.have.outputs.found == 'no'
        shell: bash
        run: |
          gh release create "$ENGINE_TAG" "out/$ENGINE_FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Voice engine for AMD graphics cards" \
            --notes "Not an app version. The speech engine (whisper.cpp $WHISPER_REF, built with Vulkan from its official source) that FQPN's Chat Bot downloads when you turn on \"Use my graphics card\" on an AMD card."

      - name: Note the engine's link, fingerprint and size
        id: info
        shell: bash
        run: |
          f="out/$ENGINE_FILE"
          test -s "$f"
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$ENGINE_TAG/$ENGINE_FILE" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$f" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$f")" >> "$GITHUB_OUTPUT"

  build:
    needs: amd-engine
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The version comes from ONE place: the tag (v1.16.0). It goes into core/version.py (the app and the exe's
      # Properties read it from there) and into Setup.exe. NUMBER is the same version as four plain numbers (1.16.0.0).
      - name: Work out the version number
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-test" >> "$GITHUB_ENV"
          fi
          V="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/v* ]] || V="0.0.0"
          IFS=. read -r A B C _ <<< "${V%%-*}"
          echo "NUMBER=$((10#${A:-0})).$((10#${B:-0})).$((10#${C:-0})).0" >> "$GITHUB_ENV"

      # The app reads its own version from this file to know when a newer release exists.
      - name: Put the version number into the app
        shell: bash
        run: printf 'VERSION = "%s"\n' "$VERSION" > core/version.py

      # 1.19.0: the AMD speech engine's link (from the job above) goes into the app. Without it the app is built as before.
      - name: Put the AMD voice engine's link into the app
        if: ${{ needs.amd-engine.outputs.url != '' && needs.amd-engine.outputs.sha != '' }}
        shell: bash
        env:
          E_URL: ${{ needs.amd-engine.outputs.url }}
          E_SHA: ${{ needs.amd-engine.outputs.sha }}
          E_SIZE: ${{ needs.amd-engine.outputs.size }}
        run: |
          printf 'VULKAN = {"url": "%s", "sha256": "%s", "size": %s}\n' "$E_URL" "$E_SHA" "${E_SIZE:-0}" > core/voicegpu.py
          cat core/voicegpu.py

      - name: Install the bot's libraries
        run: pip install -r requirements.txt

      # Fewer antivirus false alarms: PyInstaller's "starter" (bootloader) is compiled here, on this build machine,
      # instead of using the ready-made one that every PyInstaller program in the world shares (antivirus programs
      # sometimes flag that one because of other people's programs). The machine already has the C compiler it needs.
      - name: Install PyInstaller with its own freshly built bootloader
        id: bootloader
        continue-on-error: true
        shell: cmd
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller pyinstaller==6.22.3

      # If compiling the bootloader failed, the build still works with the normal PyInstaller (and says so).
      - name: Fall back to the normal PyInstaller
        if: steps.bootloader.outcome == 'failure'
        run: |
          echo "::warning::The bootloader could not be compiled: this build uses PyInstaller's ready-made one."
          pip install --force-reinstall pyinstaller==6.22.3

      - name: Build the program folder
        run: pyinstaller TwitchChatBot.spec --noconfirm

      # 1.17.0 Voice commands: the speech engine (downloaded by the app) needs Microsoft's C++ runtime. Microsoft lets apps
      # ship these four files next to themselves, so people never have to install the "Visual C++ Redistributable".
      - name: Add the C++ runtime for Voice commands
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\TwitchChatBot\vcrt | Out-Null
          foreach ($f in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll","vcomp140.dll") {
            Copy-Item "$env:SystemRoot\System32\$f" dist\TwitchChatBot\vcrt\ -ErrorAction Stop
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=%VERSION% /DAppNumber=%NUMBER% installer.iss'

      # Microsoft Store package: only built once the three Store values exist as repository variables
      # (Settings > Secrets and variables > Actions > Variables). See MICROSOFT-STORE.md.
      - name: Build the Microsoft Store package
        if: ${{ vars.MSIX_IDENTITY_NAME != '' }}
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          pip install pillow
          python make_msix.py

      - name: Keep the Store package from this run
        if: ${{ vars.MSIX_IDENTITY_NAME != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: Output/*.msix

      - name: Keep the installer from this run
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Output/*.exe

      # 1.19.0: the Releases page shows this version's What's new (English and Arabic), and the app's update pop-up
      # reads it from there, so people see what is new before they press Update now.
      - name: Write the release notes from the app's What's new
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python tools/release_notes.py "$VERSION" > release_notes.md

      - name: Put the installer on the Releases page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          body_path: release_notes.md
