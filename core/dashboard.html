<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FQPN's Chat Bot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#0b0b0c;--side:#0d0d0e;--panel:#0f0f10;--line:#222224;--text:#d3d3d8;--mute:#8a8a92;--red:#7d0b0f;--red2:#9a1118;--chip:#1c1c1e;--mod-bg:#12332a;--mod-t:#4fb386;--ev-bg:#2b2b2e;--ev-t:#b4b4bb;--soft:#b2b2ba;--hover:#151517;--off:#3a3a3d;--menu-h:#2a1214;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f4f6;--side:#fff;--panel:#fff;--line:#e2e2e7;--text:#17171a;--mute:#6b6b73;--chip:#eeeef1;--mod-bg:#d6f3e5;--mod-t:#0f7a46;--ev-bg:#e6e6ea;--ev-t:#44444a;--soft:#44444a;--hover:#f4f4f6;--off:#c4c4ca;--menu-h:#fde8e8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Outfit','Tajawal',system-ui,sans-serif;display:flex;min-height:100vh}
aside{position:sticky;top:0;height:100vh;height:100dvh;align-self:flex-start;overflow-y:auto;width:232px;background:var(--side);border-inline-end:1px solid var(--line);padding:30px 16px;display:flex;flex-direction:column;flex-shrink:0}
.brand{margin:0 14px 34px;font-weight:700;font-size:23px;line-height:1.15}
.brand small{display:block;font-weight:500;font-size:13px;letter-spacing:.45em;margin-top:6px}
nav a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:8px;color:var(--soft);text-decoration:none;margin-bottom:6px;font-weight:500}
nav a.on{background:var(--red);color:#fff}
.acct{margin-top:auto;position:relative}
.acct small{display:block;font-size:11px;color:var(--mute);margin:0 0 4px;padding-inline-start:10px}
.me{width:100%;display:flex;gap:10px;align-items:center;padding:8px 10px;background:none;border:0;border-radius:10px;color:inherit;font-family:inherit;cursor:pointer;text-align:start}
.me:hover{background:var(--hover)}
.av{width:44px;height:44px;border-radius:50%;flex-shrink:0}
.who{display:block}.who b{display:block;unicode-bidi:isolate;font-size:19px;line-height:1.1}.who i{display:flex;align-items:center;gap:6px;white-space:nowrap;font-style:normal;font-size:13px;color:#4ade80}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.tw{margin-inline-start:auto;display:flex;gap:10px;align-items:center;color:var(--mute)}
.chev{transition:transform .2s}.me[aria-expanded=true] .chev{transform:rotate(180deg)}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu.open{display:block}
.menu button{width:100%;background:none;border:0;color:#ff6b6b;font:500 15px 'Outfit','Tajawal',sans-serif;text-align:start;padding:10px 12px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--menu-h)}
main{flex:1;min-width:0}
.top{height:84px;border-bottom:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;padding:0 36px;color:var(--mute)}
.wrap{padding:28px 26px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:36px;font-weight:600;margin:0}
header p{margin:4px 0 0;color:var(--mute);font-size:17px}
.btn{background:var(--red);color:#fff;border:1px solid var(--red2);padding:14px 26px;border-radius:8px;font:500 17px 'Outfit','Tajawal',sans-serif;cursor:pointer}
.btn:hover{background:var(--red2)}
.bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:none;color:var(--soft);padding:12px 26px;font:500 15px 'Outfit','Tajawal',sans-serif;cursor:pointer}
.tabs button.on{background:var(--red);color:#fff}
input[type=search]{flex:1;min-width:180px;max-width:300px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px 16px;border-radius:8px;font:15px 'Outfit','Tajawal',sans-serif}
.count{margin-inline-start:auto;color:var(--mute);font-size:14px}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.tbl{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow-x:auto}
.row{display:grid;grid-template-columns:190px 1fr 120px 100px 90px 100px;gap:14px;align-items:center;padding:8px 26px;min-width:760px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:not(.head):hover{background:var(--hover);box-shadow:inset 3px 0 0 var(--red2)}
.row.head{font-weight:600;font-size:15px;padding:18px 26px}
.cmd{display:inline-flex;gap:12px;align-items:center;background:var(--chip);color:var(--text);padding:9px 12px;border-radius:7px;border:0;font:500 16px 'Outfit','Tajawal',sans-serif;cursor:pointer;justify-self:start}
.cmd span{opacity:.6}
.msg{font-size:16px;overflow-wrap:anywhere}
.lvl{font-size:14px;font-weight:500;padding:6px 12px;border-radius:5px;justify-self:start}
.lvl.mod{background:var(--mod-bg);color:var(--mod-t)}.lvl.all{background:var(--ev-bg);color:var(--ev-t)}
.cd{color:var(--soft)}
.sw{width:46px;height:26px;border-radius:999px;background:var(--off);border:0;position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#dcdce0;transition:transform .2s}
.sw[aria-checked=true]{background:var(--red2)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.act{display:flex;gap:14px;justify-content:center}.act button{border:0;background:none;color:var(--soft);cursor:pointer;font-size:17px;padding:4px}
.act button{display:flex;transition:color .2s,transform .2s}.act button:hover{color:var(--text)}.act .del:hover,.act .del:focus-visible{color:#ff3b3b;transform:scale(1.15)}.act .del:active{transform:scale(.9)}
.empty{padding:30px;text-align:center;color:var(--mute)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.view{display:none}.view.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.card span{color:var(--mute);font-size:15px}.card b{display:block;font-size:34px;font-weight:600;margin-top:6px}
.card.red{border-color:var(--red2);box-shadow:inset 3px 0 0 var(--red2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel h2{margin:0;padding:18px 24px;font-size:18px;font-weight:600;border-bottom:1px solid var(--line)}
.line{display:flex;gap:16px;align-items:center;padding:14px 24px;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .grow{flex:1;min-width:0;overflow-wrap:anywhere}.line small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.time{color:var(--mute);font-size:14px;min-width:64px}
.field{display:flex;flex-direction:column;gap:6px;padding:16px 24px;border-top:1px solid var(--line)}
.field label{font-weight:500}.field small{color:var(--mute)}
.field input,.field select{max-width:320px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:11px 14px;border-radius:8px;font:15px 'Outfit','Tajawal',sans-serif}
.sp{padding:16px 24px}
@media (max-width:900px){.mnav{display:flex!important}}
.mnav{display:none;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line)}
.mnav a{color:var(--soft);text-decoration:none;padding:8px 14px;border-radius:8px;white-space:nowrap;font-weight:500}.mnav a.on{background:var(--red);color:#fff}
@media (max-width:900px){aside{display:none}.wrap{padding:20px 14px}.top{padding:0 16px;height:60px}h1{font-size:30px}.count{display:none}}

nav{position:relative}
nav a{position:relative;z-index:1;transition:color .25s}
nav a.on{background:transparent!important}
.pill{position:absolute;left:0;right:0;top:0;height:44px;border-radius:8px;background:var(--red);box-shadow:0 4px 14px -8px var(--red2);transition:transform .45s cubic-bezier(.3,1.25,.5,1),height .3s}
.ic{flex-shrink:0;overflow:visible}
nav a .ic{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
nav a:hover .ic{transform:scale(1.15)}
nav a:hover .wand{transform:scale(1.15) rotate(-14deg)}
nav a:hover .gear{transform:scale(1.15) rotate(90deg)}
nav a:hover .clock .hand{transform-origin:12px 12px;animation:tick .8s steps(4) 1}
.spark{transform-origin:15px 7px}.spark2{transform-origin:19px 16px}
nav a.on .spark{animation:twinkle 2.4s ease-in-out infinite}
nav a.on .spark2{animation:twinkle 2.4s ease-in-out .8s infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
@keyframes tick{to{transform:rotate(360deg)}}
main{position:relative;overflow:hidden}
main::before{content:"";position:absolute;width:560px;height:560px;right:-160px;top:-240px;border-radius:50%;background:radial-gradient(circle,rgba(163,18,26,.12),transparent 68%);animation:drift 16s ease-in-out infinite alternate;pointer-events:none}
.top,.wrap{position:relative;z-index:1}
@keyframes drift{to{transform:translate(-120px,90px) scale(1.15)}}
.line{flex-wrap:wrap;transition:opacity .25s,transform .25s}.line.out{opacity:0;transform:translateX(24px)}
.eform .grow{display:flex;flex-direction:column;gap:8px;min-width:220px}
.eform input,.eform select{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px 12px;border-radius:8px;font:15px 'Outfit','Tajawal',sans-serif}
.btn.sm{padding:10px 18px;font-size:15px}
.ghost{background:none;border:1px solid var(--line);color:var(--soft);padding:10px 16px;border-radius:8px;font:500 15px 'Outfit','Tajawal',sans-serif;cursor:pointer}.ghost:hover{color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red2);border-radius:12px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop2 .35s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop2{from{opacity:0;transform:translateY(18px) scale(.95)}}
.sheet h2{margin:0 0 14px;font-size:22px;font-weight:600}
.sheet label{display:block;font-weight:500;font-size:14px;margin:14px 0 6px}
.sheet input,.sheet textarea,.sheet select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:11px 14px;border-radius:8px;font:15px 'Outfit','Tajawal',sans-serif;resize:vertical}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.err{border-color:var(--red2)!important}
.sheet{max-width:560px;max-height:92vh;overflow-y:auto}
.hint{margin:0 0 4px;color:var(--mute);font-size:13px;line-height:1.45}
.sheet label+.hint,.sheet textarea+.hint{margin-top:10px}
.sub{color:var(--mute);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:500 13px ui-monospace,Menlo,Consolas,monospace;transition:background .2s,border-color .2s,transform .15s}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip:hover{border-color:var(--red2);transform:translateY(-1px)}.chip:active{transform:scale(.95)}
.chip.on{background:var(--red);border-color:var(--red2);color:#fff}
#annchips .chip{font-family:'Outfit','Tajawal',sans-serif;font-size:14px}
.al{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.tip{position:fixed;z-index:80;max-width:260px;background:var(--text);color:var(--bg);padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.4;display:flex;flex-direction:column;gap:4px;pointer-events:none;opacity:0;transform:translateY(4px) scale(.97);transition:opacity .15s,transform .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px 28px rgba(0,0,0,.45)}
.tip.below{transform:translateY(-4px) scale(.97)}
.tip.on{opacity:1;transform:none}
.tip b{font:600 13px ui-monospace,Menlo,Consolas,monospace;color:var(--red2)}
.tip em{font-style:normal;opacity:.7;font-size:12px}
.eform .hint{margin:0}.eform .chips{margin-top:0}

:root[dir=rtl]{--dx:14px}
[dir=rtl] .sw[aria-checked=true]::after{transform:translateX(-20px)}
[dir=rtl] .row:not(.head):hover,[dir=rtl] .card.red{box-shadow:inset -3px 0 0 var(--red2)}
[dir=rtl] main::before{right:auto;left:-160px}
[dir=rtl] .line.out{transform:translateX(-24px)}
[lang=ar] .brand small{letter-spacing:0;font-size:14px}
[lang=ar] body{line-height:1.55}
[lang=ar] .cmd,[lang=ar] .chip{font-family:ui-monospace,Menlo,Consolas,'Tajawal',monospace}
[lang=ar] #annchips .chip{font-family:'Outfit','Tajawal',sans-serif}
.xtra{border-style:dashed}
.hint.warn{color:#f59e0b}
[hidden]{display:none!important}
.view.on{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
.fresh .row:not(.head){animation:rowIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(var(--dx,-14px))}}
.row{transition:background .2s,box-shadow .2s}
.cmd{transition:background .2s,transform .2s}.cmd:hover{background:var(--red);color:#fff;transform:translateY(-1px)}
.cmd:active{transform:scale(.95)}
.btn{transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px var(--red2)}.btn:active{transform:scale(.96)}
.sw::after{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.sw[aria-checked=true]{box-shadow:0 0 8px -4px var(--red2)}
.sw:active::after{width:24px}
.card{transition:transform .25s,border-color .25s}.card:hover{transform:translateY(-3px);border-color:var(--red2)}
.dot{animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}100%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
.menu.open{animation:pop .22s cubic-bezier(.34,1.56,.64,1);transform-origin:bottom}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}}
.toast{transform:translate(-50%,12px);transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}

/* ---- linked-dashboard additions ---- */
:root[data-theme="light"] .sw::after{background:#fff}
.lvl.sub{background:#2d2250;color:#c4a8ff}.lvl.vip{background:#4a1d38;color:#ff9ccf}.lvl.bc{background:#4a1518;color:#ff9a9a}
:root[data-theme="light"] .lvl.sub{background:#ece4ff;color:#5b34b0}:root[data-theme="light"] .lvl.vip{background:#ffe3f1;color:#a01d62}:root[data-theme="light"] .lvl.bc{background:#ffe0e0;color:#a31616}
.row.dim .msg,.row.dim .cmd{opacity:.5}
.row .bi{font-size:13px;color:var(--mute);justify-self:center}
.who i.st-ok{color:#3fb871}.who i.st-wait{color:#f59e0b}.who i.st-off{color:var(--mute)}
.who i.st-wait .dot,.who i.st-off .dot{animation:none}
.menu button.neutral{color:var(--text)}.menu button.neutral:hover{background:var(--hover)}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 26px 0;padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);position:relative;z-index:2}
.banner.bad{border-color:#b4161d;background:rgba(180,22,29,.12)}.banner.warn{border-color:#f59e0b;background:rgba(245,158,11,.1)}.banner.info{border-color:var(--red2)}
.banner span{flex:1;min-width:200px}.banner .code{font:600 20px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;margin-inline:6px;padding:2px 10px;border-radius:6px;background:var(--chip);color:var(--text)}
.bbtn{background:var(--red);color:#fff;border:1px solid var(--red2);padding:8px 16px;border-radius:8px;font:500 14px 'Outfit','Tajawal',sans-serif;cursor:pointer;text-decoration:none}
.bbtn:hover{background:var(--red2)}
.btn.danger{background:#b4161d;border-color:#d11f27}.btn.danger:hover{background:#d11f27}
.btn:disabled{opacity:.6;cursor:wait}
.sheet.small{max-width:420px}
.evtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}.evtop .note{margin:0;max-width:760px}
[hidden]{display:none!important}
.sheet .chip[data-ev]{display:none}
.sheet[data-evk=watch_streak] .chip[data-ev~=watch_streak],
.sheet[data-evk=follow] .chip[data-ev~=follow],
.sheet[data-evk=subscription] .chip[data-ev~=subscription],
.sheet[data-evk=gift_sub] .chip[data-ev~=gift_sub],
.sheet[data-evk=raid] .chip[data-ev~=raid],
.sheet[data-evk=hype_train] .chip[data-ev~=hype_train],
.sheet[data-evk=bits] .chip[data-ev~=bits]{display:inline-flex}
.msgbox{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-width:680px;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:10px}
.evcard{margin-bottom:16px}
.warnline{color:#f59e0b}
.field code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12px}
#mmin{max-width:200px}
.gmsg{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}.gmsg textarea{flex:1}
.gdel{border:1px solid var(--line);background:none;color:var(--mute);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:20px;line-height:1;flex-shrink:0}.gdel:hover{color:#ff3b3b;border-color:#ff3b3b}
.pill-b{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--soft);margin-inline-start:8px}
.pause.grn.on span{color:#3fb871}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.h2row h2{border:0!important;flex:1}
.pause{display:flex;align-items:center;gap:12px;padding:0 24px;color:var(--mute);font-size:14px}
.pause.on span{color:#f59e0b}
.av{object-fit:cover;background:var(--chip)}
.sheet [data-for]{display:none}
.sheet[data-kind=command] [data-for~=command],.sheet[data-kind=timer] [data-for~=timer],.sheet[data-kind=greeting] [data-for~=greeting],.sheet[data-kind=alert] [data-for~=alert]{display:block}
.cnt{font-size:12px;color:var(--mute);text-align:end;margin-top:4px}.cnt.over{color:#ff6b6b}
.merr{color:#ff6b6b;margin:14px 0 0;font-size:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card small{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.card b.s{font-size:22px;margin-top:12px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:16px 24px 20px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px}
[dir=rtl] .tag{padding:6px 14px 6px 8px}
.tag button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:50%}
.tag button:hover{color:#ff3b3b}
.addrow{display:flex;gap:10px;padding:16px 24px 0}
.addrow input{flex:1;max-width:340px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px 14px;border-radius:8px;font:15px 'Outfit','Tajawal',sans-serif}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pill-b{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--soft);margin-inline-start:8px}
.field input[type=number]{max-width:180px}
.note{color:var(--mute);margin:-8px 0 16px;font-size:14px}
.loading{padding:30px;text-align:center;color:var(--mute)}
.cmd{max-width:100%}.cmd .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cmd.static{cursor:default}.cmd.static:hover{background:var(--chip);color:var(--text);transform:none}

  if(kind=="command"){$("mc").value=o?key:"";$("ma").value=o?(o.aliases||[]).join(", "):"";$("mr").value=o?o.response:"";$("ml").value=o?o.permission:"everyone";$("md").value=o?o.cooldown:5}
  else if(kind=="alert"){var em=EVM[ak],tl=((D.events[ak]||{}).tiers||[]);$("mr").value=o?o.response:"";
    $("mmin").value=o?o.min:(tl.length?(Math.max.apply(null,tl.map(function(x){return x.min}))*2||1):1);$("minwrap").hidden=!!em.single;$("hintalert").hidden=!!em.single;$("lbl-min").textContent=t("ev_lbl_min",{u:t(em.u)})}
  else if(kind=="greeting"){$("mc").value=o?o.user:"";$("gmsgs").innerHTML="";gActive=null;(o?o.messages:[""]).forEach(function(m){addMsgBox(m)});gActive=$("gmsgs").querySelector("textarea")}
  else{$("mc").value=o?o.name:"";$("mr").value=o?o.message:"";$("mi").value=o?o.interval_minutes:20}
  $("mc").placeholder=kind=="command"?t("name_ph"):kind=="greeting"?t("gname_ph"):"";
  buildAnn();updCnt();$("modal").classList.add("open");(kind=="alert"?($("minwrap").hidden?$("mr"):$("mmin")):$("mc")).focus()}

async function saveEdit(){
  if(!M)return;hideErr();var kind=M.kind,key=M.key,orig=M.orig,isNew=key==null,resp=$("mr").value.trim(),btn=$("msave");btn.disabled=true;
  try{
    if(kind!="greeting"){if(!resp)throw new Error(t("err_resp"));if(resp.length>450)throw new Error(t("err_len"))}
    if(kind=="command"){
      var name=cleanName($("mc").value);if(!name)throw new Error(t("err_name"));
      var cd=num("md",0,86400),aliases=[];$("ma").value.split(/[,،;؛\n]+/).forEach(function(a){a=cleanName(a);if(a&&a!=name&&aliases.indexOf(a)<0)aliases.push(a)});
      await mutate("commands",function(c){var obj={response:resp,permission:$("ml").value,cooldown:cd,enabled:true,aliases:aliases};
        if(isNew){if(c[name])throw new Error(t("err_exists",{n:name}));c[name]=obj;return}
        if(!c[key])throw Gone();obj.enabled=c[key].enabled!==false;if(name!=key&&c[name])throw new Error(t("err_exists",{n:name}));
        var out={};Object.keys(c).forEach(function(k){if(k==key)out[name]=obj;else out[k]=c[k]});return out})
    }else if(kind=="alert"){
      var ak2=M.ak,em2=EVM[ak2],mn=em2.single?0:num("mmin",0,1000000);if(Math.floor(mn)!=mn)throw new Error(t("err_num"));
      await mutate("events",function(e){var ev=e[ak2]=e[ak2]||{enabled:true,tiers:[]};ev.tiers=ev.tiers||[];
        var dup=function(i){return !em2.single&&ev.tiers.some(function(x,k){return k!=i&&x.min==mn})};
        if(isNew){if(dup(-1))throw new Error(t("err_dupmin",{n:mn}));ev.tiers.push({min:mn,response:resp})}
        else{var i=idxOf(ev.tiers,key,function(x){return x.min==orig.min&&x.response==orig.response});if(dup(i))throw new Error(t("err_dupmin",{n:mn}));ev.tiers[i]={min:mn,response:resp}}
        ev.tiers.sort(function(a,b){return a.min-b.min})})
    }else if(kind=="greeting"){
      var gu=$("mc").value.trim().replace(/^@/,"").toLowerCase();if(!/^[a-z0-9_]{1,25}$/.test(gu))throw new Error(t("err_gname"));
      var msgs=readMsgs();if(!msgs.length)throw new Error(t("err_gmsg"));
      await mutate("greetings",function(g){g.users=g.users||[];var obj={user:gu,messages:msgs,enabled:true};
        if(isNew){if(g.users.some(function(x){return x.user==gu}))throw new Error(t("err_gdup",{n:gu}));g.users.push(obj);return}
        var i=idxOf(g.users,key,function(x){return x.user==orig.user});obj.enabled=g.users[i].enabled!==false;
        if(gu!=orig.user&&g.users.some(function(x,k){return k!=i&&x.user==gu}))throw new Error(t("err_gdup",{n:gu}));g.users[i]=obj})
    }else{
      var tn=$("mc").value.trim();if(!tn)throw new Error(t("err_name"));var iv=num("mi",1,1440);
      await mutate("timers",function(a){var obj={name:tn,message:resp,interval_minutes:iv,enabled:true};
        if(isNew){a.push(obj);return}var i=idxOf(a,key,function(x){return x.name==orig.name});obj.enabled=a[i].enabled!==false;a[i]=obj})
    }
    closeEdit();anim=false;renderAll();anim=true;say(t(isNew?"added":"saved"))
  }catch(e){if(e.gone){closeEdit();fail(e)}else showErr(e.message)}
  finally{btn.disabled=false}
}
