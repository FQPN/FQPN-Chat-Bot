<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FQPN's Chat Bot</title>
<link rel="icon" href="/icon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#0b0b0c;--side:#0d0d0e;--panel:#0f0f10;--line:#222224;--text:#d3d3d8;--mute:#8a8a92;--red:#7d0b0f;--red2:#9a1118;--chip:#1c1c1e;--mod-bg:#12332a;--mod-t:#4fb386;--ev-bg:#2b2b2e;--ev-t:#b4b4bb;--soft:#b2b2ba;--hover:#151517;--off:#3a3a3d;--menu-h:#2a1214;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f4f6;--side:#fff;--panel:#fff;--line:#e2e2e7;--text:#17171a;--mute:#6b6b73;--chip:#eeeef1;--mod-bg:#d6f3e5;--mod-t:#0f7a46;--ev-bg:#e6e6ea;--ev-t:#44444a;--soft:#44444a;--hover:#f4f4f6;--off:#c4c4ca;--menu-h:#fde8e8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Outfit','Tajawal',system-ui,sans-serif;display:flex;min-height:100vh}
aside{position:sticky;top:0;height:100vh;height:100dvh;align-self:flex-start;overflow-y:auto;width:14.5rem;background:var(--side);border-inline-end:1px solid var(--line);padding:1.875rem 1rem;display:flex;flex-direction:column;flex-shrink:0}
.brand{margin:0 0.875rem 2.125rem;font-weight:700;font-size:1.4375rem;line-height:1.15}
.brand small{display:block;font-weight:500;font-size:0.8125rem;letter-spacing:.45em;margin-top:0.375rem}
nav a{display:flex;gap:0.75rem;align-items:center;padding:0.6875rem 0.875rem;border-radius:0.5rem;color:var(--soft);text-decoration:none;margin-bottom:0.375rem;font-weight:500}
nav a.on{background:var(--red);color:var(--on-red,#fff)}
.acct{margin-top:auto;position:relative}
.acct small{display:block;font-size:0.6875rem;color:var(--mute);margin:0 0 0.25rem;padding-inline-start:0.625rem}
.me{width:100%;display:flex;gap:0.625rem;align-items:center;padding:0.5rem 0.625rem;background:none;border:0;border-radius:0.625rem;color:inherit;font-family:inherit;cursor:pointer;text-align:start}
.me:hover{background:var(--hover)}
.av{width:2.75rem;height:2.75rem;border-radius:50%;flex-shrink:0}
.who{display:block}.who b{display:block;unicode-bidi:isolate;font-size:1.1875rem;line-height:1.1}.who i{display:flex;align-items:center;gap:0.375rem;white-space:nowrap;font-style:normal;font-size:0.8125rem;color:#4ade80}.dot{width:0.4375rem;height:0.4375rem;border-radius:50%;background:currentColor;flex-shrink:0}
.tw{margin-inline-start:auto;display:flex;gap:0.625rem;align-items:center;color:var(--mute)}
.chev{transition:transform .2s}.me[aria-expanded=true] .chev{transform:rotate(180deg)}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 0.375rem);background:var(--panel);border:1px solid var(--line);border-radius:0.625rem;padding:0.375rem;display:none;box-shadow:0 0.5rem 1.5rem rgba(0,0,0,.5)}
.menu.open{display:block}
.menu button{width:100%;background:none;border:0;color:#ff6b6b;font:500 0.9375rem 'Outfit','Tajawal',sans-serif;text-align:start;padding:0.625rem 0.75rem;border-radius:0.4375rem;cursor:pointer}
.menu button:hover{background:var(--menu-h)}
main{flex:1;min-width:0}
.top{height:5.25rem;border-bottom:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;padding:0 2.25rem;color:var(--mute)}
.wrap{padding:1.75rem 1.625rem}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
h1{font-size:2.25rem;font-weight:600;margin:0}
header p{margin:0.25rem 0 0;color:var(--mute);font-size:1.0625rem}
.btn{background:var(--red);color:var(--on-red,#fff);border:1px solid var(--red2);padding:0.875rem 1.625rem;border-radius:0.5rem;font:500 1.0625rem 'Outfit','Tajawal',sans-serif;cursor:pointer}
.btn:hover{background:var(--red2)}
.bar{display:flex;gap:0.875rem;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:0.5rem;overflow:hidden}
.tabs button{border:0;background:none;color:var(--soft);padding:0.75rem 1.625rem;font:500 0.9375rem 'Outfit','Tajawal',sans-serif;cursor:pointer}
.tabs button.on{background:var(--red);color:var(--on-red,#fff)}
input[type=search]{flex:1;min-width:11.25rem;max-width:18.75rem;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0.75rem 1rem;border-radius:0.5rem;font:0.9375rem 'Outfit','Tajawal',sans-serif}
.count{margin-inline-start:auto;color:var(--mute);font-size:0.875rem}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.tbl{border:1px solid var(--line);border-radius:0.625rem;background:var(--panel);overflow-x:auto}
.row{display:grid;grid-template-columns:11.875rem 1fr 7.5rem 6.25rem 5.625rem 6.25rem;gap:0.875rem;align-items:center;padding:0.5rem 1.625rem;min-width:47.5rem;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:not(.head):hover{background:var(--hover);box-shadow:inset 3px 0 0 var(--red2)}
.row.head{font-weight:600;font-size:0.9375rem;padding:1.125rem 1.625rem}
.cmd{display:inline-flex;gap:0.75rem;align-items:center;background:var(--chip);color:var(--text);padding:0.5625rem 0.75rem;border-radius:0.4375rem;border:0;font:500 1rem 'Outfit','Tajawal',sans-serif;cursor:pointer;justify-self:start}
.cmd span{opacity:.6}
.msg{font-size:1rem;overflow-wrap:anywhere}
.lvl{font-size:0.875rem;font-weight:500;padding:0.375rem 0.75rem;border-radius:0.3125rem;justify-self:start}
.lvl.mod{background:var(--mod-bg);color:var(--mod-t)}.lvl.all{background:var(--ev-bg);color:var(--ev-t)}
.cd{color:var(--soft)}
.sw{width:2.875rem;height:1.625rem;border-radius:62.4375rem;background:var(--off);border:0;position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:1.25rem;height:1.25rem;border-radius:50%;background:#dcdce0;transition:transform .2s}
.sw[aria-checked=true]{background:var(--red2)}.sw[aria-checked=true]::after{transform:translateX(1.25rem)}
.act{display:flex;gap:0.875rem;justify-content:center}.act button{border:0;background:none;color:var(--soft);cursor:pointer;font-size:1.0625rem;padding:0.25rem}
.act button{display:flex;transition:color .2s,transform .2s}.act button:hover{color:var(--text)}.act .del:hover,.act .del:focus-visible{color:#ff3b3b;transform:scale(1.15)}.act .del:active{transform:scale(.9)}
.empty{padding:1.875rem;text-align:center;color:var(--mute)}
.toast{position:fixed;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--red);color:var(--on-red,#fff);padding:0.625rem 1.125rem;border-radius:0.5rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.view{display:none}.view.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(12.5rem,1fr));gap:0.875rem;margin-bottom:1.375rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:0.625rem;padding:1.25rem}
.card span{color:var(--mute);font-size:0.9375rem}.card b{display:block;font-size:2.125rem;font-weight:600;margin-top:0.375rem}
.card.red{border-color:var(--red2);box-shadow:inset 3px 0 0 var(--red2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0.625rem;overflow:hidden}
.panel h2{margin:0;padding:1.125rem 1.5rem;font-size:1.125rem;font-weight:600;border-bottom:1px solid var(--line)}
.line{display:flex;gap:1rem;align-items:center;padding:0.875rem 1.5rem;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .grow{flex:1;min-width:0;overflow-wrap:anywhere}.line small{display:block;color:var(--mute);font-size:0.8125rem;margin-top:2px}
.time{color:var(--mute);font-size:0.875rem;min-width:4rem}
.field{display:flex;flex-direction:column;gap:0.375rem;padding:1rem 1.5rem;border-top:1px solid var(--line)}
.field label{font-weight:500}.field small{color:var(--mute)}
.field input,.field select{max-width:20rem;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0.6875rem 0.875rem;border-radius:0.5rem;font:0.9375rem 'Outfit','Tajawal',sans-serif}
.sp{padding:1rem 1.5rem}

.mnav{display:none;gap:0.375rem;overflow-x:auto;padding:0.625rem 0.875rem;border-bottom:1px solid var(--line)}
.mnav a{color:var(--soft);text-decoration:none;padding:0.5rem 0.875rem;border-radius:0.5rem;white-space:nowrap;font-weight:500}.mnav a.on{background:var(--red);color:var(--on-red,#fff)}


nav{position:relative}
nav a{position:relative;z-index:1;transition:color .25s}
nav a.on{background:transparent!important}
.pill{position:absolute;left:0;right:0;top:0;height:2.75rem;border-radius:0.5rem;background:var(--red);box-shadow:0 0.25rem 0.875rem -0.5rem var(--red2);transition:transform .45s cubic-bezier(.3,1.25,.5,1),height .3s}
.ic{flex-shrink:0;overflow:visible}
nav a .ic{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
nav a:hover .ic{transform:scale(1.15)}
nav a:hover .wand{transform:scale(1.15) rotate(-14deg)}
nav a:hover .gear{transform:scale(1.15) rotate(90deg)}
.spark{transform-origin:15px 7px}.spark2{transform-origin:19px 16px}
nav a.on .spark{animation:twinkle 2.4s ease-in-out infinite}
nav a.on .spark2{animation:twinkle 2.4s ease-in-out .8s infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
main{position:relative;overflow:hidden;overflow:clip}   /* (clip: the glow is cut off, and sticky parts like the Chat box preview still work) */
main::before{content:"";position:absolute;width:35rem;height:35rem;right:-10rem;top:-15rem;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(163,18,26,.12)),transparent 68%);animation:drift 16s ease-in-out infinite alternate;pointer-events:none}
.top,.wrap{position:relative;z-index:1}
@keyframes drift{to{transform:translate(-7.5rem,5.625rem) scale(1.15)}}
.line{flex-wrap:wrap;transition:opacity .25s,transform .25s}.line.out{opacity:0;transform:translateX(1.5rem)}
.eform .grow{display:flex;flex-direction:column;gap:0.5rem;min-width:13.75rem}
.eform input,.eform select{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0.625rem 0.75rem;border-radius:0.5rem;font:0.9375rem 'Outfit','Tajawal',sans-serif}
.btn.sm{padding:0.625rem 1.125rem;font-size:0.9375rem}
.ghost{background:none;border:1px solid var(--line);color:var(--soft);padding:0.625rem 1rem;border-radius:0.5rem;font:500 0.9375rem 'Outfit','Tajawal',sans-serif;cursor:pointer}.ghost:hover{color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(0.25rem);display:none;align-items:center;justify-content:center;padding:1.25rem;z-index:50}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:30rem;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red2);border-radius:0.75rem;padding:1.5rem;box-shadow:0 1.5rem 3.75rem rgba(0,0,0,.55);animation:pop2 .35s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop2{from{opacity:0;transform:translateY(1.125rem) scale(.95)}}
.sheet h2{margin:0 0 0.875rem;font-size:1.375rem;font-weight:600}
.sheet label{display:block;font-weight:500;font-size:0.875rem;margin:0.875rem 0 0.375rem}
.sheet input,.sheet textarea,.sheet select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0.6875rem 0.875rem;border-radius:0.5rem;font:0.9375rem 'Outfit','Tajawal',sans-serif;resize:vertical}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:0.875rem}
.mact{display:flex;justify-content:flex-end;gap:0.625rem;margin-top:1.375rem}
.err{border-color:var(--red2)!important}
.sheet{max-width:35rem;max-height:92vh;overflow-y:auto}
.hint{margin:0 0 0.25rem;color:var(--mute);font-size:0.8125rem;line-height:1.45}
.sheet label+.hint,.sheet textarea+.hint{margin-top:0.625rem}
.sub{color:var(--mute);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:0.375rem;margin-top:0.5rem}
.chip{display:inline-flex;align-items:center;gap:0.4375rem;background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:0.375rem;padding:0.375rem 0.625rem;cursor:pointer;font:500 0.8125rem ui-monospace,Menlo,Consolas,monospace;transition:background .2s,border-color .2s,transform .15s}
.chip i{width:0.5rem;height:0.5rem;border-radius:50%;display:inline-block}
.chip:hover{border-color:var(--red2);transform:translateY(-1px)}.chip:active{transform:scale(.95)}
.chip.on{background:var(--red);border-color:var(--red2);color:var(--on-red,#fff)}
#annchips .chip{font-family:'Outfit','Tajawal',sans-serif;font-size:0.875rem}
.al{display:block;color:var(--mute);font-size:0.75rem;margin-top:3px}
.tip{position:fixed;z-index:80;max-width:16.25rem;background:var(--text);color:var(--bg);padding:0.625rem 0.75rem;border-radius:0.5rem;font-size:0.8125rem;line-height:1.4;display:flex;flex-direction:column;gap:0.25rem;pointer-events:none;opacity:0;transform:translateY(0.25rem) scale(.97);transition:opacity .15s,transform .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0.625rem 1.75rem rgba(0,0,0,.45)}
.tip.below{transform:translateY(-0.25rem) scale(.97)}
.tip.on{opacity:1;transform:none}
.tip b{font:600 0.8125rem ui-monospace,Menlo,Consolas,monospace;color:var(--red2)}
.tip em{font-style:normal;opacity:.7;font-size:0.75rem}
.eform .hint{margin:0}.eform .chips{margin-top:0}

:root[dir=rtl]{--dx:0.875rem}
[dir=rtl] .sw[aria-checked=true]::after{transform:translateX(-1.25rem)}
[dir=rtl] .row:not(.head):hover,[dir=rtl] .card.red{box-shadow:inset -3px 0 0 var(--red2)}
[dir=rtl] main::before{right:auto;left:-10rem}
[dir=rtl] .line.out{transform:translateX(-1.5rem)}
[lang=ar] .brand small{letter-spacing:0;font-size:0.875rem}
[lang=ar] body{line-height:1.55}
[lang=ar] .cmd,[lang=ar] .chip{font-family:ui-monospace,Menlo,Consolas,'Tajawal',monospace}
[lang=ar] #annchips .chip{font-family:'Outfit','Tajawal',sans-serif}
.xtra{border-style:dashed}
.hint.warn{color:#f59e0b}
[hidden]{display:none!important}
.view.on{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(0.625rem)}}
.fresh .row:not(.head){animation:rowIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(var(--dx,-0.875rem))}}
.row{transition:background .2s,box-shadow .2s}
.cmd{transition:background .2s,transform .2s}.cmd:hover{background:var(--red);color:var(--on-red,#fff);transform:translateY(-1px)}
.cmd:active{transform:scale(.95)}
.btn{transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0.625rem 1.5rem -0.5rem var(--red2)}.btn:active{transform:scale(.96)}
.sw::after{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.sw[aria-checked=true]{box-shadow:0 0 0.5rem -0.25rem var(--red2)}
.sw:active::after{width:1.5rem}
.card{transition:transform .25s,border-color .25s}.card:hover{transform:translateY(-3px);border-color:var(--red2)}
.dot{animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}100%{box-shadow:0 0 0 0.5rem rgba(74,222,128,0)}}
.menu.open{animation:pop .22s cubic-bezier(.34,1.56,.64,1);transform-origin:bottom}
@keyframes pop{from{opacity:0;transform:translateY(0.5rem) scale(.94)}}
.toast{transform:translate(-50%,0.75rem);transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}

/* ---- linked-dashboard additions ---- */
:root[data-theme="light"] .sw::after{background:#fff}
.lvl.sub{background:#2d2250;color:#c4a8ff}.lvl.vip{background:#4a1d38;color:#ff9ccf}.lvl.bc{background:#4a1518;color:#ff9a9a}
:root[data-theme="light"] .lvl.sub{background:#ece4ff;color:#5b34b0}:root[data-theme="light"] .lvl.vip{background:#ffe3f1;color:#a01d62}:root[data-theme="light"] .lvl.bc{background:#ffe0e0;color:#a31616}
.row.dim .msg,.row.dim .cmd{opacity:.5}
.row .bi{font-size:0.8125rem;color:var(--mute);justify-self:center}
.who i.st-ok{color:#3fb871}.who i.st-wait{color:#f59e0b}.who i.st-off{color:var(--mute)}
.who i.st-wait .dot,.who i.st-off .dot{animation:none}
.menu button.neutral{color:var(--text)}.menu button.neutral:hover{background:var(--hover)}
.banner{display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;margin:1.125rem 1.625rem 0;padding:0.75rem 1.125rem;border-radius:0.625rem;border:1px solid var(--line);background:var(--panel);position:relative;z-index:2}
.banner.bad{border-color:#b4161d;background:rgba(180,22,29,.12)}.banner.warn{border-color:#f59e0b;background:rgba(245,158,11,.1)}.banner.info{border-color:var(--red2)}
.banner span{flex:1;min-width:12.5rem}.banner .code{font:600 1.25rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;margin-inline:0.375rem;padding:2px 0.625rem;border-radius:0.375rem;background:var(--chip);color:var(--text)}
.bbtn{background:var(--red);color:var(--on-red,#fff);border:1px solid var(--red2);padding:0.5rem 1rem;border-radius:0.5rem;font:500 0.875rem 'Outfit','Tajawal',sans-serif;cursor:pointer;text-decoration:none}
.bbtn:hover{background:var(--red2)}
.btn.danger{background:#b4161d;border-color:#d11f27}.btn.danger:hover{background:#d11f27}
.btn:disabled{opacity:.6;cursor:wait}
.sheet.small{max-width:26.25rem}
.ngrp.devgrp{margin-top:1.375rem;border-top:1px solid var(--line);padding-top:1.125rem}
.ngrp{font-size:0.6875rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);opacity:.85;padding:1rem 0.875rem 0.375rem}
.ngrp:first-of-type{padding-top:2px}
@media (min-width:1181px){aside .ngrp:not(:first-of-type){border-top:1px solid var(--line);margin:0.5rem 0.875rem 0;padding-inline:0}}   /* 1.15.0 (owner): a thin line between the sidebar sections (the slim sidebar has its own) */
nav a{padding-top:0.5625rem;padding-bottom:0.5625rem;margin-bottom:3px}
.nb{margin-inline-start:auto;font-style:normal;font-size:0.75rem;font-weight:600;line-height:1.55;min-width:1.5rem;text-align:center;padding:0 0.5rem;border-radius:62.4375rem;border:1px solid var(--line);background:var(--chip);color:var(--mute);transition:background .25s,color .25s,border-color .25s}
nav a.on .nb{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:var(--on-red,#fff)}
/* ---- tutorial: top-bar button, checklist, tour ---- */
.topr{display:flex;align-items:center;gap:0.625rem;flex-shrink:0}
button.supbtn{font-family:inherit;cursor:pointer}
.supbtn .qm{width:1.125rem;height:1.125rem;color:var(--red2);flex:none}
.toast{z-index:300}
/* 1.17.0 (owner): Import from Nightbot */
.nbbtn{display:inline-flex;align-items:center;gap:0.4rem}
.nbm .sheet{width:min(60rem,calc(100vw - 2rem));max-width:none}
.nbsteps{display:flex;gap:0.5rem;margin:0.25rem 0 1rem;font-size:0.75rem;color:var(--mute)}.nbsteps span{padding:0.2rem 0.6rem;border:1px solid var(--line);border-radius:1rem}.nbsteps .on{color:var(--text);border-color:var(--red);background:rgba(154,17,24,.18)}
.nbways{display:grid;grid-template-columns:1fr 1fr;gap:0.875rem}@media (max-width:760px){.nbways{grid-template-columns:1fr}}

/* the page opened through an editor link: only the tools, no account, no app buttons */
.remote #me,.remote #tourBtn,.remote #plbtn,.remote #edlbtn,.remote #shwrap,.remote #dpage,.remote .menu,.remote #bacsw,.remote #bkrow{display:none!important}
.rmbar{display:flex;flex-wrap:wrap;align-items:center;gap:0.375rem 0.875rem;margin:0 1.375rem;padding:0.625rem 0.875rem;border:1px solid color-mix(in srgb,#f5b850 45%,transparent);background:color-mix(in srgb,#f5b850 10%,transparent);border-radius:0.75rem;font-size:0.875rem}
.rmbar>span{color:var(--soft)}
.rmleft{margin-inline-start:auto;font-weight:600;color:var(--text)!important}
.rmlast{flex-basis:100%;display:flex;flex-wrap:wrap;gap:0.375rem 0.875rem;font-size:0.8125rem;color:var(--soft)}
.rmch{display:inline-flex;align-items:center;gap:0.375rem}
.edlbtn{display:inline-flex;align-items:center;gap:0.5rem}
.eldot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--mute)}
.edlbtn.on .eldot{background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.2)}
.edlsheet{max-width:35rem}
.edlbody p{margin:0 0 0.625rem}
.edlbody .note{margin:0.5rem 0 0}
.edlul{margin:0 0 0.375rem;padding-inline-start:1.25rem;color:var(--soft);font-size:0.875rem;line-height:1.6}
.edlok{color:#2fbf71;font-weight:600}
.edlrow{display:flex;flex-direction:column;gap:0.375rem;margin:0.75rem 0 0}
.edlrow label{font-size:0.8125rem;font-weight:600;color:var(--soft)}
.edlval{display:flex;gap:0.5rem;align-items:center}
.edlval code{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:0.5rem;padding:0.5625rem 0.625rem;font-size:0.8125rem;overflow-wrap:anywhere}
#edlpw{font-size:1.25rem;font-weight:700;letter-spacing:.12em}
#edlmodal .mact{flex-wrap:wrap}
#edlmodal .edlcx{color:#e5484d;margin-inline-end:auto}
/* ===== Bot accounts (1.12.0) ===== */
body.bamulti #v-botaccount>.panel:not(#bapart){display:none}      /* the single-bot settings: replaced by the shared list */
.bambody{padding:1rem 1.375rem 1.25rem}
#bamulti .h2row{padding-inline-end:1rem;gap:0.625rem}
.bamwho{display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.75rem}
.bamwho label{font-size:0.875rem;font-weight:600;color:var(--soft)}
.bamwho select{max-width:26.25rem}
.bamst{display:flex;gap:0.625rem;align-items:flex-start;border-radius:0.625rem;padding:0.625rem 0.75rem;font-size:0.875rem;line-height:1.5}
.bamst .cdot{margin-top:0.375rem}
.bamst.ok{background:color-mix(in srgb,#2fbf71 12%,transparent)}
.bamst.wait{background:color-mix(in srgb,#f5b850 14%,transparent)}
.bamst.bad{background:color-mix(in srgb,#e5484d 14%,transparent)}
.cdot.bad{background:#e5484d}
.bamnote{display:flex;align-items:center;gap:0.75rem;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,#f5b850 16%,transparent);border-radius:0.625rem;padding:0.625rem 0.75rem;margin-bottom:0.875rem;font-size:0.875rem}
.bamrow{display:flex;align-items:center;gap:0.75rem;padding:0.75rem 0;border-top:1px solid var(--line)}
.bamrow:first-child{border-top:0}
.bamrow .grow{flex:1;min-width:0}
.bamrow small{display:block;color:var(--mute);font-size:0.8125rem}
.bamchips{display:flex;flex-wrap:wrap;gap:0.375rem;margin-top:0.375rem}
.bamchip{display:inline-flex;align-items:center;gap:0.375rem;border:1px solid var(--line);background:var(--chip);border-radius:62.4375rem;padding:2px 0.625rem;font-size:0.8125rem}
.bamcode{display:flex;flex-direction:column;gap:0.375rem;border:1px dashed var(--line);border-radius:0.625rem;padding:0.75rem;margin-bottom:0.75rem;font-size:0.875rem}
.bamcode code{font-size:1.375rem;font-weight:700;letter-spacing:.12em}
.bamerr{color:#e5484d;margin:0 0 0.75rem}
/* ===== Channels (1.12.0): the switcher in the top bar ===== */
.chsw{position:relative;z-index:80;flex:0 1 auto;min-width:0}   /* its list opens over the page below */
.top{z-index:5}   /* (1.12.0) the top bar above the page, so the channel list can open over it */
.chsw[hidden]{display:none}
.chbtn{display:flex;align-items:center;gap:0.625rem;max-width:27.5rem;border:1px solid var(--line);background:var(--panel);border-radius:0.875rem;padding:0.375rem 0.75rem 0.375rem 0.375rem;color:var(--text);font:inherit;cursor:pointer;text-align:start}
.chbtn:hover,.chbtn[aria-expanded=true]{border-color:var(--red2)}
.chbtn:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.chav{width:2.125rem;height:2.125rem;border-radius:0.625rem;flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-red,#fff);font-weight:700;font-size:0.9375rem}
.chtx{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.chtx small{font-size:0.6875rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.chtx b{font-size:0.9375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chmeta{display:flex;align-items:center;gap:0.375rem;font-size:0.8125rem;color:var(--soft);white-space:nowrap;padding-inline-start:0.625rem;border-inline-start:1px solid var(--line)}
.chcaret{color:var(--mute);font-size:0.75rem}
.cdot{display:inline-block;width:0.5625rem;height:0.5625rem;border-radius:50%;flex:none;background:var(--mute)}
.cdot.ok{background:#2fbf71}.cdot.live{background:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.25)}.cdot.wait{background:#f5b850}.cdot.off{background:var(--mute)}
.chmenu{position:absolute;top:calc(100% + 0.5rem);inset-inline-start:0;z-index:60;width:23.75rem;max-width:calc(100vw - 2rem);background:var(--panel);border:1px solid var(--line);border-radius:0.875rem;box-shadow:0 1rem 2.5rem rgba(0,0,0,.45);padding:0.5rem}
.chmenu[hidden]{display:none}
.chmh{font-size:0.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:0.375rem 0.5rem 0.5rem}
.chrow{display:flex;align-items:center;gap:0.25rem;border-radius:0.625rem}
.chrow.on{background:color-mix(in srgb,var(--red2) 12%,transparent)}
.chpick{flex:1;min-width:0;display:flex;align-items:center;gap:0.625rem;background:none;border:0;color:var(--text);font:inherit;padding:0.5rem;border-radius:0.625rem;cursor:pointer;text-align:start}
.chpick:hover{background:var(--chip)}
.chpick .chtx small{text-transform:none;letter-spacing:0;font-size:0.75rem;display:flex;align-items:center;gap:0.375rem;white-space:normal}
.chpick em{color:#f5b850;font-style:normal}
.chcheck{color:var(--red2);font-weight:700}
.chrm{width:1.875rem;height:1.875rem;border:0;border-radius:0.5rem;background:none;color:var(--mute);font-size:1.125rem;cursor:pointer;flex:none}
.chrm:hover{background:var(--chip);color:var(--text)}
.chadd{display:block;width:100%;margin-top:0.375rem;border:1px dashed var(--line);background:none;color:var(--red2);font:inherit;font-weight:600;padding:0.625rem;border-radius:0.625rem;cursor:pointer}
.chadd:hover{border-color:var(--red2)}
.chnote{color:var(--mute);font-size:0.75rem;margin:0.5rem 0.375rem 2px;line-height:1.45}
/* the channel list inside the account menu (bottom left) */
.menu:has(.chrow){width:19.5rem}
#menuinfo .chmh{padding:0.5rem 0.625rem 0.375rem}
#menuinfo .chrow{margin:0 2px}
#menuinfo .chpick{padding:0.4375rem 0.5rem;flex:1 1 auto;min-width:0;width:auto;color:var(--text)}
#menuinfo .chrm{color:var(--mute)}#menuinfo .chrm:hover{color:var(--text)}
#menuinfo .chrm{width:1.875rem;height:1.875rem;flex:none;padding:0;display:inline-flex;align-items:center;justify-content:center;margin-inline-end:0.25rem;font-size:0.8125rem}
#menuinfo .chav{width:1.875rem;height:1.875rem;border-radius:50%;font-size:0.8125rem}
#menuinfo img.chav{object-fit:cover;background:var(--chip)}
#menuinfo .chtx b{font-size:0.875rem}
#menuinfo .chpick .chtx small{font-size:0.7188rem}
.chadd.mrow{display:flex;align-items:center;gap:0.625rem;color:var(--text)}
.chplus{width:1.875rem;height:1.875rem;border-radius:50%;border:1px dashed var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--soft);flex:none}
.bamacts{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.25rem}
.bamok,.bamwait{display:flex;align-items:center;gap:0.5rem;margin:0 0 0.75rem;font-size:0.875rem}
.bamok{color:#2fbf71}
@media (max-width:1100px){.chmeta{display:none}}
/* ===== Support page (1.11.0) ===== */
.spcard{max-width:45rem;padding:1.375rem}
.sphead{display:flex;gap:0.75rem;align-items:center;margin-bottom:1.125rem}
.sphead b{display:block;font-size:1rem}
.sphead small{color:var(--mute);font-size:0.875rem}
.spico{width:2.5rem;height:2.5rem;border-radius:0.625rem;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--soft);flex:none}
.spkind{display:grid;grid-template-columns:1fr 1fr;gap:0.625rem;margin-bottom:1.125rem}
.spkind button{display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.75rem;border-radius:0.625rem;border:1px solid var(--line);background:var(--bg);color:var(--soft);font:inherit;font-size:0.9375rem;font-weight:600;cursor:pointer}
.spkind button:hover{color:var(--text)}
.spkind button[data-kind=suggestion].on{background:#e5b74b;border-color:#e5b74b;color:#2a1f05}
.spkind button[data-kind=problem].on{background:#c8323b;border-color:#c8323b;color:var(--on-red,#fff)}
.spkind button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.splab{display:block;font-size:0.875rem;font-weight:600;color:var(--soft);margin:0 0 0.5rem}
#sptext,#spcontact{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0.75rem 0.875rem;border-radius:0.625rem;font:0.9375rem 'Outfit','Tajawal',sans-serif}
#sptext{min-height:8.75rem;resize:vertical;line-height:1.5}
#sptext:focus,#spcontact:focus{outline:none;border-color:var(--red2)}
#sptext::placeholder,#spcontact::placeholder{color:var(--mute)}
.spcount{text-align:end;color:var(--mute);font-size:0.8125rem;margin:0.25rem 0 0.75rem}
.spcount.bad{color:#e5484d}
.spimgs{display:flex;flex-wrap:wrap;gap:0.625rem;margin-bottom:0.625rem}
.spimgs[hidden]{display:none}
.spimg{position:relative;width:6rem;height:6rem;border-radius:0.625rem;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.spimg img{width:100%;height:100%;object-fit:cover}
.spimg button{position:absolute;top:0.25rem;inset-inline-end:0.25rem;width:1.5rem;height:1.5rem;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:var(--on-red,#fff);font-size:0.9375rem;line-height:1;cursor:pointer}
.spdrop{display:flex;flex-wrap:wrap;align-items:center;gap:0.625rem;border:1px dashed var(--line);border-radius:0.625rem;padding:0.75rem;margin-bottom:1rem}
.spdrop.over{border-color:var(--red2);background:color-mix(in srgb,var(--red2) 8%,transparent)}
.spcard .spdrop .note{margin:0}
.spcheck{display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;color:var(--soft);margin:0 0 1rem;cursor:pointer}
.spcheck[hidden]{display:none}
.spcheck input{width:auto;min-height:0;margin:0}
.spcard .note.sphint{margin:0.375rem 0 1rem}
.spcard .note.spneed{color:#f5b850;margin:0 0 0.75rem}
.spfoot{display:flex;align-items:center;gap:0.875rem;flex-wrap:wrap}
#spsend{display:inline-flex;align-items:center;gap:0.5rem}
.spstat{font-size:0.875rem;color:var(--soft)}
.spstat.ok{color:#2fbf71}
.spstat.bad{color:#e5484d}
.spcard .note.sppriv{margin:1rem 0 0}
body.asleep *,body.asleep *::before,body.asleep *::after{animation-play-state:paused!important}   /* nobody sees the window: no animation work */
.mfsec+.note+.note{margin:0.375rem 0 0}
.mgwcat{max-width:11.875rem}
.mfsec label.mfcheck{display:inline-flex;align-items:center;gap:0.375rem;margin:0}   /* category checkboxes: box beside its name (both games) */
.mfsec label.mfcheck input{width:auto;min-height:0;margin:0;padding:0}
.tag .mgwc{color:var(--mute);font-size:0.75rem;margin-inline-start:2px}
/* 1.9.0: All games panel, and a command's names as chips */
.mgsh{margin:1rem 0}
.mgsh h2{margin:0}
.mgshs{margin:0;padding:0.875rem 1.375rem 0;color:var(--mute);font-size:0.875rem}
.mgkvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.375rem,1fr));gap:0.625rem;padding:0.875rem 1.375rem 1.25rem}
.mgkv{display:flex;flex-direction:column;gap:0.375rem;border:1px solid var(--line);border-radius:0.625rem;padding:0.625rem 0.875rem;background:var(--bg);font-size:0.875rem;min-width:0}
.mgkv span{color:var(--mute)}
.mgkv b{font-weight:600;display:flex;flex-direction:column;gap:2px}
.mgkv b small{font-weight:400;color:var(--soft);font-size:0.8125rem}
.mgkv b.mgchips{flex-direction:row;flex-wrap:wrap;gap:0.375rem}
.mgchip{border:1px solid var(--line);background:var(--chip);border-radius:62.4375rem;padding:2px 0.625rem;font-size:0.8125rem;font-weight:600}
.mgal label{display:block;font-size:0.875rem;color:var(--soft);margin-bottom:0.375rem}
.mgalbox{display:flex;flex-wrap:wrap;align-items:center;gap:0.375rem;min-height:2.875rem;border:1px solid var(--line);background:var(--bg);border-radius:0.625rem;padding:0.375rem 0.5rem;cursor:text}
.mgalbox:focus-within{border-color:var(--red2)}
.mgalbox .tag{margin:0}
.mgalbox input{flex:1;min-width:6.875rem;border:0!important;background:transparent!important;padding:0.25rem 2px!important;box-shadow:none!important;outline:none;min-height:0}     /* a hint right under a section (mini game settings): never pulled up onto the boxes */
.usenote b{display:block;font-weight:600;margin-bottom:0.25rem}.usenote small{display:block;line-height:1.5}.uselist{margin:0.375rem 0;padding-inline-start:1.375rem;color:var(--soft);font-size:0.875rem;line-height:1.6}
.stalloff .stblock:not(.sttim){opacity:.5}   /* all stream messages switched off: the four messages look paused (still editable) */
/* ---- public command list: the header button, its box, and the switch in the command editor ---- */
.hbtns{display:flex;align-items:stretch;gap:0.625rem;flex-wrap:wrap}
.plbtn{display:inline-flex;align-items:center;gap:0.5rem}
.pldot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--off);flex:none;transition:background .2s}
.plbtn.on .pldot{background:#3fb871}.plbtn.wait .pldot{background:#f59e0b}.plbtn.bad .pldot{background:#e5484d}
.sheet.pls{max-width:35rem}
/* 1.18.0: the Twitch panel */
.tps .nbway{margin-top:0.75rem}
.tpst{list-style:none;margin:0.5rem 0 0;padding:0;display:flex;flex-direction:column;gap:0.375rem;font-size:0.875rem}
.tpst li{display:flex;gap:0.5rem;align-items:baseline;color:var(--soft)}
.tpst li::before{content:"";width:0.5rem;height:0.5rem;border-radius:50%;background:var(--off);flex:none;transform:translateY(-1px)}
.tpst li.ok::before{background:#3fb871}.tpst li.warn::before{background:#f59e0b}.tpst li.bad::before{background:#e5484d}
.tpst li b{color:var(--text);font-weight:600}
.tpwzpv{display:flex;flex-direction:column;gap:0.625rem;border-top:1px solid var(--line);padding-top:0.75rem;margin-top:0.25rem}
.tpwzok{margin:0;font-size:0.875rem;color:var(--text)}
.tpwzgrid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.tpwzgrid b{font-size:0.8125rem;color:var(--soft);font-weight:600}
.tpwzgrid ol{margin:0.25rem 0 0;padding-inline-start:1.2rem;font-size:0.8125rem;color:var(--text);line-height:1.7}
.tpwzgrid ol span{color:var(--soft);margin-inline-start:0.375rem}
.tpwzunit{display:flex;align-items:center;gap:0.625rem;flex-wrap:wrap;font-size:0.8125rem;color:var(--soft)}
.tpwzdone{color:#3fb950;margin:0}
@media(max-width:560px){.tpwzgrid{grid-template-columns:1fr}}
/* 1.18.0: the public page's banner */
.plban{margin-top:1.125rem;padding-top:1rem;border-top:1px solid var(--line)}.plban>b{display:block;font-weight:600}.plban>small{display:block;color:var(--mute);font-size:0.8125rem;line-height:1.45;margin-bottom:0.625rem}
.plbanpv{position:relative;aspect-ratio:2.6;border-radius:0.625rem;overflow:hidden;background:var(--bg);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:0.625rem}
.plbanpv.has{border-style:solid}.plbanpv span{color:var(--mute);font-size:0.8125rem}
.plbanpv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(180deg,#000 35%,transparent 100%);mask-image:linear-gradient(180deg,#000 35%,transparent 100%)}
.plbanps{display:inline-flex;align-items:center;gap:0.5rem;color:var(--mute);font-size:0.8125rem;margin-inline-start:auto}.plbanps .seg button{padding:0.25rem 0.5625rem;font-size:0.8125rem}
.plbanps[hidden]{display:none}
.plhead{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;margin-bottom:0.375rem}
.plhead h2{margin:0!important;flex:1;min-width:0}
.plhead .pause{padding:0}
.plrow{display:flex;align-items:center;gap:0.625rem;flex-wrap:wrap}
.pllink{flex:1 1 13.75rem;min-width:0;display:block;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0.625rem 0.875rem;border-radius:0.5rem;font:0.875rem ui-monospace,Consolas,monospace;overflow-wrap:anywhere;user-select:all;text-align:left}
.plst{margin-top:0.75rem}
.plstat{flex:1 1 12.5rem;min-width:0;font-size:0.875rem}
.pl-ok{color:#3fb871}.pl-wait{color:#f59e0b}.pl-bad{color:#e5484d}.pl-off{color:var(--mute)}
.plnote{margin-top:0.75rem}
.plhid{color:var(--mute)}
.pubrow{display:flex;align-items:center;gap:1rem;margin-top:1rem;padding-top:0.875rem;border-top:1px solid var(--line)}
.pubrow .grow{min-width:0}
.pubrow .grow>span{display:block;font-weight:500;font-size:0.9375rem}.pubrow .grow small{display:block;color:var(--mute);font-size:0.8125rem;margin-top:2px;line-height:1.4}
/* ---- shortcut commands (What it does: change the game / title) ---- */
.sheet[data-act=game] .txo,.sheet[data-act=title] .txo{display:none!important}
/* 1.13.0: Pin first message, Reply to the sender, grouped variables */
.sheet:not([data-act=pinfirst]) .pino{display:none!important}
.sheet[data-act=pinfirst] .nopin{display:none!important}
.sheet[data-act=pinfirst]:not([data-prep=on]) .pinr{display:none!important}
.selnew{position:relative}.selnew .newb{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:calc(1ch * var(--nbx,18) + 1.125rem);pointer-events:none}
.newb{display:inline-block;font:600 0.6875rem 'Outfit','Tajawal',sans-serif;letter-spacing:.02em;line-height:1.5;padding:0 0.375rem;border-radius:0.25rem;background:var(--red);color:var(--on-red,#fff);white-space:nowrap}
.chip .newb{margin-inline-start:2px}
.newb[hidden]{display:none!important}
#pinblock .pubrow:first-of-type{margin-top:1rem}
#pinblock .pubrow .grow,#mreplyrow .pubrow .grow{flex:1}#pinblock .pubrow .sw,#mreplyrow .pubrow .sw{flex:none}
#pinblock .pinlive{margin-top:0.875rem}#pwords+.hint{margin-top:0.5rem}#mreplyrow+.hint{margin-top:0.875rem}
#mreplyrow .pubrow{margin-top:0.75rem;padding-top:0.75rem}
#pwords,#machips{align-items:center}
.pw{display:inline-flex;align-items:center;gap:0.25rem;background:var(--chip);border:1px solid var(--line);border-radius:0.375rem;padding:0.25rem 0.25rem 0.25rem 0.625rem;font-size:0.8125rem}
[dir=rtl] .pw{padding:0.25rem 0.625rem 0.25rem 0.25rem}
.pw button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:0.9375rem;line-height:1;padding:2px 0.375rem;border-radius:0.25rem}
.pw button:hover,.pw button:focus-visible{color:var(--text);background:var(--line)}
#pwin,#main{width:auto;min-width:0;max-width:9.375rem;padding:0.3125rem 0.625rem;font-size:0.8125rem;border-style:dashed}#main{max-width:13rem;width:13rem}
#varchips.chips{display:block;margin-top:2px}
.vg{margin-top:0.625rem}.vg[hidden]{display:none}
.vgh{display:block;font-size:0.75rem;color:var(--mute);margin:0 0 0.375rem;font-weight:500}
.vgc{display:flex;flex-wrap:wrap;gap:0.375rem}

/* 1.13.0: Giveaways */
#v-giveaways input,#v-giveaways select{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0.5625rem 0.75rem;border-radius:0.5rem;font:0.9375rem 'Outfit','Tajawal',sans-serif}

.gdel{border:1px solid var(--line);background:none;color:var(--mute);border-radius:0.5rem;width:2.375rem;height:2.375rem;cursor:pointer;font-size:1.25rem;line-height:1;flex-shrink:0}.gdel:hover{color:#ff3b3b;border-color:#ff3b3b}
.pill-b{font-size:0.75rem;font-weight:600;padding:3px 0.5625rem;border-radius:62.4375rem;background:var(--chip);color:var(--soft);margin-inline-start:0.5rem}
.pause.grn.on span{color:#3fb871}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.h2row h2{border:0!important;flex:1}
.pause{display:flex;align-items:center;gap:0.75rem;padding:0 1.5rem;color:var(--mute);font-size:0.875rem}
.pause.on span{color:#f59e0b}
.av{object-fit:cover;background:var(--chip)}
.sheet [data-for]{display:none}
.sheet[data-kind=command] [data-for~=command],.sheet[data-kind=timer] [data-for~=timer],.sheet[data-kind=greeting] [data-for~=greeting],.sheet[data-kind=alert] [data-for~=alert]{display:block}
.cnt{font-size:0.75rem;color:var(--mute);text-align:end;margin-top:0.25rem}.cnt.over{color:#ff6b6b}
.merr{color:#ff6b6b;margin:0.875rem 0 0;font-size:0.875rem}
.cards{grid-template-columns:repeat(auto-fit,minmax(13.125rem,1fr))}
.card small{display:block;color:var(--mute);font-size:0.8125rem;margin-top:0.25rem}
.card b.s{font-size:1.375rem;margin-top:0.75rem}
.tags{display:flex;flex-wrap:wrap;gap:0.5rem;padding:1rem 1.5rem 1.25rem}
.tag{display:inline-flex;align-items:center;gap:0.5rem;background:var(--chip);border:1px solid var(--line);border-radius:62.4375rem;padding:0.375rem 0.5rem 0.375rem 0.875rem;font-size:0.875rem}
[dir=rtl] .tag{padding:0.375rem 0.875rem 0.375rem 0.5rem}
.tag button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1rem;line-height:1;padding:2px 0.375rem;border-radius:50%}
.tag button:hover{color:#ff3b3b}
.addrow{display:flex;gap:0.625rem;padding:1rem 1.5rem 0}
.addrow input{flex:1;max-width:21.25rem;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0.625rem 0.875rem;border-radius:0.5rem;font:0.9375rem 'Outfit','Tajawal',sans-serif}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(18.75rem,1fr));gap:1rem}
.pill-b{font-size:0.75rem;font-weight:600;padding:3px 0.5625rem;border-radius:62.4375rem;background:var(--chip);color:var(--soft);margin-inline-start:0.5rem}
.field input[type=number]{max-width:11.25rem}
.note{color:var(--mute);margin:-0.5rem 0 1rem;font-size:0.875rem}
.loading{padding:1.875rem;text-align:center;color:var(--mute)}
.cmd{max-width:100%}.cmd .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cmd.static{cursor:default}.cmd.static:hover{background:var(--chip);color:var(--text);transform:none}

</style>
</head>

hat that person gave in total. Try them under the chat.",tcg_m5:"Your mods can manage commands from chat: `!cmadd !name text`, `!cmedit`, `!cmdel`.",tr28_t:"Test chat",tr28_d:"Try everything here before you go live: write as any viewer and see what the bot answers, pretend a sub or a donation, and use Recipes and Variables to make better commands. The Commands tab lists all of yours: Send one to try it, or type ! in the message box. Nothing reaches Twitch. Many variables also take a name, like $(followage $(touser)).",nav_giveaways:"Giveaways",gw_title:"Giveaways",gw_sub:"Draw a winner from your chat, like Nightbot's giveaways. Pick a type, start it, then draw.",gw_practice:"Practice in the Test chat",gw_practice_s:"Run a pretend giveaway that only the Test chat sees. Nothing is said on Twitch.",gw_practice_on:"Practice: this giveaway runs in the Test chat only. Join and guess from there, as any pretend viewer.",gw_open_tc:"Open Test chat",gw_type:"Giveaway type",gw_ty_active:"Active chatters",gw_ty_active_d:"A random person who wrote in chat lately. Nobody has to join.",gw_ty_keyword:"Keyword",gw_ty_keyword_d:"Viewers type a word, like !join, to enter. Then you draw.",gw_ty_number:"Random number",gw_ty_number_d:"The bot picks a secret number. The first viewer to guess it wins.",gw_window:"Wrote in chat in the last",gw_mins:"{n} minutes",gw_since:"Only since the giveaway started",gw_since_s:"People who wrote before you pressed Start don't count.",gw_keyword:"Keyword",gw_keyword_s:"What viewers type to join (capitals don't matter).",gw_auto:"Close entries automatically",gw_auto_off:"Never (I close them)",gw_after:"After {n} min",gw_min:"Lowest number",gw_max:"Highest number",gw_level:"Who can enter",gw_lv_everyone:"Everyone",gw_lv_subscriber:"Subscribers (and VIPs, mods)",gw_lv_vip:"VIPs and mods",gw_lv_moderator:"Moderators",gw_luck:"Subscriber luck",gw_luck_s:"A subscriber counts this many times when drawing.",gw_followers:"Followers only",gw_followers_s:"Checked with Twitch when drawing: someone who doesn't follow is skipped.",gw_announce:"Announce in chat",gw_announce_s:"The bot says when entries open and close, or which numbers to guess.",gw_say:"Say the winner in chat",gw_say_s:"The bot congratulates the winner.",gw_msgs:"Chat messages",gw_msgs_s:"Leave a box empty to use the message shown in it. You can use {keyword}, {count}, {winner}, {number}, {min} and {max}.",gw_t_open:"When it opens",gw_t_close:"When entries close",gw_t_win:"The winner",gw_def_open_k:"🎉 Giveaway open! Type {keyword} in chat to join.",gw_def_open_n:"🔢 Guess the number between {min} and {max}! The first right guess wins.",gw_def_close:"⏹️ Entries are closed! {count} joined. Good luck!",gw_def_win:"🎉 {winner} won the giveaway! Congratulations!",gw_def_win_n:"🎯 {winner} guessed the number {number} and won the giveaway!",gw_st_idle:"Not started",gw_st_open:"Open",gw_st_closed:"Closed",gw_st_running:"Running",gw_start_active:"Start",gw_start_keyword:"Open entries",gw_start_number:"Start guessing",gw_close:"Close entries",gw_close_num:"Stop guessing",gw_draw:"Draw winner",gw_reroll:"Reroll",gw_clear:"Clear",gw_clear_q:"Clear this giveaway?",gw_clear_b:"Everyone who joined and the winner are removed. Your settings and the winners list stay.",gw_closes_in:"closes in {t}",gw_secret:"Secret number:",gw_show:"Show",gw_hide:"Hide",gw_winner:"Winner",gw_nowin:"No winner yet. Start a giveaway, then draw.",gw_nowin_num:"The first viewer who guesses the number wins.",gw_drawn:"Drawn {t} ago",gw_guessed:"guessed the number {n}",gw_wmsgs:"What {n} wrote since the draw",gw_wmsgs0:"Nothing yet. A winner who's watching usually answers.",gw_ent:"Entries ({n})",gw_guessers:"Guessed ({n})",gw_can:"{n} can win right now",gw_can_s:"Everyone who wrote in chat in the chosen time and can enter. One of them is picked when you draw.",gw_none:"Nobody yet.",gw_search:"Search",gw_rm:"Remove {n}",gw_sub_tag:"sub",gw_hist:"Winners",gw_hist0:"No winners yet.",gw_offline:"The bot isn't connected, so it can't see chat right now.",gw_e_keyword:"The keyword must be 1 to 30 characters.",gw_e_range:"The highest number must be bigger than the lowest.",gw_e_empty:"Nobody can win: no one entered, or everyone was already drawn.",gw_e_idle:"Start a giveaway first.",gw_e_number:"In a random number giveaway, the first right guess wins.",gw_e_text:"A message can be at most 400 characters.",tr29_t:"Giveaways",tr29_d:"Run giveaways like Nightbot: draw an active chatter, let viewers join with a keyword, or have them guess a number. Choose who can enter, give subscribers more luck, and practice in the Test chat first.",pl_ex:"Show what each command says",pl_ex_s:"Under each command, a short example of its reply (with example names in place of the variables). Links inside $(urlfetch) are never shown.",pl_ex_on:"The public page shows what each command says.",pl_ex_off:"The public page shows only the command names.",bam_nav:"Bot accounts",bam_open:"Open the Twitch page",bam_copy:"Copy the code",bam_starting:"Starting the Twitch login…",bam_added:"Connected: {b}. Choose it below in «Who sends this channel's replies» (it can send for several channels).",bam_failed:"The bot account wasn't added: {m}",bam_cancelled:"Cancelled.",bam_checked:"Checked with Twitch",copied_code:"Code copied",bam_who_t:"Who sends this channel's replies",bam_sub:"Accounts that only send messages for your channels. One bot account can send for several channels.",bam_who:"Who sends {c}'s replies",bam_own:"{c} (the channel's own account)",bam_chopt:"{b} (your channel)",bam_is_channel:"{b} is one of your channels, so it doesn't need adding: choose it in “Who sends the replies” while your other channel is shown. To add a different account, sign in with that one (a private window helps).",bam_botopt:"{b} (bot account)",bam_st_own:"Replies come from {c}'s own account.",bam_st_checking:"Checking whether {b} can send here…",bam_st_ready:"Ready: {b} can send replies and announcements in {c}.",bam_st_notmod:"{b} can reply, but isn't a moderator in {c}: announcements and removing messages won't work, and chat modes (followers-only, slow mode) apply to it. Fix: type /mod {b} in {c}'s chat.",bam_st_login_ch:"{b}'s Twitch login expired or is missing. Fix: switch to {b} in the account menu (bottom left), then reconnect Twitch. Until then, {c}'s own account sends the replies.",bam_st_scopes_ch:"{b}'s Twitch login is missing a permission. Fix: switch to {b} in the account menu (bottom left), then reconnect Twitch.",bam_st_login:"{b}'s Twitch login expired or is missing. Fix: Add bot account and sign in as {b} again. Until then, {c}'s own account sends the replies.",bam_st_scopes:"{b} is missing a Twitch permission. Fix: Add bot account and sign in as {b} again.",bam_st_offline:"Can't check right now (Twitch can't be reached).",bam_list:"Bot accounts",bam_add:"Add bot account",bam_refresh:"Check again",bam_sends_for:"Sends for:",bam_unused:"Not used by any channel",bam_none:"No bot accounts yet. Your channels send with their own account.",bam_remove:"Remove",bam_remove_q:"Remove {b}?",bam_remove_body:"{n} channel(s) use it: they will send with their own account (you'll see a warning), so replies never stop.",bam_removed:"Removed {b}",bam_saved:"Saved",bam_removed_note:"{b} was removed, so {c}'s own account sends the replies now. Choose another bot account below, or keep it like this.",bam_signin_t:"Sign in with the BOT account",bam_signin_d:"A Twitch page opened in your browser. Make sure it is signed in as the BOT account, not your own channel (if it shows your account, sign out or use a private window), then enter this code:",gotit:"Got it",tour_new_done:"That's what's new. The full tour is always in Tutorial.",tr24_t:"Your channels",tr25_t:"Bot accounts",tr25_d:"Bot accounts only send messages, and one can send for several channels. Choose who sends each channel’s replies (a bot account, or another of your channels), and see whether it can (moderator, login).",tr24_d:"This is the channel you are managing. Click it to see all your channels and who sends their replies, switch channel, or add another one: each channel has its own commands and settings, and its own bot running at the same time.",ch_managing:"Managing",pl_lb:"Show the leaderboards",pl_lb_s:"Tabs on your page with the mini games' top 10 and First in chat's longest streaks: viewers' names and numbers.",pl_lb_on:"The leaderboard is on your page",pl_lb_off:"The leaderboard is hidden from your page",disc_ch_q:"Disconnect {n}?",disc_ch_body:"This channel's bot stops and it leaves your channels list. Its commands, settings and logs stay on this PC: adding the channel again brings everything back.",ch_title:"Your channels",ch_add:"Add another channel",ch_note:"Every channel has its own commands, timers, greetings, moderation, games and settings, and its own bot running at the same time. Language and theme are shared.",ch_by_own:"Replies: own account",ch_by_bot:"Replies: {n}",ch_bot_missing:"bot account not connected",ch_live:"Live",ch_running:"Bot running",ch_adding:"Adding a channel…",ch_switch_aria:"Channel: {n}. Switch channel",ch_remove:"Remove from the list",ch_remove_aria:"Remove {n} from the list",ch_remove_q:"Remove {n} from the list?",ch_remove_body:"Its bot stops. Its commands, settings and logs are KEPT on this PC: adding the channel again brings everything back.",ch_removed:"Removed {n} from the list",ch_switched:"The app switched channel: reloading…",ch_pending_t:"Adding a channel",ch_pending_d:"Sign in with the Twitch account of the channel to add. Its bot starts by itself, with its own commands and settings.",nav_support:"Support",sp_title:"Support",sp_sub:"Send the developers an idea, or tell them about a problem. You can add pictures.",sp_card:"Support & suggestions",sp_card_s:"Message the developers directly",sp_kind:"What is it?",sp_sugg:"Suggestion",sp_prob:"Problem",sp_msg:"Your message",sp_ph_sugg:"What would make the app better?",sp_ph_prob:"What happened, and what did you expect?",sp_chars:"{n}/2000",sp_add:"Add pictures",sp_drop:"or paste a screenshot (Ctrl+V), or drop pictures here. Up to 4, 4 MB each.",sp_rm:"Remove picture {n}",sp_log:"Attach the end of bot.log (helps find the problem)",sp_contact:"Twitch or Kick username (optional)",sp_contact_s:"Used only to contact you about this message.",sp_send:"Send",sp_sending:"Sending…",sp_wait:"The pictures are still loading…",sp_sent:"Sent. Thank you!",sp_need:"Connect Twitch first: it tells the developers which channel wrote.",sp_priv:"Sends your message, the pictures, your Twitch channel name and the app version (for problems, also the Windows version) to the developers. Nothing is sent until you press Send.",sp_e_offline:"The website can't be reached. Check the internet and try again.",sp_e_limit:"You can send 5 messages an hour. Try again later.",sp_e_notsetup:"Support isn't set up on the website yet. Try again later.",sp_e_login:"Connect Twitch first: it tells the developers which channel wrote.",sp_e_banned:"This channel can't send messages.",sp_e_failed:"The message couldn't be sent: {d}",sp_e_short:"Write a few words first.",sp_e_long:"A message can be at most 2000 characters.",sp_e_type:"Only pictures can be added (PNG, JPG, WebP or GIF).",sp_e_size:"A picture can be at most 4 MB.",sp_e_total:"All pictures together can be at most 8 MB.",sp_e_count:"You can add up to 4 pictures.",sp_e_kind:"Choose Suggestion or Problem.",sp_e_bad:"The message couldn't be read.",tr23_t:"Support",tr23_d:"Send the developers an idea or a problem, with pictures if you like. It reaches them right away.",tour_btn:"Tutorial",tour_row:"Tutorial",tour_row_s:"Take the guided tour of the app again.",tour_replay:"Replay tutorial",tour_step:"Step {n} of {m}",tour_skip:"Skip tour",tour_back:"Back",tour_next:"Next",tour_start:"Start tour",tour_finish:"Finish",tour_done:"Tutorial complete",gs_title:"Getting started",gs_count:"{n} of {m} done",gs_go:"Go",gs_hide:"Hide",gs_all:"You're all set. Nice work.",gs1_t:"Connect your Twitch account",gs1_d:"Link your account so the bot can talk in your chat.",gs1_d_done:"You're connected as {n}.",gs2_t:"Create your first command",gs2_d:"Give viewers something to type in chat.",gs3_t:"Turn on a timer",gs3_d:"Post a reminder every few minutes while you're live.",gs4_t:"Turn on an event reply",gs4_d:"Thank new followers, subs and raiders automatically.",gs5_t:"Switch the bot on",gs5_d:"Make sure “Bot is active” is on in Settings.",tour_chap:"{p} · {n} of {m}",tour_skip_page:"Skip this page",tr30_t:"Stream stats",tr30_d:"How your chat did: messages, chatters, new chatters, commands used and new followers, for this stream, the last 7 days or 30 days. Below: your top commands, top chatters, top Twitch emotes and who chatted for the first time.",tr31_t:"Find a command",tr31_d:"Type here to find one of your commands by its name, its other names or its reply.",tr32_t:"Who can use it, and how often",tr32_d:"Who can use it: everyone, subscribers, VIPs, moderators or only you. Cooldown: the seconds before it can be used again. Aliases are extra names, like !dc for !discord.",tr33_t:"Announcements",tr33_d:"Pick a color to post the reply as a highlighted announcement instead of a normal message. The bot must be a moderator in your chat for announcements.",tr34_t:"All games",tr34_d:"Settings for every game together: the commands to see your wins («⁦!فوز⁩»), the leaderboard («⁦!الأوائل⁩»), a random game («⁦لعبه؟⁩») and the list of games that are on («⁦العاب؟⁩»); how many rounds per stream; and the wait between rounds. The switch at the top turns all games on or off.",tr35_t:"Leaderboard",tr35_d:"Who won the most: All time, This week (it starts on Sunday) or This month, for all games together or one game. Reset clears the wins, after you confirm.",tr36_t:"Recipes and variables",tr36_d:"Recipes are ready-made commands, like a hug, a shoutout or «⁦!كليب⁩»: Try shows what it would say, Add as command saves it for you. Variables shows every $(…) with an example, to make your own replies smarter.",tr37_t:"Giveaway settings",tr37_d:"Choose who can enter, whether only followers count, how much more luck subscribers get, and when entries close. The bot can announce the giveaway and say the winner in chat.",tr38_t:"Pause the bot",tr38_d:"Need a quiet moment? Pause, and the bot won't reply to anyone or send timers until you switch it back. Your setup is not touched.",tr39_t:"Backup & restore",tr39_d:"Save your whole setup (commands, timers, events, greetings, games and more) in one file, or bring it back from one. Your Twitch logins are never in the file.",tr1_t:"Welcome to FQPN's Chat Bot",tr1_d:"This app is a helper that lives in your Twitch chat. It answers your viewers, posts reminders and thanks people for you, even while you're busy streaming. This short tour explains everything in about two minutes.",tr1_b1:"Answer viewers with commands, like !discord",tr1_b2:"Post reminders on a timer while you're live",tr1_b3:"Thank new followers, subs, raids and donations",tr2_t:"Your menu",tr2_d:"Everything is in this menu, in four groups: Overview, Chat tools, Connections and System. The small numbers show how many commands, timers, event replies and greetings are switched on, and how many users are blocked.",tr2p_d:"Everything is in this menu. Slide it sideways to see all the pages.",tr3_t:"Your Twitch account",tr3_d:"This is your Twitch account. When it says Connected, the bot is working in your chat. Click it to see your accounts, open the bot account, or disconnect.",tr4_t:"Getting started",tr4_d:"A short list that ticks itself off as you set things up. Press Go on any line to jump to the right place. You can hide it any time.",tr5_t:"Your numbers at a glance",tr5_d:"See how many commands you have, how many timers are running, whether the bot is online, and which account writes the replies. Below them: the link to your public commands page.",tr6_t:"What the bot just did",tr6_d:"Every time the bot answers a command, thanks someone or posts a timer, it shows up here. The full history is in Logs.",tr7_t:"Commands",tr7_d:"A command is a word viewers type in chat, like discord. When they do, the bot replies with the message you chose. Press the New command button, then pick its name, what the bot says, who can use it and how often.",tr40_t:"Counters",tr40_d:"Next to the search, switch between your Commands and your Counters. A counter is a number with a name, like deaths or wins: in a command's reply, $(count deaths) adds 1 and shows it, and $(getcount deaths) only shows it.",tr41_t:"Change a counter",tr41_d:"Use − and + or type the exact number. Used by shows which commands add to it or show it (click one to open it). Last change says who changed it and when, and Reset, rename and delete are on the right.",tr42_t:"New counter",tr42_d:"Give it a name and where it starts. Leave “Also make the commands for me” on, and you get two ready commands: one that adds 1 (for moderators) and one that shows the number (for everyone).",tr43_t:"Counters on the Dashboard",tr43_d:"Fix a count in one click during your stream with − and +. A small +1 shows when chat just added to one. Manage counters opens the full list.",tr8_t:"Built-in commands",tr8_d:"These come with the app. They let you, or your moderators, change the stream title and game, or add and edit commands, right from chat. You can switch each one off.",tr9_t:"Timers",tr9_d:"A timer posts a message by itself every few minutes, like a reminder to follow or to join your Discord. By default, timers only send while you're live. A timer can also wait for new chat messages before it posts, and two timers never go out right after each other: the second waits 30 seconds.",tr10_t:"Events",tr10_d:"Events are things that happen on your stream: a new follower, a sub, a raid, Bits or a donation. Each tab is one event, and a green dot means the bot replies to it.",tr11_t:"Turn a reply on",tr11_d:"Switch the reply on and the bot thanks people for you. You can write different replies depending on the amount, for example for bigger donations.",tr12_t:"Greetings",tr12_d:"Greetings say hello to people you choose, like your regulars, with a message you write.",tr13_t:"Blocklist",tr13_d:"Add people the bot should ignore. If someone on this list types a command, the bot stays silent. Their messages stay in chat: to remove messages, use Moderation. Block someone for good, or for 1 to 99 minutes or hours: a temporary block ends on its own.",tr14_t:"Logs",tr14_d:"Three tabs: Activity (commands, events and greetings), Moderation (what your filters and your mods did) and Bot (everything the bot said, and why). Search, or click a name to see only that person.",tr15_t:"Settings, organised",tr15_d:"Appearance, startup, bot behavior, notifications and logs each have their own tab. Changes to how the app looks apply right away.",tr16_t:"Use another account for the bot",tr16_d:"Turn this on if you want the replies to come from a separate Twitch account, like a bot account, instead of your own name. Your own account is still needed for things only you can allow.",tr17_t:"Donations",tr17_d:"Connect Streamlabs or StreamElements here and the bot can thank people when they donate. Your token is stored encrypted on this PC and is never shown again.",tr18_t:"Need it again?",tr18_d:"You can replay this tour any time from the Tutorial button at the top, or from Settings → App. Have a great stream!",tr21_t:"Moderation",tr21_d:"Filters that keep your chat clean: bad words in Arabic and English, links, capitals, emotes, symbols and repetition. Switch one on, press ⓘ to see examples. ⚙ sets what happens to someone who keeps breaking it (the message is always deleted, then a warning and timeouts), the warning text, and whether VIPs or subscribers are skipped. You and your mods are never filtered.",tr19_t:"Shortcut commands",tr19_d:"In the command editor, “What it does” can also be Change the game, Change the title or Pin first message (the first viewer to write a word like first gets their message pinned). A command like pg can switch your game to PUBG in one word. Only moderators and you can use these. With $(query) as the game, “!g Valorant” changes it to whatever you type. Pin first only counts in the stream's first minutes.",tr20_t:"Your public command list",tr20_d:"Under Share: Public list gives your channel one link to a web page with all your commands. It's on from the start: copy the link, or let !cmlist send it. It updates by itself when you change a command, and you can switch it off any time. It shows a short example of what each command says, and your mini games' commands in their own group.",botacct_sub:"Choose which Twitch account writes the bot's replies in your chat.",menu_main:"Your channel",menu_bot:"Bot account",menu_notmod:"not a moderator yet",menu_usebot:"Use a separate bot account…",hl_reconnecting:"The bot lost its connection to Twitch and is reconnecting by itself…",hl_offline:"No internet connection. The bot reconnects by itself as soon as it's back.",hl_login:"Your Twitch login is no longer valid, so the bot can't work. Connect Twitch again.",hl_problem:"The bot keeps losing its connection to Twitch ({d}). Try restarting it.",hl_live:"Timers are waiting: the check for whether you're live keeps failing.",hl_cert:"Something on this PC is blocking the secure connection to Twitch: usually an antivirus “HTTPS scanning” or web shield, a VPN or a network filter. Add FQPN's Chat Bot as an exception there (or turn that feature off), then restart the bot.",hl_restart:"Restart bot",hl_restarting:"Restarting the bot…",hl_card_reconnecting:"Reconnecting…",hl_card_offline:"No internet",hl_card_login:"Login expired",hl_card_problem:"Problem",st_tab:"Stream",st_title:"Stream messages",st_intro:"The bot can say something in your chat when your stream starts, when it comes back after a drop, and when it ends. They are all off until you switch them on.",st_note:"They are sent only while this app is running, and only when the bot is not paused. A message that starts with /announce becomes a highlighted announcement.",st_k_start:"When the stream starts",st_d_start:"Said once, when you go live.",st_k_followers:"New followers since the last stream",st_d_followers:"Said right after the start message, only when you gained followers since your last stream.",st_k_resume:"When the stream comes back",st_d_resume:"Said when you are back soon after a drop. The uptime keeps adding up.",st_k_end:"When the stream ends",st_d_end:"Said once, when you have been offline long enough to count as finished.",st_reset:"Reset to default",st_prev:"Preview:",st_vars:"Variables",st_v_category:"The category (game) you are streaming",st_v_title:"The title of your stream",st_v_channel:"Your channel name",st_v_uptime:"How long the stream lasted",st_v_newfollowers:"How many new followers since the last stream",st_timing:"Timing",st_end_after:"Count the stream as ended after this many minutes offline",st_resume_within:"If you come back within this many minutes, it continues the same stream (Resume)",st_save:"Save changes",st_dirty:"You have unsaved changes",st_saved:"Stream messages saved",st_err_len:"A message can be at most 500 characters.",st_def_start:"✅ LIVE ONLINE under the category $(category), the uptime begins.",st_def_followers:"✌️ Total of follows since last session: $(newfollowers) new followers.",st_def_resume:"✅ LIVE is BACK, the uptime of the session continues.",st_def_end:"❌ LIVE OFFLINE, uptime of the session is $(uptime).",st_msg_on:"Message is on",use_t:"About your channel name",use_d1:"To know who uses FQPN's Chat Bot, this app sends two things to its developer about once a day:",use_i1:"your Twitch channel name",use_i2:"the version of the app you're using",use_d2:"That is all. It never sends your commands, chat messages, viewers, followers, donations, settings, passwords or anything else. Your Twitch login is only used to prove the channel name is really yours, and it is never kept. The developer can turn this app off for a channel that misuses it.",st_all_on:"Messages are on",st_all_off:"Messages are off",st_all_on_toast:"Stream messages turned on",st_all_off_toast:"Stream messages turned off",pl_btn:"Public list",sh_btn_on:"On",ds_page_t:"Your commands page",ds_page_s:"{u} · !cmlist sends this link",ds_page_off:"Off. Switch it on in Commands > Share.",ds_copy:"Copy link",ds_open:"Open",ds_t:"Stream stats",ds_r_stream:"This stream",ds_r_7:"7 days",ds_r_30:"30 days",ds_live:"Live now · started {t}",ds_last:"Last stream · started {t}",ds_nostream:"No stream counted yet: the numbers start with your next stream.",ds_days:"The last {n} days",ds_n_msgs:"Messages",ds_n_chatters:"Chatters",ds_n_new:"New chatters",ds_n_cmds:"Commands used",ds_n_follows:"New followers",ds_n_subs:"Subs & gifts",ds_n_bits:"Bits",ds_n_raids:"Raids",ds_top_cmds:"Top commands",ds_top_chat:"Top chatters",ds_top_em:"Top emotes",ds_em_note:"Twitch emotes only",ds_new:"New chatters",ds_new_s:"first time in your chat",ds_uses:"{n} uses",ds_people:"{n} people",ds_msgs:"{n} messages",ds_first:"first time",ds_none:"Nothing yet.",sh_btn:"Share",sh_copy:"Copy",sh_copied:"Link copied.",sh_on:"On · {u}",sh_off:"Off",pl_title:"Public command list",pl_desc:"One link to a web page that lists your commands, so viewers can see what they can type. It updates by itself a few seconds after you change a command.",pl_on:"On",pl_off:"Off",pl_link:"Your link",pl_copy:"Copy link",pl_copied:"Link copied",pl_use:"Use for !cmlist",pl_in_use:"!cmlist sends this link",pl_used:"!cmlist now sends this link",pl_st_off:"Switched off. Nothing is shared.",pl_st_waiting:"Saving your latest changes in a moment…",pl_st_saving:"Saving…",pl_st_ok:"Up to date.",pl_st_login:"Connect your Twitch account first. The website uses it to know which channel the list belongs to.",pl_st_relogin:"Twitch didn't accept your login. Connect Twitch again, then press Try again.",pl_st_offline:"The website can't be reached right now. The app keeps trying by itself.",pl_st_error:"The website didn't accept the list: {e}",pl_st_nosite:"The public list website isn't set up in this version of the app yet.",pl_retry:"Try again",pl_close:"Close",pl_what:"What is shared: the names of your switched-on commands, who can use them and, unless you switch it off below, a short example of each reply (example names in place of the variables; links inside $(urlfetch) are never shared). Cooldowns, aliases and settings are never shared. To keep a command off the list, edit it and switch off “Show on the public list”.",pl_priv:"Your Twitch login is sent along so the website can check which channel this is. The website doesn't keep it. Switching the list off takes it off the website.",pl_on_toast:"Public list switched on",pl_off_toast:"Public list switched off",pl_hidden:"Not on the public list",lbl_public:"Show on the public list",lbl_public_s:"Viewers can see this command's name on your public command list.",st_msg_off:"Message is off",pause_aria:"Pause bot",pause_on:"Bot is paused",pause_off:"Bot is active",paused_toast:"Bot paused",resumed_toast:"Bot resumed",st_paused:"Paused",ban_paused:"The bot is paused and won't reply to anyone or send timers.",resume:"Resume",timers_title:"Timers",timers_sub:"Send messages to your chat automatically on a schedule.",new_timer:"+ New Timer",your_timers:"Your timers",no_timers:"No timers yet. Select New Timer to add one.",
