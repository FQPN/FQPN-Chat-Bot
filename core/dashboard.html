var WN=[{"v": "1.18.0", "tour": [65, 64, 59, 63, 66, 62, 67, 55, 56, 61, 54, 57, 58, 68, 60], "en": ["Chat box: your chat on stream, your style. A box or one line, with real Twitch badges.", "New variables: $(watchtime) and $(messages) show how long they watched, how much they wrote.", "Two fonts: one for Arabic, one for English in the chat box.", "Overlays tabs: Chat box has its own tab now.", "First box: hides itself when time's up, and the winner glows in your color.", "!color: viewers pick their name color for the stream. Mods can set anyone's.", "Twitch panel: your viewers' leaderboard right under your stream.", "WizeBot import: works any time, even offline. New watch time adds up while you're live.", "Welcome new chatters: the bot says hi to anyone's first message.", "Arabic replies: every event now replies in Arabic out of the box.", "Public page: your Twitch banner on top, and a new «First» tab with the longest streaks.", "Follow anniversary: the bot celebrates each follower's year.", "!wins: shows wins in proper Arabic, like «⁨فوزتين⁩».", "Voice commands (Beta): give VIP or mod, run commands, clear chat, all by talking. «Run command commands» works too.", "Falkorie streak: one reply per person per stream.", "Fixes: no more \"welcome\" for your regulars, «First» survives a stream restart, safer $(query) commands, and lighter on your PC."], "ar": ["صندوق الشات: شاتك على البث بستايلك. صندوق أو سطر واحد، مع شارات تويتش.", "متغيرات جديدة: \u2066$(watchtime)\u2069 و\u2066$(messages)\u2069 تعرض كم تابع المشاهد وكم كتب.", "خطين: واحد للعربي وواحد للإنجليزي في الشات بوكس.", "تبويبات الأوفرلاي: الشات بوكس صار له تبويب لحاله.", "مربع أول واحد: يختفي لحاله لما يخلص الوقت، والفايز يلمع بلونك.", "\u2066!color\u2069: المشاهد يختار لون اسمه للبث، والمشرف يقدر يغيّر لون أي أحد.", "بانل تويتش: ترتيب مشاهدينك تحت البث مباشرة.", "نقل أرقام WizeBot: يشتغل أي وقت حتى وأنت أوفلاين. ووقت المشاهدة الجديد ينحسب وأنت لايف.", "ترحيب الجدد: البوت يرحّب بأول رسالة لأي أحد.", "ردود عربية: كل الأحداث صارت ترد بالعربي من أول تشغيل.", "صفحتك العامة: بانر تويتش حقك فوق، وتبويب «أول» جديد فيه أطول ستريك.", "ذكرى المتابعة: البوت يحتفل بسنة كل متابع.", "⁦!فوز⁩: يعرض عدد الفوز بالعربي الصح، مثل «فوزتين».", "الأوامر الصوتية (تجريبي): عطه VIP أو مود، شغّل أوامر، امسح الشات، كله بصوتك. حتى «شغّل أمر كوماندات» و«شغّل أمر شين».", "سلسلة ⁦Falkorie⁩: رد واحد لكل شخص في كل بث.", "إصلاحات: ما عاد يرحّب بالمشاهدين الدايمين كأنهم جدد، «أول» ما ينكسر لو رستّرت البث، أوامر $(query) أأمن، والبرنامج أخف على جهازك."]}, {"v": "1.17.1", "tour": [52, 53], "en": ["Falkorie replies (Events page): if you use the Falkorie bot, your bot answers when Falkorie says a viewer reached a new level or shows their watch streak (also when someone writes !streak). Pick different replies by level or streak.", "Event replies now tag the viewer: {user} shows as @fqpn_ instead of fqpn_, so they get a notification. Replies that already had @{user} don't change."], "ar": ["ردود Falkorie (صفحة الأحداث): لو تستخدم بوت Falkorie، بوتك يرد لما Falkorie يقول إن مشاهد وصل مستوى جديد أو يعرض سلسلة مشاهدته (وحتى لما أحد يكتب !streak). اختر ردود مختلفة حسب المستوى أو السلسلة.", "ردود الأحداث صارت تمنشن المشاهد: {user} يطلع ⁦@fqpn_⁩ بدل ⁦fqpn_⁩، عشان يوصله تنبيه. الردود اللي فيها ⁦@{user}⁩ من قبل ما تتغير."]}, {"v": "1.17.0", "tour": [47, 48, 49, 46, 50, 51], "en": ["Overlays for OBS (new page in the sidebar): one link for all of them. Add it in OBS as a Browser Source (1920×1080), then switch on the counters you want and First in chat (who wrote first this stream, with their picture and streak). Drag them on the big preview to place them, drag a corner to resize, pick several with Ctrl + click or by drawing a box. They can't overlap, they use your accent color, and OBS follows right away.", "Hotkeys (new page in the sidebar): press a key anywhere, even in a game, to add 1 to a counter, take 1 off, send a message or a command like !discord, or start a mini game. Combos work too, like Ctrl + Shift + F5 or Mouse 4 + Q. Switch them on at the top of the page.", "Labs (Settings → Labs): new features you can try before they're finished. They can change or be removed later.", "Voice commands (Beta, in Labs): hold a key and say what the bot should do, in Arabic, English or both: “timeout FQPN 5 minutes”, “start trivia”, “say hello chat”. Timeout and ban always ask you first, and “cancel” takes the last one back. Your voice stays on your PC. Pick a speech model on the Voice page: Fast, Accurate or Best. With an NVIDIA graphics card, switch on Use my graphics card to understand commands in about a second.", "Import: bring your commands and timers from Nightbot or StreamElements in one click (Commands → Import). You choose what comes in, and one click undoes it all.", "Mini games → Leaderboard: the pencil next to a winner changes their wins, and + Add a winner puts back someone whose wins were lost.", "Your public commands page (fqpnbot.com) shows the mini games as one tidy card per game, with all the commands that start it on the card.", "New Variables page on fqpnbot.com: every variable with one line about it, an example command and what chat would show, plus a box to try your own reply. Open it from All variables in the command editor."], "ar": ["أوفرلاي لـ OBS (صفحة جديدة في القائمة): رابط واحد لها كلها. أضفه في OBS كـ Browser Source (1920×1080)، وبعدين شغّل العدّادات اللي تبيها و«أول واحد في الشات» (مين كتب أول هالبث، مع صورته وعدد مراته). اسحبها على المعاينة الكبيرة عشان ترتبها، واسحب الزاوية عشان تكبّرها، واختر أكثر من واحد بـ Ctrl مع الضغط أو برسم مربع. ما تدخل في بعض، تاخذ لونك، وOBS يتبعك على طول.", "الاختصارات (صفحة جديدة في القائمة): اضغط زر من أي مكان، حتى وأنت في اللعبة، عشان تزيد عداد 1 أو تنقصه، ترسل رسالة أو أمر مثل !discord، أو تبدأ لعبة. وتقدر تسوي كومبو مثل Ctrl + Shift + F5 أو Mouse 4 + Q. شغّلها من أعلى الصفحة.", "المختبر (الإعدادات ← المختبر): ميزات جديدة تقدر تجربها قبل ما تكتمل. ممكن تتغير أو تنشال بعدين.", "الأوامر الصوتية (تجريبي، في المختبر): اضغط زر وقول للبوت وش يسوي، بالعربي أو الإنجليزي أو الاثنين: «تايم أوت فقبن ٥ دقايق»، «ابدأ سؤال»، «قول هلا بالشات». التايم أوت والبان يسألك قبل، و«كنسل» يتراجع عن آخر أمر. صوتك ما يطلع من جهازك. اختر نموذج الكلام من صفحة الصوت: السريع، الدقيق أو الأفضل. ولو عندك كرت شاشة NVIDIA شغّل «استخدم كرت الشاشة» عشان الأمر ينفهم في ثانية تقريبًا.", "الاستيراد: انقل أوامرك ومؤقتاتك من نايت بوت أو StreamElements بضغطة (الأوامر ← استيراد). أنت تختار وش يدخل، وضغطة وحدة تتراجع عن كل شي.", "الألعاب ← لوحة الأوائل: القلم جنب الفائز يعدّل انتصاراته، و«+ أضف فائز» يرجّع واحد راحت انتصاراته.", "صفحة أوامرك العامة (fqpnbot.com) تعرض الألعاب ببطاقة مرتبة لكل لعبة، وعليها كل الأوامر اللي تبدأها.", "صفحة متغيرات جديدة في fqpnbot.com: كل متغير مع سطر يشرحه، وأمر مثال، ووش يطلع في الشات، ومكان تجرّب فيه ردك. افتحها من «كل المتغيرات» في محرر الأمر."]}, {"v": "1.16.0", "tour": [44, 45], "en": ["Command history: every change to a command is kept (from the app, from mods in chat with !cmadd / !cmedit / !cmdel, the editor link or a backup restore), with who did it and when. Open History on the Commands page, or History in a command's edit window, to see what changed and undo it. A deleted command comes back with Bring back.", "Undo: right after you save or delete a command, an Undo button shows at the bottom for a few seconds.", "Counters: mods can reset a counter from chat with the command + reset, like !deaths reset (any command that uses the counter, any name or language). Viewers who type it just get the normal reply, and the cooldown never blocks a mod. Switch it off or let only yourself reset in Commands > Counters; each counter shows its reset command, and Last change says who reset it."], "ar": ["سجل الأوامر: كل تغيير على أمر ينحفظ (من البرنامج، من المشرفين في الشات بـ ⁦!cmadd⁩ و ⁦!cmedit⁩ و ⁦!cmdel⁩، رابط المحرر أو استرجاع نسخة) مع مين سوّاه ومتى. افتح «السجل» في صفحة الأوامر أو داخل نافذة تعديل الأمر لتشوف وش تغيّر وتتراجع عنه. الأمر المحذوف يرجع بزر «رجّعه».", "تراجع: بعد ما تحفظ أو تحذف أمر، يطلع زر «تراجع» تحت لثواني.", "العدّادات: المشرفين يقدرون يصفّرون العدّاد من الشات بالأمر ⁦+ reset⁩، مثل ⁦!deaths reset⁩ (أي أمر يستخدم العدّاد، بأي اسم أو لغة). المشاهد اللي يكتبها ياخذ الرد العادي بس، ووقت الانتظار ما يمنع المشرف. تقدر تقفلها أو تخليها لك بس من الأوامر > العدّادات؛ كل عدّاد يعرض أمر تصفيره، و«آخر تغيير» يقول مين صفّره."]}, {"v": "1.15.0", "tour": [22, 25, 9, 27, 13, 40, 41, 42, 43], "en": ["Four new mini games: «الدخيل» (4 words: write the one that doesn't belong; Easy or Hard), «ضد» (write the opposite word: Easy or Hard), «ترجم» (translate a word: Easy or Hard; the direction is random every round, or always English → Arabic or Arabic → English) and «لغز» (easy Arabic riddles). Each one has its own leaderboard tab.", "«سؤال» has about 270 questions now, in Easy, Medium and Hard (or Mixed). Choose it in the game's ⚙.", "Bot account: choose what it sends (command replies, games, timers, events and more) on the Bot accounts page. Anything switched off comes from your own account.", "Counters: see and change every counter in Commands > Custom > Counters, and fix a count in one click from the new Counters card on the Dashboard. New counter can make the commands for you too.", "Every mini game can now be started by everyone. Want moderators only? Change it in the game's ⚙.", "Every game now starts two ways, like «حروف؟» or «!حروف», and «العاب؟» (or games?) lists the commands of the games that are on.", "Commands: Aliases are now chips, like Trigger words. Type a name and press Enter; × removes one.", "Fixed: restoring a backup works again, and disconnecting one of several channels no longer stops the whole app.", "Leaderboards: All time, This week (it starts on Sunday) and This month, in the app and on your commands page. In chat: «!الأوائل أسبوع» or «!الأوائل شهر», and «!فوز» shows this week and month too.", "New variable $(clip): a Twitch clip of the last moments of your stream, with its link. Try the ready-made «!كليب» in Test chat > Recipes. Clips need Twitch reconnected once (account menu); nothing else does.", "Blocklist: block someone for 1 to 99 minutes or hours, or for good. A temporary block shows the time left and ends on its own; Make permanent keeps it.", "The tutorial explains much more: counters, Stream stats, finding a command, who can use it and its cooldown, announcements, all-games settings, the leaderboard, recipes, giveaway settings, pausing the bot and backups. Each step shows the page and where you are on it, and Skip this page jumps ahead.", "Several channels: one of your channels can now send the replies of another (account 1 for account 2, and the other way round). Choose it in “Who sends the replies”: no new sign-in needed.", "Mini games: the game names and commands on the cards now read the right way in English (!سؤال, not سؤال!).", "Timers work like Nightbot's: “Chat lines” counts chat messages from the last 5 minutes, and a timer that's due while chat is too quiet skips that turn, so timers no longer pile up. Two timers are never sent within a minute of each other. New timers wait for 2 messages, and timers that had Chat lines off now wait for 2 (you can turn it off again)."], "ar": ["أربع ألعاب جديدة: «الدخيل» (4 كلمات: اكتب الكلمة اللي ما تنتمي للباقي؛ سهل أو صعب) و«ضد» (اكتب ضد الكلمة: سهل أو صعب) و«ترجم» (ترجمة كلمة: سهل أو صعب؛ الاتجاه عشوائي كل جولة، أو دائمًا من الإنجليزي للعربي أو العكس) و«لغز» (ألغاز عربية سهلة). لكل لعبة تبويب في لوحة الأوائل.", "«سؤال» صار فيه حوالي 270 سؤالًا، بمستويات سهل ومتوسط وصعب (أو منوّعة). اخترها من ⚙ في اللعبة.", "حساب البوت: اختر ماذا يرسل (ردود الأوامر، الألعاب، المؤقتات، الأحداث وغيرها) من صفحة حسابات البوت. أي شيء تطفئه يرسله حسابك أنت.", "العدّادات: شوف وعدّل كل عدّاد من الأوامر > مخصصة > العدّادات، وعدّل الرقم بضغطة من بطاقة العدّادات الجديدة في لوحة التحكم. و«عدّاد جديد» يقدر ينشئ لك الأوامر بعد.", "كل الألعاب صار يقدر يبدأها الجميع. تبيها للمشرفين فقط؟ غيّرها من ⚙ في اللعبة.", "كل لعبة تبدأ الآن بطريقتين، مثل «حروف؟» أو «!حروف»، و«العاب؟» (أو games?) يعرض أوامر الألعاب المفعّلة.", "الأوامر: الأسماء البديلة صارت بطاقات مثل كلمات التشغيل. اكتب الاسم واضغط Enter، و× يحذفه.", "تم الإصلاح: استعادة النسخة الاحتياطية تعمل من جديد، وفصل قناة من عدة قنوات لم يعد يوقف التطبيق كله.", "لوحات الأوائل: من البداية وهالأسبوع (يبدأ يوم الأحد) وهالشهر، في التطبيق وفي صفحة أوامرك. وفي الدردشة: «!الأوائل أسبوع» أو «!الأوائل شهر»، و«!فوز» يعرض الأسبوع والشهر أيضًا.", "متغير جديد ⁦$(clip)⁩: كليب في تويتش لآخر لحظات من البث مع رابطه. جرّب «!كليب» الجاهز في دردشة التجربة > الوصفات. الكليب يحتاج إعادة ربط تويتش مرة وحدة (قائمة الحساب)، ولا شيء غيره يحتاجها.", "قائمة الحظر: احظر شخصًا من 1 إلى 99 دقيقة أو ساعة، أو دائمًا. الحظر المؤقت يعرض الوقت المتبقي وينتهي تلقائيًا، و«اجعله دائمًا» يبقيه.", "الجولة التعريفية تشرح أكثر بكثير: العدّادات، وإحصائيات البث، والبحث عن أمر، ومن يستخدمه ووقت الانتظار، والإعلانات، وإعدادات كل الألعاب، ولوحة الأوائل، والوصفات، وإعدادات السحب، وإيقاف البوت مؤقتًا، والنسخ الاحتياطي. وكل خطوة تعرض الصفحة ومكانك فيها، و«تخطَّ هذه الصفحة» ينقلك للتالية.", "عدة قنوات: يمكن الآن لقناة من قنواتك أن ترسل ردود قناة أخرى (الحساب 1 للحساب 2 والعكس). اخترها في «من يرسل الردود»: بدون تسجيل دخول جديد.", "الألعاب: أسماء الألعاب وأوامرها في البطاقات تظهر الآن بالاتجاه الصحيح في الواجهة الإنجليزية.", "المؤقتات تعمل مثل Nightbot: «رسائل الدردشة» تُحسب من آخر 5 دقائق، والمؤقت الذي يحين وقته والدردشة هادئة يتخطى دوره، فلا تتراكم المؤقتات. ولا يُرسل مؤقتان خلال دقيقة من بعض. المؤقتات الجديدة تنتظر رسالتين، والمؤقتات التي كانت «رسائل الدردشة» فيها مطفأة صارت تنتظر رسالتين (يمكنك إطفاؤها مجددًا)."]}, {"v": "1.14.0", "tour": [22, 2, 28, 15, 19, 20, 26, 5, 9], "en": ["The app is much faster and lighter on your PC: no more busy graphics card or CPU while it's open, also behind a game.", "In Arabic, the built-in commands (!cmlist, !title, !game, !cmadd…) answer in Arabic. And !game finds the game you mean: gta, جاتا, valo, ماين, سوالف…, the closest name and what's popular on Twitch now.", "Backup & restore in Settings > App: save your whole setup in one file, or bring it back from one (on a new PC, or to undo changes). Your Twitch logins are never in the file.", "Five new mini games: «ايموجي» (guess the word from simple emoji puzzles), «عكس» (write a backwards word the right way), «احسب» (a quick sum: easy, normal or hard), «سلم» (the fastest to write 3 words starting with a letter) and «سؤال» (easy questions: write the answer itself, like مسقط; Hard shows only the question, Easy also shows 4 choices). Start them with !ايموجي, !عكس, !احسب, !سلم and !سؤال.", "Your public command list is now switched on, and !cmlist sends its link (fqpnbot.com/your-channel). Don't want it? Switch it off in Commands > Public list: it stays off.", "New on the Dashboard: Stream stats for this stream, 7 or 30 days (messages, chatters, new chatters, commands, followers, top commands, top chatters and top Twitch emotes), and your commands page link. On Commands, Public list and Editor link are now under one Share button.", "«لعبه؟» starts a round of a random game. !top sends the link to your games leaderboard, which now has a tab for every game.", "«رتب» is easier: only everyday words, 3 to 5 letters (up to 7 if you choose).", "A new look for the Test chat: it reads like Twitch chat (time, small role tags), roles are one click, and a new Commands tab lists all your channel's commands. Send one to try it, or type ! in the message box to pick one.", "Fixed: the bot could keep disconnecting on PCs where an antivirus “HTTPS scanning” or web shield, a VPN or a network filter checks secure connections. The app now checks them the same way Windows and your browser do. If something still blocks Twitch, the app says so in plain words.", "New recipes in Test chat > Recipes: 27 ready-made commands that together use every variable a command can use (like !stream, !me, !so with the other streamer's game, !google, !time, !first), each showing which variables it uses.", "The Blocklist in the menu shows how many users are blocked.", "Pin first message: only in the first 5 minutes of the stream (you choose); nobody by then breaks the streak. You're never first on your own stream, \"!first\" or \"first?\" don't count, and it can only count the streak without pinning. New: $(firststreakpeak), a viewer's best streak ever.", "New variables $(count name) and $(getcount name): a counter shared by several commands (like !death adds 1, !deaths shows it).", "Commands: each command shows how often it was used in the last 30 days and when it was last used, so you can tidy up old ones.", "Mini games: one switch turns all games off (or on again). Each game keeps its own setting.", "Timers can wait for chat: a timer only posts after a few new chat messages, so it never talks to an empty chat.", "Fixed: the narrow sidebar showed grey blocks instead of thin lines between its parts, and «app?» was squeezed in small windows.", "Variables about someone else: $(followage $(touser)), $(followdate $(touser)), $(follow $(touser)), $(firststreak $(touser)) and $(firststreakpeak $(touser)) are about the person mentioned (!followage @FQPN). And !wins @FQPN shows that person's wins and place."], "ar": ["التطبيق أسرع وأخف بكثير على جهازك: لا ضغط على كرت الشاشة أو المعالج أثناء فتحه، حتى خلف لعبة.", "عند اختيار العربية، تجيب الأوامر المدمجة (⁦!cmlist⁩ و⁦!title⁩ و⁦!game⁩ و⁦!cmadd…⁩) بالعربية. و⁦!game⁩ يجد اللعبة التي تقصدها: gta أو جاتا أو valo أو ماين أو سوالف…، بأقرب اسم والأشهر على تويتش الآن.", "النسخ الاحتياطي والاسترجاع في الإعدادات > التطبيق: احفظ كل إعداداتك في ملف واحد، أو استرجعها منه (على جهاز جديد، أو للتراجع عن تغييرات). تسجيلات دخول تويتش لا تكون في الملف أبدًا.", "خمس ألعاب جديدة: «ايموجي» (خمّن الكلمة من ألغاز إيموجي بسيطة)، و«عكس» (اكتب الكلمة المقلوبة بشكلها الصحيح)، و«احسب» (عملية سريعة: سهل أو عادي أو صعب)، و«سلم» (أسرع من يكتب 3 كلمات تبدأ بحرف)، و«سؤال» (أسئلة سهلة: اكتب الجواب نفسه مثل مسقط؛ «صعب» يعرض السؤال فقط، و«سهل» يعرض 4 خيارات أيضًا). ابدأها بـ ⁦!ايموجي⁩ و⁦!عكس⁩ و⁦!احسب⁩ و⁦!سلم⁩ و⁦!سؤال⁩.", "قائمة أوامرك العامة مفعّلة الآن، و⁦!cmlist⁩ يرسل رابطها (⁦fqpnbot.com/اسم-قناتك⁩). لا تريدها؟ أوقفها من الأوامر > القائمة العامة: وستبقى متوقفة.", "جديد في لوحة التحكم: إحصائيات البث لهذا البث أو 7 أو 30 يومًا (الرسائل والمتفاعلون والجدد والأوامر والمتابعون وأكثر الأوامر والمتفاعلين وإيموجي تويتش)، ورابط صفحة أوامرك. وفي الأوامر صارت القائمة العامة ورابط التعديل تحت زر «مشاركة».", "«لعبه؟» يبدأ جولة من لعبة عشوائية. و⁦!top⁩ يرسل رابط لوحة أوائل ألعابك، وفيها الآن تبويب لكل لعبة.", "«رتب» أسهل: كلمات يومية فقط، من 3 إلى 5 حروف (حتى 7 إن اخترت).", "شكل جديد لتجربة الدردشة: تبدو مثل دردشة تويتش (الوقت وشارات صغيرة للأدوار)، والأدوار بنقرة واحدة، وتبويب جديد «الأوامر» يعرض كل أوامر قناتك. أرسل أمرًا لتجربته، أو اكتب ! في خانة الرسالة لتختار أمرًا.", "إصلاح: كان البوت قد ينقطع باستمرار على الأجهزة التي يفحص فيها برنامج الحماية («فحص HTTPS» أو درع الويب) أو VPN أو فلتر الشبكة الاتصالات الآمنة. التطبيق الآن يتحقق منها بنفس طريقة ويندوز ومتصفحك. وإذا بقي شيء يمنع تويتش، يخبرك التطبيق بكلمات واضحة.", "وصفات جديدة في تجربة الدردشة > وصفات: 27 أمرًا جاهزًا تستخدم معًا كل متغير يمكن للأمر استخدامه (مثل ⁦!stream⁩ و⁦!me⁩ و⁦!so⁩ مع لعبة الستريمر الآخر و⁦!google⁩ و⁦!time⁩ و⁦!first⁩)، وكل وصفة تعرض المتغيرات التي تستخدمها.", "قائمة الحظر في القائمة الجانبية تعرض عدد المستخدمين المحظورين.", "تثبيت أول رسالة: فقط في أول 5 دقائق من البث (أنت تختار)؛ وإن لم يكتب أحد تنقطع السلسلة. لا تكون أنت الأول في بثك، و«⁦!اول»⁩ أو «اول؟» لا تُحسب، ويمكنه أن يحسب السلسلة فقط بدون تثبيت. جديد: ⁦$(firststreakpeak)⁩ أفضل سلسلة للمشاهد على الإطلاق.", "متغيران جديدان ⁦$(count name)⁩ و⁦$(getcount name)⁩: عدّاد مشترك بين عدة أوامر (مثل ⁦!death⁩ يزيده و⁦!deaths⁩ يعرضه).", "الأوامر: يعرض كل أمر كم مرة استُخدم في آخر 30 يومًا ومتى آخر مرة، لتنظيف الأوامر القديمة.", "الألعاب: زر واحد يوقف كل الألعاب (أو يشغلها مجددًا). وتحتفظ كل لعبة بإعدادها.", "المؤقتات يمكنها انتظار الدردشة: لا ينشر المؤقت إلا بعد عدد من الرسائل الجديدة، فلا يكتب في دردشة فارغة.", "إصلاح: كانت القائمة الجانبية الضيقة تعرض مربعات رمادية بدل خطوط رفيعة بين أقسامها، وكان «app?» مضغوطًا في النوافذ الصغيرة.", "متغيرات عن شخص آخر: ⁦$(followage $(touser))⁩ و⁦$(followdate $(touser))⁩ و⁦$(follow $(touser))⁩ و⁦$(firststreak $(touser))⁩ و⁦$(firststreakpeak $(touser))⁩ تكون عن الشخص المذكور (⁦!followage @FQPN⁩). و⁦!wins @FQPN⁩ يعرض انتصارات ذلك الشخص ومركزه."]}, {"v": "1.13.0", "tour": [19, 27, 26, 28, 29, 20], "en": ["Editor link (Commands > Editor link): give someone you trust a link and a password, and they can change your Commands, Timers, Events, Greetings, Blocklist, Moderation and Mini games from the website, on this app's own pages, and read the Logs. A new password every time, the link ends after 24 hours, and you can cancel it at any moment. Every change is checked by your app and written in the Logs.", "Your public command page has a Games leaderboard tab (the top 10 of each game) and uses your accent color. Hide the leaderboard in Commands > Public list.", "Reply to the sender: a new switch on every command. Off (the start for every command), the bot writes a normal message, also from a bot account (it used to reply to every message). On, it replies to the viewer's message.", "New variables, now grouped by type in the command editor: $(accountage), $(random.chatter), $(followers), $(firststreak), $(weather city) and $(time city).", "New command type, Pin first message: the first viewer of the stream to write a word like first or اول gets their message pinned in chat, with an optional reply and a streak.", "Fixed: the app window could stay partly above the top of the screen. It now moves back onto the screen as soon as you let go of it, or open it again.", "New Test chat page (Chat tools > Test chat): write as any viewer and see what the bot answers, pretend a sub, a raid or a donation, and nothing reaches Twitch. It has ready-made command recipes, every variable to try, and a short how-to. The command editor has a Test button too.", "Event replies can show totals with {total}: all the subs someone gifted, all their Bits, all their donations, or the months subscribed. The default replies use it, like “5 SUBS?! THANK YOU … (( has gifted 1466 subs ))”.", "New Giveaways page (Chat tools > Giveaways), like Nightbot's: draw a random active chatter, let viewers join by typing a keyword like !join, or have them guess a secret number. Choose who can enter, followers only, and subscriber luck; reroll, see what the winner writes, and keep the last 20 winners. Practice it in the Test chat first.", "Your public command page shows a short example of what each command says, and your mini games' commands in their own group (with what each one does). You can switch the examples off in Commands > Public list.", "The window's top bar now takes the app's colors (dark or light), and the Advanced variables are always shown.", "Fixed: a bot account's Twitch login could show “expired or missing” every few hours, and timers were sometimes posted twice (by the bot account and by your channel). In most cases a login that was hit repairs itself."], "ar": ["رابط التعديل (الأوامر > رابط التعديل): أعطِ شخصًا تثق به رابطًا وكلمة مرور، فيستطيع تغيير الأوامر والمؤقتات والأحداث والترحيب وقائمة الحظر والإشراف والألعاب من الموقع، على صفحات هذا التطبيق نفسها، وقراءة السجلات. كلمة مرور جديدة في كل مرة، والرابط ينتهي بعد 24 ساعة، ويمكنك إلغاؤه في أي لحظة. كل تعديل يتحقق منه تطبيقك ويُكتب في السجلات.", "صفحة أوامرك العامة فيها تبويب لوحة صدارة الألعاب (أفضل 10 في كل لعبة) وتستخدم لونك المميز. يمكنك إخفاء لوحة الصدارة من الأوامر > القائمة العامة.", "الرد على المرسل: مفتاح جديد في كل أمر. عند إيقافه (وهو البداية لكل الأوامر) يكتب البوت رسالة عادية، حتى من حساب البوت (كان يرد على كل رسالة). عند تفعيله يرد على رسالة المشاهد.", "متغيرات جديدة، والمتغيرات الآن مقسمة حسب النوع في محرر الأمر: ⁦$(accountage)⁩، ⁦$(random.chatter)⁩، ⁦$(followers)⁩، ⁦$(firststreak)⁩، ⁦$(weather city)⁩ و⁦$(time city)⁩.", "نوع أمر جديد، تثبيت أول رسالة: أول مشاهد في البث يكتب كلمة مثل اول أو ⁦first⁩ تُثبَّت رسالته في الدردشة، مع رد اختياري وسلسلة انتصارات.", "إصلاح: كانت نافذة التطبيق قد تبقى جزئيًا فوق أعلى الشاشة. الآن ترجع إلى الشاشة بمجرد أن تتركها أو تفتحها من جديد.", "صفحة جديدة «تجربة الدردشة» (أدوات الدردشة > تجربة الدردشة): اكتب كأي مشاهد وشاهد ماذا يرد البوت، وتظاهر باشتراك أو غارة أو تبرع، ولا يصل شيء إلى تويتش. فيها وصفات أوامر جاهزة، وكل المتغيرات للتجربة، وشرح قصير. ومحرر الأمر فيه زر «تجربة» أيضًا.", "ردود الأحداث يمكنها عرض المجموع بـ ⁦{total}⁩: كل الاشتراكات التي أهداها شخص، أو كل الـ Bits، أو كل تبرعاته، أو أشهر اشتراكه. الردود الافتراضية تستخدمه، مثل «⁦5 SUBS?! THANK YOU … (( has gifted 1466 subs ))⁩».", "صفحة جديدة «السحوبات» (أدوات الدردشة > السحوبات) مثل Nightbot: اسحب أحد المتفاعلين عشوائيًا، أو دع المشاهدين يشاركون بكتابة كلمة مثل ⁦!join⁩، أو يخمّنون رقمًا سريًا. اختر من يستطيع المشاركة، والمتابعين فقط، وحظ المشتركين؛ أعد السحب، وشاهد ما يكتبه الفائز، واحتفظ بآخر 20 فائزًا. تدرّب عليها أولًا في «تجربة الدردشة».", "صفحة أوامرك العامة تعرض مثالًا قصيرًا على ما يقوله كل أمر، وأوامر ألعابك في مجموعة خاصة بها (مع ما يفعله كل أمر). يمكنك إيقاف الأمثلة من الأوامر > القائمة العامة.", "شريط النافذة العلوي يأخذ الآن ألوان التطبيق (داكن أو فاتح)، والمتغيرات المتقدمة تظهر دائمًا.", "إصلاح: كان تسجيل دخول حساب البوت قد يظهر «منتهي أو غير موجود» كل بضع ساعات، وكانت المؤقتات تُنشر أحيانًا مرتين (من حساب البوت ومن قناتك). في أغلب الحالات يصلح تسجيل الدخول المتأثر نفسه."]}, {"v": "1.12.0", "tour": [24, 25, 22], "en": ["Several channels in one app: add another channel from the button at the top. Each channel has its own commands, timers, greetings, moderation, games and settings, and its own bot running at the same time.", "Bot accounts: one bot account can send the replies of several channels. Choose who sends each channel's replies, and see whether it can (moderator, login) and how to fix it.", "Safer data: saves can't be cut in half, a damaged file is never overwritten, and a backup is made before your data moves to its channel folder.", "New built-in command: when someone asks «app?» or «برنامج؟», the bot answers with the app's website. Switch it off in Commands > Built-in.", "After an update, Got it shows you the new things with a short tour.", "Your public command page now also shows the built-in commands (like !cmlist), and replies can be 500 characters, Twitch's limit."], "ar": ["عدة قنوات في تطبيق واحد: أضف قناة أخرى من الزر في الأعلى. لكل قناة أوامرها ومؤقتاتها وترحيبها وإشرافها وألعابها وإعداداتها، وبوتها الخاص يعمل في نفس الوقت.", "حسابات البوت: حساب بوت واحد يمكنه إرسال ردود عدة قنوات. اختر من يرسل ردود كل قناة، وتأكد أنه يستطيع (مشرف، تسجيل الدخول) وكيف تصلح ذلك.", "بيانات أكثر أمانًا: الحفظ لا ينقطع في المنتصف، الملف التالف لا يُستبدل أبدًا، وتُصنع نسخة احتياطية قبل نقل بياناتك إلى مجلد قناتها.", "أمر مدمج جديد: عندما يسأل أحد «برنامج؟» أو «app?» يرد البوت برابط موقع التطبيق. يمكنك إيقافه من الأوامر > المدمجة.", "بعد كل تحديث، يعرض لك «فهمت» الأشياء الجديدة بجولة قصيرة.", "صفحة أوامرك العامة تعرض الآن الأوامر المدمجة أيضًا (مثل ‎!cmlist‎)، والردود يمكن أن تصل إلى 500 حرف، وهو حد تويتش."]}, {"v": "1.11.0", "tour": [23], "en": ["New Support page (System > Support): send the developers an idea or a problem, with pictures. You can paste a screenshot with Ctrl+V."], "ar": ["صفحة دعم جديدة (النظام > الدعم): أرسل للمطوّرين فكرة أو مشكلة مع صور. يمكنك لصق لقطة شاشة بـ Ctrl+V."]}, {"v": "1.10.1", "en": ["The website is now fqpnbot.com. Your public command list link is fqpnbot.com/ followed by your channel name, and it moves there by itself."], "ar": ["الموقع الآن ⁦fqpnbot.com⁩. رابط قائمة أوامرك العامة هو ⁦fqpnbot.com/⁩ ثم اسم قناتك، وينتقل إليه تلقائيًا."]}, {"v": "1.10.0", "tour": [22], "en": ["«رتب» shows the category of the word, like حيوان or بلاد, so it is much easier to guess. You can switch it off.", "Choose which categories are played, and give your own words a category of your own (like فواكه).", "New website address: commands.fqpnbot.workers.dev. Your public command list link moves there by itself.", "New installs start with the public command list switched on. If you already use the app, nothing changes."], "ar": ["«رتب» يُظهر فئة الكلمة، مثل حيوان أو بلاد، فيصير تخمينها أسهل بكثير. يمكنك إيقافه.", "اختر الفئات التي تُلعب، وأعطِ كلماتك فئة خاصة بك (مثل فواكه).", "عنوان الموقع الجديد: ⁦commands.fqpnbot.workers.dev⁩. رابط قائمة أوامرك العامة ينتقل إليه تلقائيًا.", "التثبيت الجديد يبدأ وقائمة الأوامر العامة مفعّلة. إذا كنت تستخدم التطبيق من قبل فلا شيء يتغير."]}, {"v": "1.9.1", "en": ["Fixed: the app window could still sit partly above the top of the screen. It now moves back onto the screen the moment it ends up off it."], "ar": ["إصلاح: كانت نافذة التطبيق قد تبقى جزئيًا فوق أعلى الشاشة. الآن ترجع إلى الشاشة في نفس اللحظة."]}, {"v": "1.9.0", "en": ["New mini game «⁧رتب⁩»: the bot shuffles the letters of a word and the first viewer to write it wins, with a hint halfway.", "Leaderboards: one for all games together and one per game. ⁧!فوز⁩ shows your wins per game; ⁧!الأوائل رتب⁩ shows one game's top 5.", "While a round runs, its card shows the letter or the shuffled letters and the time left.", "Everyone's earlier wins are kept, as «⁧اسم، جماد، نبات، حيوان، بلاد⁩» wins.", "New \"All games\" settings under the game cards: the wins and top 5 commands live there now, with a limit of rounds per stream (it refills every stream) and a wait between rounds.", "Every game command can have up to 5 names, in Arabic and English: ⁧!فوز⁩ and !wins, ⁧!الأوائل⁩ and !top work out of the box.", "Lighter while you play: games get the CPU first, and the app does almost nothing while it is minimized or in the tray.", "Fixed: the bot reconnected to Twitch much more often than it needed to. It now only reconnects when the connection is really gone.", "Fixed: the app window could end up off the screen after being minimized, where it couldn't be moved. It now always comes back onto a screen."], "ar": ["لعبة جديدة «رتب»: يبعثر البوت حروف كلمة وأول مشاهد يكتبها يفوز، مع تلميح في منتصف الوقت.", "لوحات صدارة: واحدة لكل الألعاب معًا وواحدة لكل لعبة. «!فوز» يعرض انتصاراتك في كل لعبة، و«!الأوائل رتب» يعرض أفضل 5 في لعبة واحدة.", "أثناء الجولة تعرض بطاقة اللعبة الحرف أو الحروف المبعثرة والوقت المتبقي.", "انتصارات الجميع السابقة محفوظة كانتصارات في «اسم، جماد، نبات، حيوان، بلاد».", "إعدادات جديدة «كل الألعاب» تحت بطاقات الألعاب: فيها أمرا الانتصارات وأفضل 5، وحد للجولات في كل بث (يتجدد مع كل بث)، وانتظار بين الجولات.", "لكل أمر في الألعاب حتى 5 أسماء بالعربي والإنجليزي: «!فوز» و«!wins»، و«!الأوائل» و«!top» جاهزة من البداية.", "أخف أثناء اللعب: الألعاب تأخذ المعالج أولًا، والتطبيق لا يكاد يعمل شيئًا وهو مصغّر أو في شريط المهام.", "إصلاح: كان البوت يعيد الاتصال بتويتش أكثر بكثير مما يلزم. الآن لا يعيد الاتصال إلا إذا انقطع فعلًا.", "إصلاح: كانت نافذة التطبيق قد تختفي خارج الشاشة بعد تصغيرها فلا يمكن تحريكها. الآن ترجع دائمًا إلى الشاشة."]}, {"v": "1.8.0", "en": ["A “What's new” window after every update, in English and Arabic (you're reading it).", "Commands are listed A to Z (Arabic ⁧أ⁩ to ⁧ي⁩), with pages at the bottom: show 10, 25, 50 or 100.", "In Arabic, the sidebar now stays on the left, like in English.", "The app's name stays in English in both languages."], "ar": ["نافذة «ما الجديد» بعد كل تحديث، بالعربية والإنجليزية (التي تقرؤها الآن).", "الأوامر مرتبة من A إلى Z (والعربية من أ إلى ي)، مع صفحات في الأسفل: عرض ⁦10⁩ أو ⁦25⁩ أو ⁦50⁩ أو ⁦100⁩.", "في العربية، الشريط الجانبي يبقى الآن على اليسار مثل الإنجليزية.", "اسم التطبيق يبقى بالإنجليزية في اللغتين."]}, {"v": "1.7.0", "en": ["The bot heals itself when Twitch rejects its login, and warns you when two copies of the app are running.", "Shortcuts can use $(query): “!g Valorant” changes the game.", "$(eval) understands Nightbot-style code, and $(followage) shows the full time.", "New Mini games page with «⁧اسم، جماد، نبات، حيوان، بلاد⁩»."], "ar": ["البوت يصلح نفسه عندما يرفض تويتش تسجيل دخوله، وينبهك عندما تعمل نسختان من التطبيق.", "الاختصارات تستخدم ⁦$(query)⁩: «⁦!g Valorant⁩» يغيّر اللعبة.", "⁦$(eval)⁩ يفهم أكواد ⁦Nightbot⁩، و⁦$(followage)⁩ يعرض المدة كاملة.", "صفحة ألعاب جديدة فيها «اسم، جماد، نبات، حيوان، بلاد»."]}, {"v": "1.6.0", "en": ["Logs has three tabs: Activity, Moderation (your filters and your mods) and Bot (everything the bot said).", "The Users page is in its own Developer group."], "ar": ["السجلات فيها ثلاث تبويبات: النشاط، والإشراف (الفلاتر والمشرفون)، والبوت (كل ما قاله البوت).", "صفحة المستخدمين في قسم المطوّر الخاص بها."]}];

function wnLtr(x){return esc(String(x).replace(/[\u2066-\u2069\u200e\u200f]/g,"")).replace(/(\$\([^)]*\)|![^\s،,.()؛<«»]+|[a-z0-9.-]+\.[a-z]{2,}\/[^\s،,)<]+|@?\{\w+\}|@?[a-z0-9]+_)/gi,function(m){return '<bdi dir="'+(/^![\u0600-\u06ff]/.test(m)?'rtl':'ltr')+'">'+m+'</bdi>'})}
function wnEn(x){return esc(x).replace(/«[^»]*»/g,function(m){return '<bdi dir="rtl">'+m+'</bdi>'})}

      +'<div lang="ar" dir="rtl"><b>العربية</b><ul>'+e.ar.map(function(x){return '<li>'+wnHead(x,wnLtr)+'</li>'}).join("")+'</ul></div></div></section>'}).join("");
  lastFocus=document.activeElement;$("wnmodal").classList.add("open");

  if(v=="events")renderEvTabs();   // a hidden page forgets its tab-bar scroll position: bring the chosen tab back into view
  if(v=="commands"){anim=true;renderCommands()}
  if(v=="moderation")renderModeration();
  if(v=="minigames")renderMinigames();
  if(v=="voice")vcLoad(true);
  if(v=="hotkeys"){renderHotkeys(true)}else if(HK.rec>=0)hkDone(null);
  if(v=="overlays")renderOverlays();else framesIdle();
  if(v=="support")supRender();
  if(v=="testchat")tcOpen();
  if(v=="giveaways")gwOpen();
  if(v=="botaccount"&&S.channels)bamLoad(true);
  if(v=="users"){if(!S.dev){location.hash="#commands";return}usVeil()}
  if(v=="dashboard"||v=="logs"){await loadLogs();renderLogs();renderDashboard();if(v=="dashboard")document.querySelectorAll("#d-cards b[data-n]").forEach(function(el){countUp(el,+el.dataset.n)})}
  window.scrollTo(0,0)}
function setLang(l,save){
  lang=l;var d=document.documentElement;d.lang=l;d.dir=l=="ar"?"rtl":"ltr";$("lg").value=l;
  if(save){try{localStorage.setItem("fqpn-lang",l)}catch(e){}}
  fillSelects();applyStatic();buildAnn();anim=true;renderAll();fitSidebar()}
/* 1.9.0, lighter while you play: the page used to download every section and the logs every 6 seconds, even minimized or in
   the tray. Now it asks for the status only, reloads the settings / the logs only when the app says they changed (S.rev /
   S.logrev), sleeps while nobody can see it (the app tells it, and it watches visibilitychange too), and looks every 15 s
   while the window is open but another program (a game) has the focus. */
var appHidden=false,tickT=null,tickBusy=false,seenRev,seenLogRev;
function asleep(){return appHidden||document.hidden}
function sleepCss(){document.body.classList.toggle("asleep",asleep());document.body.classList.toggle("unfocused",!document.hasFocus())}   // 1.14.0: animations pause when the window isn't in use
function wake(){sleepCss();framesIdle();if(curView=="overlays"&&!asleep()&&$("ovitems"))renderOverlays();if(asleep()||tickBusy)return;clearTimeout(tickT);tickT=null;tick()}
window.appVisible=function(v){appHidden=!v;wake()};
document.addEventListener("visibilitychange",wake);window.addEventListener("focus",wake);window.addEventListener("blur",sleepCss);
async function tick(){
  tickT=null;if(asleep())return;                    // woken again by wake()
  tickBusy=true;
  try{await loadStatus();maybeShowUpdatePopup();renderUpdatePopup();
    if(!modalOpen()){var rv=S.rev,lr=S.logrev;
      if(rv===undefined||rv!==seenRev){if(await loadSections())seenRev=rv}
      if((curView=="logs"||curView=="dashboard")&&(lr===undefined||lr!==seenLogRev)){await loadLogs();seenLogRev=lr}
      var sig=rv===undefined?JSON.stringify([D,S,LOGS,offline]):JSON.stringify([S,seenRev,seenLogRev,offline]);if(sig!==lastSig){lastSig=sig;anim=false;renderAll();anim=true}}
  }catch(e){}
  tickBusy=false;
  if(!asleep())tickT=setTimeout(tick,((S.login&&S.login.status=="waiting")||(S.bot_add&&S.bot_add.status=="waiting"))?2000:document.hasFocus()?6000:15000)}
window.addEventListener("hashchange",show);
(async function boot(){
  var th=null,lg=null,saved=null;try{th=localStorage.getItem("fqpn-theme");lg=localStorage.getItem("fqpn-lang");saved=localStorage.getItem("fqpn-ui")}catch(e){}
  if(saved){try{UI=cleanUi(JSON.parse(saved))}catch(e){UI=cleanUi()}}else UI=cleanUi({dark:th!="light",language:lg=="ar"?"ar":"en"});
  setLang(UI.language,false);applyUi();   // this device's copy first, so nothing flashes
  await loadStatus();seenRev=S.rev;await loadSections();
  if(D.ui){UI=cleanUi(D.ui);applyUi();try{localStorage.setItem("fqpn-ui",JSON.stringify(UI))}catch(e){}}   // the bot's copy wins
  lastSig=JSON.stringify([D,S,LOGS,offline]);anim=true;renderAll();await show();tick();
  if(!UI.tourDone)setTimeout(function(){if(!tour.on&&!modalOpen())startTour(0)},500)})();   // first run: the tour starts by itself

</script>
