tream",mg_rounds_n:"{n} per stream",mg_used:"{u} of {l} used this stream",mg_nolimit:"No limit",mg_cool:"Cooldown between rounds",mg_cool_s:"Cooldown between rounds (seconds)",mg_cool_n:"{n} between rounds",mg_cool_wait:"Next round in {n}",mg_off_short:"Off",mg_s:"{n} s",mg_min:"min",mg_rounds_note:"0 = no limit. Every round counts, started from chat or automatically, in any game. It refills when your next stream starts; a short drop doesn't refill it. You, the broadcaster, can always start a round.",mg_cool_note:"0 = no wait. After a round ends, the next one (any game) can start only after this many seconds. Automatic rounds wait too.",mg_al_ph:"Add a name",mg_al_more:"Add another name",mg_al_hint:"A command can have up to 5 names, like !فوز and !wins. Type one and press Enter or space.",mg_al_max:"A command can have at most 5 names.",mg_al_dup:"{n} is already in the list.",mg_al_need:"Every command needs at least one name.",wn_btn:"What's new",bk_t:"Backup",bk_e_other:"The backup couldn't be read or restored ({m}). Nothing was changed.",bk_s:"Save your whole setup in one file, or bring it back from one. Your Twitch logins are never in the file.",bk_save:"Save a backup",bk_rest:"Restore from a backup…",bk_saved:"Backup saved: {f}. {s}",bk_n_cmd:"{n} commands",bk_n_tim:"{n} timers",bk_n_ev:"{n} event replies",bk_n_gr:"{n} greetings",bk_n_bl:"{n} blocked",bk_n_gm:"{n} mini games",bk_n_none:"settings only",bk_q_t:"Restore this backup?",bk_q_b:"Made on {d} by FQPN's Chat Bot {v}, for {c}. {s}. This replaces your current setup. Right before restoring, your current setup is saved as a backup too, so you can undo this.",bk_q_ok:"Restore",bk_done:"Backup restored. Your previous setup was saved in the data folder as {f}.",bk_done_skip:"Backup restored, except: {p} (damaged in the file). Your previous setup was saved in the data folder as {f}.",bk_e_not:"This isn't a FQPN's Chat Bot backup. Nothing was changed.",bk_e_newer:"This backup is from a newer version of the app. Update the app first. Nothing was changed.",bk_e_big:"This file is too big to be a backup. Nothing was changed.",bk_e_write:"The backup couldn't be saved there. Try another folder.",bk_e_safety:"Your current setup couldn't be saved first, so nothing was restored.",bk_p_commands:"commands",bk_p_timers:"timers",bk_p_events:"event replies",bk_p_greetings:"greetings",bk_p_blocklist:"blocklist",bk_p_moderation:"moderation",bk_p_games:"mini games",bk_p_game_wins:"game wins",bk_p_counters:"counters",bk_p_stream:"stream messages",bk_p_giveaway:"giveaway settings",bk_p_settings:"settings",bk_p_prefs:"app settings",bk_p_ui:"appearance",pg_show:"Show {n}",pg_info:"Page {p} of {n}",pg_prev:"Previous page",pg_next:"Next page",pg_size:"Commands per page",mg_ann:"Post rounds and winners as announcements",mg_ann_s:"The highlighted box in chat. !فوز and !الأوائل stay normal replies. The bot must be a moderator for announcements.",mg_title:"Mini games",mg_sub:"Games your viewers play in chat. Winners are announced and their wins are kept.",mg_letters_t:"اسم، جماد، نبات، حيوان، بلاد",mg_letters_d:"The bot picks a category and a letter; the first viewer to write a correct word wins. Start a round with {c}.",mg_letters_info:"A round: the bot announces a category (name, object, plant, animal or country) and a letter. The first viewer whose answer starts with that letter and is a real word of that category wins. ال, أ/إ/آ, ى/ي, ة/ه and tashkeel don't matter. A mod can approve a word the bot doesn't know, and it's added to the list.",mg_letters_ex:"{s} → «🎲 الفئة: بلاد — بحرف: س…»|«السعودية» → 🎉 wins|«سكوتلندا» (not in the list) → a mod types {a} to approve it|{w} → your wins · {t} → the leaderboard link",mg_on:"Game is on",mg_off:"Game is off",mg_on_toast:"Mini game turned on",mg_off_toast:"Mini game turned off",mg_top:"Leaderboard",mg_reset:"Reset all wins",mg_p_all:"All time",mg_p_week:"This week",mg_p_month:"This month",mg_per_aria:"Which time",mg_none_week:"No wins this week yet. The week starts on Sunday.",mg_none_month:"No wins this month yet.",mg_wins:"{n} wins",mg_none:"No winners yet. Start a round in chat!",mg_reset_q:"Reset everyone's wins?",mg_reset_body:"Every game's leaderboard starts from zero. This can't be undone.",mg_reset_toast:"Wins reset",we_add:"+ Add a winner",we_add_d:"For a viewer whose wins were lost (a new PC, a reset). Type their Twitch name and their wins in each game.",we_edit:"Change wins",we_edit_n:"Change {n}'s wins",we_edit_d:"All-time wins in each game. Set them all to 0 to take this viewer off the leaderboard.",we_name:"Twitch name",we_total:"Total wins:",we_save:"Save",we_saved:"Wins saved",we_removed:"Taken off the leaderboard",we_need_name:"Type their Twitch name.",mg_c_start:"Start a round",mg_c_approve:"Approve a word (mods)",mg_c_wins:"Your wins",mg_c_top:"Leaderboard",mg_who:"Who can start a round",mg_secs:"Seconds to answer",mg_auto:"Automatic round every … minutes (0 = off)",mg_auto_note:"Automatic rounds only happen while you're live.",mg_cats:"Categories",mg_letters:"Letters",mg_letters_note:"Hard letters (ث ذ ض ظ غ) are off at first. The bot never picks a letter nobody can answer.",mg_words:"Words you added",mg_words_note:"The bot already knows about 190 countries, 250 names and 130+ objects, plants and animals. Add your own here; words mods approve are added automatically.",mg_word_ph:"word",log_game_start:"Mini game: {c} with {l}",log_game_win:"Won with «{w}»",log_game_by:"by {u} · {c}",mg_scr_t:"Unscramble «⁧رتب⁩»",mg_scr_d:"The bot shows a word with its letters shuffled; the first viewer to write the word wins. Start a round with {c}.",mg_scr_info:"A round: the bot posts the letters of an everyday word (3 to 5 letters, or up to 7 if you choose) in a shuffled order, never the right one. The first viewer who writes the word wins. ال, أ/إ/آ, ة/ه and tashkeel don't matter. Halfway through, a hint gives the first letter.",mg_scr_ex:"{s} → «🔀 رتب الحروف: ة ، ف ، ر ، ش ، ا…»|«فراشة» or «الفراشة» → 🎉 wins|Nobody in time → «⏰ انتهى الوقت! الكلمة كانت «فراشة»»|{t} → the leaderboard link · {w} → your wins",mg_lad_t:"Ladder «⁧سلم⁩»",mg_lad_d:"The bot gives a letter; the first viewer to write a few different words starting with it wins. Start a round with {c}.",mg_lad_info:"A round: «🪜 تحدي السلم | أسرع واحد يكتب 3 كلمات تبدأ بحرف «ت»!». The first viewer who writes that many DIFFERENT words starting with the letter, in one message, wins. أ/إ/آ count as ا, and «ال» at the start is skipped (التمر counts for ت). Repeated words and one-letter words don't count.",mg_lad_ex:"{s} → «🪜 تحدي السلم | أسرع واحد يكتب 3 كلمات تبدأ بحرف «ت»!»|«تمر تفاح توت» → 🎉 wins|Nobody in time → «⏰ انتهى الوقت! ما أحد كتب 3 كلمات بحرف «ت».»|{w} → your wins · {t} → the leaderboard link",mg_opp_t:"Opposites «⁧ضد⁩»",mg_opp_d:"The bot posts a word; the first viewer to write its opposite wins. Start a round with {c}.",mg_opp_info:"A round: one Arabic word (about 130 pairs built in). Easy: everyday words like طويل and قصير. Hard: harder words like كريم and بخيل. Every fair opposite counts (قديم: جديد or حديث), and ال, أ/إ/آ, ة/ه and tashkeel don't matter. Halfway, a hint shows how the answer starts. Choose the level in ⚙.",mg_opp_ex:"{s} → «🔄 ضد: «طويل» — أول واحد يكتب الضد يفوز!»|Halfway → «💡 تلميح: يبدأ بـ «ق» (4 حروف)»|«قصير» → 🎉 wins|{w} → your wins · {t} → the leaderboard link",mg_opl_easy:"Easy (everyday words)",mg_opl_hard:"Hard (harder words)",mg_opp_live:"Write its opposite",mg_rid_t:"Riddles «⁧لغز⁩»",mg_rid_d:"The bot posts an easy riddle; the first viewer to write the answer wins. Start a round with {c}.",mg_rid_info:"A round: an easy riddle in Arabic (about 90 built in). Viewers write the answer itself; some riddles have more than one fair answer, and all of them count. ال, أ/إ/آ, ة/ه, tashkeel and spaces don't matter. Halfway, a hint shows how the answer starts. Riddles need more thinking, so a round is 45 seconds at first.",mg_rid_ex:"{s} → «🧠 لغز: له أسنان ولا يعض؟ — اكتب الجواب!»|Halfway → «💡 تلميح: يبدأ بـ «الم» (5 حروف)»|«المشط» or «مشط» → 🎉 wins|{w} → your wins · {t} → the leaderboard link",mg_trn_t:"Translate «⁧ترجم⁩»",mg_trn_d:"The bot posts a word; the first viewer to write it in the other language wins. Start a round with {c}.",mg_trn_info:"A round: one word to translate (about 270 built in). Easy: everyday words like colors, animals and food. Hard: less common words. Which way: random (the start: it changes every round), or always English → Arabic, or always Arabic → English. Every fair translation counts (car: سيارة, عربية or موتر), and capitals, “the” or ال don't matter. Halfway, a hint shows how the answer starts. Choose the level and the way in ⚙.",mg_trn_ex:"{s} → «🔤 ترجم للعربي: «car» — أول واحد يكتبها يفوز!»|«سيارة» or «عربية» → 🎉 wins|Arabic → English: «🔤 ترجم للإنجليزي: «قطة»» → «cat» wins|{w} → your wins · {t} → the leaderboard link",mg_trl_easy:"Easy (everyday words)",mg_trl_hard:"Hard (less common words)",mg_way:"Which way",mg_way_en_ar:"English → Arabic",mg_way_ar_en:"Arabic → English",mg_way_mixed:"Random (changes every round)",mg_trn_to_ar:"Write it in Arabic",mg_trn_to_en:"Write it in English",mg_tri_t:"Trivia «⁧سؤال⁩»",mg_tri_d:"A question; the first viewer to write the right answer wins. Start a round with {c}.",mg_tl_hard:"Only the question (harder)",mg_tl_easy:"Also show 4 choices (easier)",mg_tri_mode:"How viewers answer",mg_tq_easy:"Easy questions",mg_tq_medium:"Medium questions",mg_tq_hard:"Hard questions",mg_tq_mixed:"Mixed (all levels)",mg_odd_t:"Odd one out «⁧الدخيل⁩»",mg_odd_d:"The bot posts 4 words; the first viewer to write the one that doesn't belong wins. Start a round with {c}.",mg_odd_info:"A round: 4 Arabic words; 3 belong together and 1 doesn't. Easy: clearly different groups (3 fruits and an animal). Hard: close ones (3 capitals and جدة, 3 birds that fly and a penguin). Viewers write the odd word; writing one of the other three means that viewer can't answer again this round. The winner's message says what the other three have in common. Choose the level in ⚙.",mg_odd_ex:"{s} → «🕵️ الدخيل: تفاح • موز • أسد • عنب — وش الكلمة اللي ما تنتمي للباقي؟»|«أسد» → 🎉 wins (الباقي: فواكه)|«موز» → can't answer again this round|{w} → your wins · {t} → the leaderboard link",mg_odl_easy:"Easy (clearly different groups)",mg_odl_hard:"Hard (close groups)",mg_odd_live:"Write the one that doesn't belong",mg_tri_hint_s:"Only with “Only the question”: halfway through the round, the bot shows how the answer starts and how many letters.",mg_tri_info:"A round: a general-knowledge question in Arabic (about 270 built in: Easy, Medium and Hard questions, or Mixed). Only the question (the start): halfway, a hint shows how the answer starts. With 4 choices: the choices are shown too. Viewers write the answer itself, like «⁧مسقط⁩» (numbers like 1 or 2 don't count). ال, أ/إ/آ, ة/ه, tashkeel and spaces don't matter. With 4 choices, writing one of the wrong choices means that viewer can't answer again this round, so nobody can just send all four. Choose the level in ⚙.",mg_tri_ex:"{s} → «❓ سؤال: ما عاصمة اليابان؟ — اكتب الجواب!»|Halfway → «💡 تلميح: يبدأ بـ «ط» (5 حروف)»|With 4 choices → «… | بكين • طوكيو • سيول • بانكوك — اكتب الجواب!»|«طوكيو» → 🎉 wins|{w} → your wins · {t} → the leaderboard link",mg_words:"How many words",mg_words_n:"{n} words",mg_lad_live:"{n} words starting with «{l}»",tcg_ladder_start:"Starts «سلم»",tcg_trivia_start:"Starts «سؤال»",mg_emo_t:"Emoji «⁧ايموجي⁩»",mg_emo_d:"The bot posts emojis; the first viewer to write the word wins. Start a round with {c}.",mg_emo_info:"A round: the bot posts a few emojis (like 🐪🏜️). The first viewer who writes the word they make wins; some puzzles accept more than one word. ال, أ/إ/آ, ة/ه and tashkeel don't matter. Halfway through, a hint gives the first letter and how many letters. Over 120 simple emoji puzzles are built in (like 🐝🍯 → عسل), and you can add your own.",mg_emo_ex:"{s} → «🧩 ايموجي: 🐪🏜️ — وش الكلمة؟…»|«صحراء» or «الصحراء» → 🎉 wins|Nobody in time → «⏰ انتهى الوقت! الجواب كان «صحراء»»|{w} → your wins · {t} → the leaderboard link",mg_rev_t:"Backwards «⁧عكس⁩»",mg_rev_d:"The bot writes an everyday word backwards; the first viewer to write it the right way wins. Start a round with {c}.",mg_rev_info:"A round: the bot shows an everyday word written backwards (like «ةرايس»). The first viewer who writes it the right way wins. Pasting it backwards doesn't count. ال, أ/إ/آ, ة/ه and tashkeel don't matter. Halfway through, a hint gives the first letter and how many letters.",mg_rev_ex:"{s} → «🔁 بالعكس: «ةرايس» — اكتبها صح!…»|«سيارة» → 🎉 wins|Nobody in time → «⏰ انتهى الوقت! الجواب كان «سيارة»»|{w} → your wins · {t} → the leaderboard link",mg_mth_t:"Quick math «⁧احسب⁩»",mg_mth_d:"The bot posts a quick sum; the first right answer wins. Start a round with {c}.",mg_mth_info:"A round: the bot posts a sum (like «7 × 8 = ؟»). The first viewer who writes the answer wins, in Arabic or Western digits (٥٦ or 56). Easy: + and −. Normal: also × up to 10. Hard: bigger numbers and ÷ (always a whole answer).",mg_mth_ex:"{s} → «🧮 احسب: 7 × 8 = ؟…»|«56» or «٥٦» → 🎉 wins|Nobody in time → «⏰ انتهى الوقت! الجواب كان «56»»|{w} → your wins · {t} → the leaderboard link",mg_c_random:"Random game",mg_c_list:"Games list",mg_list_note:"«العاب؟» answers with the commands of the games that are on, like «🎮 الألعاب: حروف؟ | رتب؟ | لغز؟».",mg_random_note:"«لعبه؟» starts a round of a random game, among the games that are on and that this viewer may start. The wins command shows just the total wins; with a name, like «!فوز @FQPN», that person's total.",mg_top_note:"With your public command list on, the leaderboard command sends the link to your games leaderboard; otherwise it lists the top 5 in chat.",mg_level:"How hard",mg_lv_easy:"Easy (+ and −, up to 20)",mg_lv_normal:"Normal (also × up to 10)",mg_lv_hard:"Hard (bigger numbers, and ÷)",mg_q_hint_s:"Halfway through the round, the bot gives the first letter and how many letters.",mg_emo_own:"Your own puzzles",mg_emo_own_note:"Emojis, and the words that count as right (separated by commas). Yours are played along with the built-in ones.",mg_emo_e_ph:"Emojis, like 🐪🏜️",mg_emo_a_ph:"Answers, like صحراء، الصحراء",mg_emo_need:"Write the emojis and at least one answer.",mg_emo_none:"No puzzles of your own yet.",mg_scr_len:"Word length",mg_scr_len_n:"Up to {n} letters",mg_scr_len_note:"Built-in words up to this length (3 or more letters). Your own words are always played.",mg_scr_shared:"The wins, leaderboard and random game («لعبه؟») commands are in All games, under the game cards.",mg_scr_words_note:"The bot already knows 700+ words. Add your own: one Arabic word of 3 to 7 letters.",mg_scr_bad:"«{w}» can't be used: a word for «⁧رتب⁩» is one Arabic word of 3 to 7 letters.",mg_shared_note:"The wins, leaderboard and random game («لعبه؟») commands are in All games, under the game cards.",mg_hint:"Halfway hint",mg_hint_s:"Halfway through the round, the bot gives the first letter.",mg_live:"Round live",mg_live_secs:"{n} s",mg_live_cat:"Category: {c}",mg_live_hint:"Hint given: it starts with «{l}»",mg_tabs_aria:"Leaderboards",mg_tab_all:"All games",mg_none_game:"No wins in this game yet.",mg_reset_game:"Reset this game",mg_reset_game_q:"Reset the wins from «{g}»?",mg_reset_game_body:"Wins from «{g}» are taken off everyone's totals. Wins from the other games stay. This can't be undone.",log_game_scr:"Mini game: ⁧رتب⁩ ({l})",hl_twocopies:"Two copies of the app are running. Close one: together they break the Twitch login and the bot goes silent.",hl_heal_login:"The bot reconnected by itself {a}: Twitch had rejected its login, and it switched to the newest saved one.",hl_heal_quiet:"The bot reconnected by itself {a}: chat had gone completely quiet while you were live.",tr22_t:"Mini games",tr22_d:"Games your viewers play in chat: «⁧اسم، جماد، نبات، حيوان، بلاد⁩», «⁧رتب⁩», «⁧ايموجي⁩», «⁧عكس⁩», «⁧احسب⁩», «⁧سلم⁩», «⁧سؤال⁩», «⁧لغز⁩», «⁧ترجم⁩» and «⁧ضد⁩» (and «⁧لعبه؟⁩» for a random one). Each game starts with «name؟» or «!name», and «⁧العاب؟⁩» lists the games that are on. The leaderboard has All time, This week and This month. In «⁧سؤال⁩» viewers write the answer itself, and ⚙ chooses Hard (only the question) or Easy (4 choices). Switch one on, ⓘ shows how it works, ⚙ its settings. All games (below) has the shared commands and limits.",nav_users:"Users",us_veil_t:"Make sure no one can see this except the developers…",us_veil_d:"This page lists every channel that uses the app. If you're streaming or sharing your screen, hide the app first.",us_veil_alone:"Make sure you're alone 😉",us_veil_show:"Show",us_title:"Users",us_sub:"Channels that use FQPN's Chat Bot. Only you and the other developers can see this page.",us_search:"Search channels",us_c_channel:"Channel",us_c_version:"Version",us_c_last:"Last seen",us_c_first:"First seen",us_t_all:"channels",us_t_week:"active this week",us_t_day:"active today",us_t_ban:"turned off",us_now:"just now",us_min:"{n} min ago",us_h:"{n} h ago",us_d:"{n} days ago",us_dev:"developer",us_banned:"turned off",us_ban:"Turn off",us_unban:"Turn back on",us_c_live:"Live",us_t_live:"live now",us_live:"Live",us_viewers:"{n} viewers",us_offline:"Offline",us_watch:"Watch",us_list:"Public list",us_live_unknown:"Twitch didn't say who is live right now. Press Refresh to try again.",us_ban_q:"Turn the app off for {n}?",us_unban_q:"Turn the app back on for {n}?",us_ban_body:"Their bot stops and their app shows that the developer turned it off for their channel. It takes effect the next time their app checks (when it starts, or within a day).",us_unban_body:"Their bot works again the next time their app checks (when it restarts, or within an hour).",us_banned_toast:"The app is turned off for {n}",us_unbanned_toast:"The app is turned back on for {n}",us_loading:"Loading the list…",us_err:"Couldn't load the list: {m}",us_none:"No channels yet.",us_nomatch:"No channel matches your search.",off_t:"FQPN's Chat Bot is turned off for this channel",off_d:"The app's developer has turned FQPN's Chat Bot off for this channel, so the bot doesn't run here.",off_note:"If you think this is a mistake, contact the developer.",mod_title:"Moderation",mod_sub:"Filters that keep your chat clean. You and your moderators are never filtered.",mod_prob_scopes:"Twitch didn't let the bot delete messages or time people out. Open the account menu (bottom left) and choose Reconnect to give it permission. If you use a separate bot account, make it a moderator in your chat.",mod_prob_other:"Twitch refused the last moderation action. Check that the bot can moderate your chat.",mf_on:"Filter is on",mf_off:"Filter is off",mf_on_toast:"{n} turned on",mf_off_toast:"{n} turned off",mf_info:"What {n} does",mf_settings:"{n} settings",mf_ex:"Examples",mf_badwords_t:"Bad words",mf_badwords_d:"Arabic and English words, even when people try to hide them.",mf_badwords_info:"Deletes messages with words or phrases from your list. It still catches them with dots or spaces between letters, numbers instead of letters, stretched or repeated letters, tashkeel and the different forms of Arabic letters.",mf_badwords_ex:"“you are an idiot” → deleted|“i.d.i.o.t”, “1d10t”, “⁧حمــــار⁩”, “⁧ح.م.ا.ر⁩” → also caught|“this class is great” → fine (whole words only)",mf_links_t:"Links",mf_links_d:"Only links to your trusted sites stay.",mf_links_info:"Deletes messages with links to sites that aren't on your trusted list, including hidden links like “site . com” or “site(dot)com”.",mf_links_ex:"“check spam-site.com” → deleted|“free skins at site(dot)com” → deleted|“clips.twitch.tv/…” → stays (trusted)",mf_caps_t:"Excess caps",mf_caps_d:"Messages written mostly in capital letters.",mf_caps_info:"Deletes longer messages where most letters are capitals. Short messages and emote names don't count.",mf_caps_ex:"“WHY IS NOBODY ANSWERING ME” → deleted|“LOL” → fine (too short)",mf_emotes_t:"Excess emotes",mf_emotes_d:"Walls of emotes.",mf_emotes_info:"Deletes messages with more emotes than the limit you set.",mf_emotes_ex:"“Kappa Kappa Kappa Kappa Kappa Kappa Kappa Kappa” → deleted",mf_symbols_t:"Excess symbols",mf_symbols_d:"Symbol walls, ASCII art and glitch text.",mf_symbols_info:"Deletes messages that are mostly symbols, and g̷l̸i̶t̷c̶h text. Normal punctuation and Arabic tashkeel are fine.",mf_symbols_ex:"“░▒▓█▓▒░░▒▓█▓▒░” → deleted|“g̷l̸i̶t̷c̶h̴y̵ text” → deleted|“Hi! How are you?” → fine",mf_repeats_t:"Repetitions",mf_repeats_d:"The same words or message again and again.",mf_repeats_info:"Deletes a message that repeats one word many times, or the same message sent again and again within a minute.",mf_repeats_ex:"“hi hi hi hi hi hi hi hi” → deleted|the same message pasted 3 times → deleted",mf_shared_t:"Shared chat",mf_shared_d:"Also filter messages from channels sharing your chat.",mf_shared_info:"When you share your chat with another streamer, their viewers' messages are checked by your filters too.",mf_shared_ex:"you share chat with a friend → spam links from their viewers are deleted too",mf_words:"Your words and phrases",mf_word_ph:"word or phrase",mf_any:"Also inside other words",mf_any_tag:"anywhere",mf_add:"Add",mf_starter:"Add starter list",mf_starter_toast:"{n} words added from the starter list. Remove any you don't want.",mf_allowed:"Allowed words (never caught)",mf_allowed_ph:"word",mf_none:"Nothing here yet.",mf_trusted:"Trusted sites",mf_trusted_ph:"example.com",mf_trusted_reset:"Restore the usual sites",mf_trusted_note:"A site also covers its sub-addresses: example.com covers shop.example.com. Link shorteners like bit.ly are not trusted unless you add them.",mf_pct:"Count it when this % of letters are capitals",mf_pct_sym:"Count it when this % of the message is symbols",mf_min:"Only for messages at least this long (characters)",mf_max:"Most emotes allowed in one message",mf_wr:"Count it when one word is repeated this many times",mf_sm:"Count it when the same message is sent this many times in a mi g».",vc_hist_fix:"Fix spelling",vc_hist_none:"Nothing yet: press your talk key and say a command.",vc_hist_ok:"Done",vc_hist_fail:"Didn't work",vc_c_roles:"VIP / mod",vc_n_roles:"Uses your own Twitch login (Twitch allows nothing else for these). If it says to log in again: Settings → log out, then log in.",vc_h_fix:"Spelling fixes",vc_h_fix_s:"What it keeps hearing wrong → what it should be. It also learns by itself: when you say yes (or pick 1, 2 or 3) to a name it had to guess, those words mean that person from then on.",vc_fix_heard:"It hears…",vc_fix_to:"It should be…",vc_fix_add:"Add",vc_fix_learned:"Learned by itself",vc_fix_yours:"Yours",vc_fix_n:function(p){return "used "+p.n+"×"},vc_fix_del:"Delete the fix for {n}",vc_fix_none:"Nothing yet. Add one above, or just use voice: names you confirm are learned here by themselves.",vc_fix_both:"Write both: what it hears, and what it should be.",vc_fix_added:"Fix added",vc_fix_built:"Plus 58 built-in fixes for the command words (like «⁨تام اوت⁩» → timeout, «⁨في آي بي⁩» → VIP).",vc_c_timeout:"Timeout",vc_h_more:"More",vc_h_screen:"The mic on your screen",vc_h_setup:"Your setup",vc_h_say_s:"Say it your way: Arabic, English or both mixed, like «فقبن تايم اوت عشر دقايق» or “start حروف”. Switch off what you don't want.",vc_h_say:"What you can say",vc_step3:"Let go: done ✓",vc_step2:"Say what the bot should do",vc_step1:"Hold {k}",vc_sw_off:"Off",vc_sw_on:"On",vc_beta:"Beta",vc_title:"Voice commands",nav_voice:"Voice",vc_sub:"Say what the bot should do while you play: hold a key, talk, let go.",vc_h_on:"Voice commands on your PC",vc_s:"Hold a key and say what the bot should do: start a game, timeout someone, reset a counter… Off: nothing is downloaded and the microphone is never opened.",

rs_t:"Mods can reset counters from chat",ob_t:"On stream (OBS)",nav_overlays:"Overlays",ov_t:"Overlays",ov_s:"Show your counters and who was first on stream. One link for all of them, and you choose where each one sits.",ov_link_t:"One link for all your overlays",ov_link_s:"In OBS: <b>Sources → + → Browser</b>, paste this link, Width <b>1920</b>, Height <b>1080</b>. Its background is see-through, so put it above your game.",ov_items:"What shows on stream",ov_counter:"Counter · now {n}",ov_none:"No counters yet. Make one in Commands → Counters.",ov_first_s:"Who wrote first this stream, with their picture and streak. «Who's first today?» leaves the stream when the time is up",ov_needs_first:"Needs a Pin first message command (Commands → New Command)",ov_drag:"Click one to select it (Ctrl or Shift + click, or draw a box, for more). Drag to move, drag a corner to resize, arrow keys to nudge. They can't go into each other. OBS follows right away.",ov_tip:"Tip: drag to move · drag a corner to resize · Ctrl+click or draw a box to pick more · arrow keys to nudge",ov_big:"Full screen",ov_small:"Close full screen",ov_reset:"Back to the corner",ov_reset_q:"Put all of them back in the corner?",ov_reset_body:"They go back together to the top-left corner (top-right in Arabic), at their normal size.",ov_reset_done:"Back in the corner",ov_moved:"Saved: OBS shows it like this now",ov_open:"Open Overlays",ob_first:"First in chat",ob_first_on:"First in chat shows on stream (with a Pin first message command)",ob_first_off:"First in chat is off the stream",ob_s_off:"Press the screen button on a counter to show it on stream. Place them and get the OBS link on the Overlays page.",ob_s_on:"On stream: {n}. Place them and get the OBS link on the Overlays page.",ob_copy:"Copy link",ob_copied:"Link copied: in OBS, add a Browser Source and paste it.",ob_show:"Show {n} on stream",ob_hide:"Stop showing {n} on stream",ob_on_toast:"{n} is on stream now",ob_off_toast:"{n} isn't on stream anymore",rs tr44_t:"Command history",tr44_d:"Every change to a command is kept here: from this page, from mods in chat (!cmadd, !cmedit, !cmdel), the editor link or a backup. See who changed what and when, and undo any change. A deleted command comes back with Bring back. Right after you save or delete a command, an Undo button also shows at the bottom for a few seconds.",tr51_t:"All variables",tr51_d:"Not sure what a variable does? This opens a page on fqpnbot.com with every variable, an example command for each, and a box to try your reply.",vars_all:"All variables",ev_t_fanniv:"Follow anniversary",ev_d_fanniv:"A follower's first message on their follow anniversary (1 year, 2 years…), or in the 6 days after it, once a year, while you're live. {user} is that viewer, {years} the number of years. The app remembers everyone's first follow date, so if someone unfollows by mistake and follows again, $(followage) and this still count from the first time (from now on: dates the app hasn't seen yet can't be known).",ev_u_years:"Years",tce_follow_anniversary:"{u}'s follow anniversary",ev_t_flevel:"Falkorie level",ev_d_flevel:"When the Falkorie bot writes that a viewer reached a new level (like «auk78 is now level 6!»). {user} is that viewer, {level} the level. Pick different replies by level.",ev_t_fstreak:"Falkorie streak",ev_d_fstreak:"When the Falkorie bot shows a viewer's watch streak (like «FQPN_ has watched 112 streams in a row!»), also when someone writes !streak. {user} is that viewer, {streak} the number. Each person gets one streak reply per stream, even if they write !streak again or you restart the app (when you aren't live: once a day).",tr53_t:"Replies tag the viewer",tr53_d:"In every event reply, {user} now tags the viewer: @fqpn_ instead of fqpn_, so they get notified. A reply that already has @{user} stays the same.",wc_title:"First-time chatters",wc_on:"On",wc_off:"Off",wc_sub:"When someone writes in your chat for the very first time, the bot welcomes them a few seconds later, with a different reply when they say «⁨السلام عليكم⁩» and when they just followed. It only works while you're live. The app remembers everyone who has chatted since Stream stats came (and the last 30 days before it), so your regulars aren't greeted as new.",wc_how:"«Just followed» = they followed during this stream or in the last hour. «⁨السلام عليكم⁩» also covers «⁨سلام عليكم⁩», «⁨السلام⁩» and «salam». Leave a list empty and the bot uses the closest one, ending with «Anything else». {user} becomes @name; with several replies the bot picks one at random.",wc_l_sf:"Said «⁨السلام عليكم⁩» and just followed",wc_l_s:"Said «⁨السلام عليكم⁩», didn't follow",wc_l_f:"Just followed",wc_l_n:"Anything else",wc_pv_f:"Just followed",wc_pv_n:"Didn't follow",wc_add:"+ New reply",wc_del:"Delete this reply",wc_max:"30 replies is the most.",wc_deleted:"Reply deleted",wc_delay:"Wait before replying",wc_delay_s:"So it doesn't feel like a bot.",wc_secs:function(p){return p.n=="0"?"Right away":p.n+" seconds"},wc_skip:"Skip if the first message is a command",wc_skip_s:"Like someone whose first message is !discord: they came for the link.",wc_bots:"Reply to bots",wc_bots_s:"Like Nightbot or Falkorie.",wc_preview:"Preview",wc_first:"First-time chatter",wc_hello:"hello everyone",wc_on_toast:"First-time chatters: on",wc_off_toast:"First-time chatters: off",tc_first:"First time",tc_first_s:"Send the next message as this viewer's first message ever",tcn_followhold:"Follow reply in {s} seconds: if this viewer writes their first message before that, the First-time chatters welcome thanks them instead.",tcn_welcome:"This viewer is new here: the First-time chatters welcome comes in a few seconds…",tr58_t:"Voice history and more voice actions",tr58_d:"Your last 20 voice commands, with «Fix spelling» next to anything heard wrong. And voice can now change counters («⁨زيد الموتات⁩», \"deaths plus one\"), run a command («⁨شغّل أمر ديسكورد⁩»), ignore someone («⁨تجاهل فقبن⁩») and clear chat («⁨امسح الشات⁩»): switch them on above.",tr57_t:"Spelling fixes and VIP / mod",tr57_d:"Voice now fixes what it keeps hearing wrong: add your own (it hears… → it should be…), and names you confirm are learned by themselves. And it can give or take VIP and mod: «⁨عطه في آي بي فقبن⁩», \"mod FQPN\" (switch «VIP / mod» on above).",tr56_t:"Follow anniversary",tr56_d:"On a follower's follow anniversary, their first message gets a reply like «⁨@sam_99 صار لك سنة كاملة متابع/ة!⁩». The app now keeps everyone's first follow date, so an unfollow by mistake doesn't reset their followage.",tr55_t:"First-time chatters",tr55_d:"Someone's first message ever in your chat gets a welcome: «⁨وعليكم السلام @auk78، نورت/ي وشكرا عالفولو⁩» when they said السلام and just followed, «⁨@sara حياك نورت/ي⁩» when they didn't follow, and so on. Pick the replies, the wait, and whether commands and bots are skipped. In Test chat, switch on «First time» to try it.",tr54_t:"!wins: just the total",tr54_d:"The wins command (!فوز / !wins) now answers with one number: all the wins together, like «@FQPN_ عندك 8 فوزات», with the number written the Arabic way (فوز واحد، فوزتين، 3 فوزات، 11 فوز). No more week, month and per-game parts. The leaderboard still shows them.",tr52_t:"Falkorie replies",tr52_d:"If you use the Falkorie bot: the bot answers when Falkorie says someone reached a new level or shows their streak. Write the replies here, and pick different ones by level or streak.",tr46_t:"Import",tr46_d:"Bring your commands and timers from Nightbot or StreamElements. You choose what comes in, and one click undoes it all.",tr47_t:"Overlays for OBS",tr47_d:"Copy this one link into OBS as a Browser Source. Then switch on what shows on stream, and drag it where you want on the preview below. The First in chat winner glows in your accent color.",tr48_t:"Hotkeys",tr48_d:"Add a key (or a combo) that does something even while you play: +1 to a counter, a message, a command or a mini game. Switch hotkeys on at the top.",tr49_t:"Labs",tr49_d:"Try new features before they're finished, like Voice commands: say what the bot should do. Switch them on here.",tr50_t:"Fix the leaderboard",tr50_d:"Add a winner whose wins were lost, or press the pencil next to someone to change their wins.",tr45_t:"Reset from chat",tr45_d:"Mods can type a command + reset, like !deaths reset, to put its counters back to 0 (any command that uses the counter works, in any language). Viewers who type it just get the normal reply. Switch it off here, or let only you reset.",

vars:["The display name of the viewer who used the command.", "The first name after the command (the @ is removed). If there isn't one, it's the viewer who used the command.", "Everything the viewer typed after the command name.", "Same as the text after the command, but made safe to use inside a link.", "How many times this command has been used.", "A counter with a name, shared by every command that uses it: adds 1 and shows the new number. Like $(count deaths) in !death.", "Shows a named counter without adding to it. Like $(getcount deaths) in !deaths.", "Your channel name.", "The game or category you're streaming right now.", "Your current stream title.", "How long you've been live. If you're offline, the command says you're offline instead.", "How many people are watching your stream right now. In the Raid reply, it's how many viewers came with the raid.", "A sentence about whether the viewer follows you. With a name, like $(follow $(touser)), it's about that person.", "The date the viewer started following you. With a name, like $(followdate $(touser)), it's that person's date.", "How long the viewer has followed you. With a name, like $(followage $(touser)), it's how long that person has followed (!followage @FQPN).", "The viewer's Watch Streak: how many streams in a row they have watched. Only works in the Watch streak reply.", "The subscription type: Tier 1, Tier 2, Tier 3 or Prime. Only works in the Subscription and Gift subs replies.", "How many months the person has subscribed in total. Only works in the Subscription reply.", "The message the person wrote with their sub, their Bits or their donation. Only works in the Subscription, Bits and Donation replies.", "How many subs were gifted at once. Only works in the Gift subs reply.", "The name of the streamer who raided you. Only works in the Raid reply.", "The Hype Train level. Only works in the Hype train reply.", "How many Bits were cheered. Only works in the Bits reply.", "The donation amount, like 5 or 12.50. Only works in the Donation reply.", "The donation currency, like USD or SAR. Only works in the Donation reply.", "Everything this person gave so far: all their gifted subs, all their Bits, or all their donations in that currency. In a sub reply, the months they've subscribed. Only in Events replies.", "How old the viewer's Twitch account is. With a name after the command (like !age @FQPN), it is that account's age.", "A random viewer who wrote in chat in the last 30 minutes (never the bot).", "How many followers your channel has.", "How many streams in a row the viewer was first to write a Pin first message word. With a name, like $(firststreak $(touser)), it's that person's streak.", "This viewer's best \"first in chat\" streak ever (Pin first message). It stays when a streak breaks. With a name, like $(firststreakpeak $(touser)), it's that person's best streak.", "How long the viewer has watched your streams in total, like 34 hours, 12 minutes. With a name, like $(watchtime $(touser)), it's that person's. Counted by the app while you're live. Tip: import your WizeBot numbers once (Commands › Share › Twitch panel) so the counts continue instead of starting from zero.", "How many messages the viewer has written in your chat in total. With a name, like $(messages $(touser)), it's that person's. Counted by the app. Tip: import your WizeBot numbers once (Commands › Share › Twitch panel) so the counts continue instead of starting from zero.", "The weather in a city, like $(weather Riyadh). Write $(weather $(query)) to let viewers type the city.", "The time in a city right now, like $(time Riyadh). Write $(time $(query)) to let viewers type the city.", "Makes a Twitch clip of the last moments of your stream and gives its link (only while you're live). Give the command to mods and a cooldown. Needs Twitch reconnected once (account menu).", "Does a little math, like Nightbot's eval. The button adds a ready example that picks a random whole number from 0 to 100. You can use + - * / %, brackets, and Math.random(), Math.floor(), Math.round(), Math.ceil(), Math.abs(), Math.min(), Math.max().", "Gets the text of a public web page (first 400 characters) and puts it in the reply. Replace the link with yours."]},

إعلان مميز بدل رسالة عادية. يجب أن يكون البوت مشرفًا في دردشتك للإعلانات.",tr34_t:"كل الألعاب",tr34_d:"إعدادات كل الألعاب معًا: أوامر عرض انتصاراتك («!⁠فوز») ولوحة الأوائل («!⁠الأوائل») ولعبة عشوائية («لعبه؟») وقائمة الألعاب المفعّلة («العاب؟»)، وعدد الجولات في كل بث، والانتظار بين الجولات. والمفتاح في الأعلى يشغّل أو يوقف كل الألعاب.",tr35_t:"لوحة الأوائل",tr35_d:"من فاز أكثر: من البداية أو هالأسبوع (يبدأ يوم الأحد) أو هالشهر، لكل الألعاب معًا أو للعبة واحدة. «تصفير» يمسح الانتصارات بعد التأكيد.",tr36_t:"الوصفات والمتغيرات",tr36_d:"الوصفات أوامر جاهزة، مثل الحضن أو التنويه أو «!⁠كليب»: «جرّب» يعرض ما سيقوله البوت، و«أضفه كأمر» يحفظه لك. و«المتغيرات» تعرض كل $(…) مع مثال، لتجعل ردودك أذكى.",tr37_t:"إعدادات السحب",tr37_d:"اختر من يستطيع المشاركة، وهل يُحسب المتابعون فقط، وكم يزيد حظ المشتركين، ومتى تُغلق المشاركة. ويستطيع البوت الإعلان عن السحب وذكر الفائز في الدردشة.",tr38_t:"إيقاف البوت مؤقتًا",tr38_d:"تحتاج لحظة هدوء؟ أوقف البوت مؤقتًا ولن يرد على أحد ولن يرسل المؤقتات حتى تعيد تشغيله. ولا يتغير شيء في إعداداتك.",tr39_t:"النسخ الاحتياطي والاسترجاع",tr39_d:"احفظ كل إعداداتك (الأوامر والمؤقتات والأحداث والترحيبات والألعاب وغيرها) في ملف واحد، أو استرجعها منه. تسجيلات دخولك إلى تويتش لا تكون في الملف أبدًا.",tr1_t:"مرحبًا بك في بوت FQPN للدردشة",tr1_d:"هذا التطبيق مساعد يعيش في دردشة تويتش الخاصة بك. يرد على مشاهديك وينشر التذكيرات ويشكر الناس نيابةً عنك، حتى وأنت مشغول بالبث. ستشرح لك هذه الجولة القصيرة كل شيء في دقيقتين تقريبًا.",tr1_b1:"الرد على المشاهدين بأوامر مثل !discord",tr1_b2:"نشر تذكيرات بمؤقت أثناء البث",tr1_b3:"شكر المتابعين والمشتركين والغزاة والتبرعات الجديدة",tr2_t:"قائمتك",tr2_d:"كل شيء في هذه القائمة، في أربع مجموعات: نظرة عامة وأدوات الدردشة والاتصالات والنظام. الأرقام الصغيرة تُظهر عدد الأوامر والمؤقتات وردود الأحداث والتحيات المفعّلة، وعدد المستخدمين المحظورين.",tr2p_d:"كل شيء في هذه القائمة. حرّكها جانبًا لترى كل الصفحات.",tr3_t:"حسابك في تويتش",tr3_d:"هذا حسابك في تويتش. عندما تظهر كلمة متصل فالبوت يعمل في دردشتك. اضغط عليه لترى حساباتك أو تفتح حساب البوت أو تفصل الحساب.",tr4_t:"البداية",tr4_d:"قائمة قصيرة تُعلّم نفسها تلقائيًا كلما أنجزت خطوة. اضغط «اذهب» على أي سطر للانتقال إلى المكان الصحيح. يمكنك إخفاءها في أي وقت.",tr5_t:"أرقامك في لمحة",tr5_d:"شاهد عدد أوامرك وعدد المؤقتات العاملة وهل البوت متصل، وأي حساب يكتب الردود. وتحتها رابط صفحة أوامرك العامة.",tr6_t:"ما فعله البوت للتو",tr6_d:"كلما ردّ البوت على أمر أو شكر أحدًا أو نشر مؤقتًا يظهر ذلك هنا. السجل الكامل في صفحة السجلات.",tr7_t:"الأوامر",tr7_d:"الأمر كلمة يكتبها المشاهدون في الدردشة، مثل discord. عندها يرد البوت بالرسالة التي اخترتها. اضغط زر الأمر الجديد ثم اختر اسمه وما يقوله البوت ومن يستطيع استخدامه وكم مرة.",tr40_t:"العدّادات",tr40_d:"بجانب البحث، بدّل بين أوامرك وعدّاداتك. العدّاد رقم له اسم، مثل الموتات أو الانتصارات: في رد الأمر، ⁦$(count deaths)⁩ يزيده 1 ويعرضه، و⁦$(getcount deaths)⁩ يعرضه فقط.",tr41_t:"تعديل العدّاد",tr41_d:"استخدم − و + أو اكتب الرقم بالضبط. «يستخدمه» يعرض الأوامر التي تزيده أو تعرضه (اضغط على أمر لفتحه). «آخر تغيير» يقول من غيّره ومتى، والتصفير وإعادة التسمية والحذف على الجانب.",tr42_t:"عدّاد جديد",tr42_d:"اختر له اسمًا ورقمًا يبدأ منه. اترك «أنشئ الأوامر لي أيضًا» مفعّلًا، وتحصل على أمرين جاهزين: واحد يزيده 1 (للمشرفين) وواحد يعرض الرقم (للجميع).",tr43_t:"العدّادات في لوحة التحكم",tr43_d:"عدّل الرقم بضغطة أثناء البث بـ − و +. تظهر +1 صغيرة إذا زادته الدردشة للتو. و«إدارة العدّادات» يفتح القائمة كاملة.",tr8_t:"الأوامر المدمجة",tr8_d:"تأتي هذه الأوامر مع التطبيق. تتيح لك أو لمشرفيك تغيير عنوان البث واللعبة، أو إضافة الأوامر وتعديلها، مباشرة من الدردشة. ويمكنك إيقاف كل واحد منها.",tr9_t:"المؤقتات",tr9_d:"ينشر المؤقت رسالة من تلقاء نفسه كل بضع دقائق، مثل تذكير بالمتابعة أو بالانضمام إلى الديسكورد. وافتراضيًا لا ترسل المؤقتات إلا أثناء البث. ويمكن للمؤقت أن ينتظر رسائل جديدة قبل أن ينشر، ولا يُرسل مؤقتان وراء بعض: الثاني ينتظر 30 ثانية.",tr10_t:"الأحداث",tr10_d:"الأحداث هي ما يحدث في بثك: متابع جديد أو اشتراك أو غزو أو بيتس أو تبرع. كل تبويب حدث واحد، والنقطة الخضراء تعني أن البوت يرد عليه.",tr11_t:"فعّل الرد",tr11_d:"فعّل الرد وسيشكر البوت الناس نيابةً عنك. يمكنك كتابة ردود مختلفة بحسب المبلغ، مثلًا للتبرعات الأكبر.",tr12_t:"التحيات",tr12_d:"ترحّب التحيات بأشخاص تختارهم، مثل متابعيك الدائمين، برسالة تكتبها أنت.",tr13_t:"قائمة الحظر",tr13_d:"أضف أشخاصًا يجب أن يتجاهلهم البوت. إذا كتب شخص من هذه القائمة أمرًا يبقى البوت صامتًا. رسائلهم تبقى في الدردشة: لحذف الرسائل استخدم الإشراف. احظر شخصًا دائمًا، أو من 1 إلى 99 دقيقة أو ساعة: الحظر المؤقت ينتهي تلقائيًا.",tr14_t:"السجلات",tr14_d:"ثلاث تبويبات: النشاط (الأوامر والأحداث والترحيب)، والإشراف (ما فعلته الفلاتر والمشرفون)، والبوت (كل ما قاله البوت ولماذا). ابحث، أو اضغط على اسم لترى ذلك الشخص فقط.",tr15_t:"الإعدادات، منظّمة",tr15_d:"للمظهر والتشغيل وسلوك البوت والإشعارات والسجلات تبويب خاص لكل منها. وتتغير الأمور المتعلقة بشكل التطبيق فورًا.",tr16_t:"حساب آخر للبوت",tr16_d:"فعّل هذا الخيار إذا أردت أن تأتي الردود من حساب تويتش منفصل، مثل حساب بوت، بدلًا من اسمك. ويبقى حسابك مطلوبًا للأمور التي لا يستطيع السماح بها إلا أنت.",tr17_t:"التبرعات",tr17_d:"اربط Streamlabs أو StreamElements هنا ليتمكن البوت من شكر من يتبرع. يُحفظ رمزك مشفّرًا على هذا الجهاز ولا يُعرض مرة أخرى.",tr18_t:"تحتاجه مرة أخرى؟",tr18_d:"يمكنك إعادة هذه الجولة في أي وقت من زر الشرح في الأعلى، أو من الإعدادات ← التطبيق. بثًا موفقًا!",tr21_t:"الإشراف",tr21_d:"فلاتر تحافظ على نظافة دردشتك: الكلمات السيئة بالعربية والإنجليزية، والروابط، والأحرف الكبيرة، والإيموجيات، والرموز، والتكرار. فعّل أي فلتر، واضغط ⓘ لترى أمثلة. و⚙ يحدد ما يحدث لمن يكرر المخالفة (تُحذف الرسالة دائمًا، ثم تحذير ثم إسكات مؤقت)، ونص التحذير، وهل يُستثنى الـ VIP أو المشتركون. أنت ومشرفوك لا تتم فلترتكم أبدًا.",tr19_t:"أوامر الاختصار",tr19_d:"في محرر الأمر، يمكن أن يكون «ماذا يفعل» أيضًا تغيير اللعبة أو تغيير العنوان أو تثبيت أول رسالة (أول مشاهد يكتب كلمة مثل اول تُثبَّت رسالته). أمر مثل pg يغيّر لعبتك إلى PUBG بكلمة واحدة. يستخدمها المشرفون وأنت فقط. ومع ‎$(query)‏ كاسم للعبة، يغيّر «‎!g Valorant‏» اللعبة إلى ما تكتبه. ويُحسب «تثبيت أول رسالة» في أول دقائق البث فقط.",tr20_t:"قائمة أوامرك العامة",tr20_d:"تحت «مشاركة»: القائمة العامة تعطي قناتك رابطًا واحدًا لصفحة ويب فيها كل أوامرك. مفعّلة من البداية: انسخ الرابط، أو اجعل ‎!cmlist‏ يرسله. تتحدث تلقائيًا عند تغيير أي أمر، ويمكنك إيقافها في أي وقت. وتعرض مثالًا قصيرًا على ما يقوله كل أمر، وأوامر ألعابك في مجموعة خاصة بها.",botacct_sub:"اختر حساب تويتش الذي يكتب ردود البوت في دردشتك.",menu_main:"قناتك",menu_bot:"حساب البوت",menu_notmod:"ليس مشرفًا بعد",menu_usebot:"استخدام حساب بوت منفصل…",hl_reconnecting:"فقد البوت اتصاله بتويتش ويعيد الاتصال تلقائيًا…",hl_offline:"لا يوجد اتصال بالإنترنت. سيعيد البوت الاتصال تلقائيًا فور عودته.",hl_login:"لم يعد تسجيل دخولك في تويتش صالحًا، لذلك لا يستطيع البوت العمل. اربط تويتش مرة أخرى.",hl_problem:"يفقد البوت اتصاله بتويتش باستمرار ({d}). جرّب إعادة تشغيله.",hl_live:"المؤقتات في الانتظار: فحص ما إذا كنت في بث مباشر يفشل باستمرار.",hl_cert:"شيء على هذا الجهاز يمنع الاتصال الآمن بتويتش: غالبًا «فحص HTTPS» أو درع الويب في برنامج الحماية، أو VPN، أو فلتر للشبكة. أضف FQPN's Chat Bot كاستثناء هناك (أو أوقف تلك الميزة)، ثم أعد تشغيل البوت.",hl_restart:"إعادة تشغيل البوت",hl_restarting:"جارٍ إعادة تشغيل البوت…",hl_card_reconnecting:"إعادة الاتصال…",hl_card_offline:"لا إنترنت",hl_card_login:"انتهت صلاحية الدخول",hl_card_problem:"مشكلة",st_tab:"البث",st_title:"رسائل البث",st_intro:"يستطيع البوت أن يكتب في دردشتك عند بدء بثك، وعند عودته بعد انقطاع، وعند انتهائه. كلها متوقفة حتى تفعّلها.",st_note:"تُرسل فقط أثناء تشغيل هذا التطبيق وعندما لا يكون البوت متوقفًا مؤقتًا. والرسالة التي تبدأ بـ /announce تصبح إعلانًا مميزًا.",st_k_start:"عند بدء البث",st_d_start:"تُرسل مرة واحدة عند بدء البث.",st_k_followers:"المتابعون الجدد منذ آخر بث",st_d_followers:"تُرسل بعد رسالة البداية مباشرة، فقط إذا زاد عدد متابعيك منذ آخر بث.",st_k_resume:"عند عودة البث",st_d_resume:"تُرسل عند عودتك بعد انقطاع قصير. وتستمر مدة البث في الزيادة.",st_k_end:"عند انتهاء البث",st_d_end:"تُرسل مرة واحدة عندما تبقى غير متصل مدة كافية لاعتبار البث منتهيًا.",st_reset:"استعادة الافتراضي",st_prev:"معاينة:",st_vars:"المتغيرات",st_v_c tr44_t:"سجل الأوامر",tr44_d:"كل تغيير على أمر ينحفظ هنا: من هذي الصفحة، من المشرفين في الشات (⁦!cmadd⁩ و ⁦!cmedit⁩ و ⁦!cmdel⁩)، رابط المحرر أو استرجاع نسخة. تشوف مين غيّر وش ومتى، وتتراجع عن أي تغيير. الأمر المحذوف يرجع بزر «رجّعه». وبعد ما تحفظ أو تحذف أمر، يطلع زر «تراجع» تحت لثواني.",tr51_t:"كل المتغيرات",tr51_d:"مو متأكد وش يسوي متغير؟ هذا يفتح صفحة في fqpnbot.com فيها كل المتغيرات، مع أمر مثال لكل وحدة، ومكان تجرّب فيه ردك.",vars_all:"كل المتغيرات",ev_t_fanniv:"ذكرى المتابعة",ev_d_fanniv:"أول رسالة لمتابع في ذكرى متابعته (سنة، سنتين…)، أو في الـ 6 أيام اللي بعدها، مرة وحدة بالسنة، وأنت في بث. ⁦{user}⁩ هو المشاهد، و⁦{years}⁩ عدد السنين. التطبيق يتذكر أول تاريخ متابعة لكل واحد، فلو أحد ألغى المتابعة بالغلط ورجع تابع، ⁦$(followage)⁩ وهذا يحسبون من أول مرة (من الحين وطالع: التواريخ اللي ما شافها التطبيق قبل ما يقدر يعرفها).",ev_u_years:"السنين",tce_follow_anniversary:"ذكرى متابعة {u}",ev_t_flevel:"مستوى Falkorie",ev_d_flevel:"لما بوت Falkorie يكتب إن مشاهد وصل مستوى جديد (مثل «auk78 is now level 6!»). {user} هو المشاهد، و{level} المستوى. تقدر تختار ردود مختلفة حسب المستوى.",ev_t_fstreak:"سلسلة Falkorie",ev_d_fstreak:"لما بوت Falkorie يعرض سلسلة مشاهدة مشاهد (مثل «FQPN_ has watched 112 streams in a row!»)، وحتى لما أحد يكتب !streak. {user} هو المشاهد، و{streak} الرقم. كل شخص ياخذ رد سلسلة واحد في كل بث، حتى لو رجع كتب !streak أو قفلت التطبيق وفتحته (وإذا مو لايف: مرة في اليوم).",tr53_t:"الردود تمنشن المشاهد",tr53_d:"في كل ردود الأحداث، ⁦{user}⁩ صار يمنشن المشاهد: ⁦@fqpn_⁩ بدل ⁦fqpn_⁩، عشان يوصله تنبيه. الرد اللي فيه ⁦@{user}⁩ من قبل يبقى مثل ما هو.",wc_title:"أول مرة في الشات",wc_on:"مفعّل",wc_off:"متوقف",wc_sub:"لما أحد يكتب في الشات لأول مرة في حياته، البوت يرحّب فيه بعد ثواني، ورده يختلف إذا قال السلام عليكم وإذا تابع الحين. يشتغل بس وأنت في بث مباشر. التطبيق يتذكر كل اللي كتبوا من وقت إحصائيات البث (وآخر 30 يوم قبلها)، فالمتابعين الدايمين ما يترحّب فيهم كأنهم جدد.",wc_how:"«تابع الحين» = تابع خلال هذا البث أو في آخر ساعة. «السلام عليكم» تشمل «سلام عليكم» و«السلام» و«⁦salam⁩». لو خليت قائمة فاضية البوت ياخذ الأقرب لها، وآخرها «أي شيء ثاني». ⁦{user}⁩ يصير ⁦@name⁩؛ ولو فيه أكثر من رد يختار واحد عشوائي.",wc_l_sf:"قال «السلام عليكم» وتابع الحين",wc_l_s:"قال «السلام عليكم» وما تابع",wc_l_f:"تابع الحين",wc_l_n:"أي شيء ثاني",wc_pv_f:"تابع الحين",wc_pv_n:"ما تابع",wc_add:"+ رد جديد",wc_del:"احذف هذا الرد",wc_max:"أقصى شيء 30 رد.",wc_deleted:"انحذف الرد",wc_delay:"انتظر قبل الرد",wc_delay_s:"عشان ما يحس إنه بوت.",wc_secs:function(p){return p.n=="0"?"على طول":p.n+" ثواني"},wc_skip:"تجاهل إذا أول رسالة أمر",wc_skip_s:"مثل اللي أول رسالة له ⁦!discord⁩: جاي للرابط.",wc_bots:"يرد على البوتات",wc_bots_s:"مثل Nightbot أو Falkorie.",wc_preview:"معاينة",wc_first:"أول مرة",wc_hello:"هلا والله",wc_on_toast:"أول مرة في الشات: مفعّل",wc_off_toast:"أول مرة في الشات: متوقف",tc_first:"أول مرة",tc_first_s:"أرسل الرسالة الجاية كأنها أول رسالة لهذا المشاهد",tcn_followhold:"رد المتابعة بعد {s} ثانية: إذا كتب هذا المشاهد أول رسالة له قبلها، ترحيب «أول مرة في الشات» يشكره بداله.",tcn_welcome:"هذا المشاهد جديد هنا: ترحيب «أول مرة في الشات» يجي بعد ثواني…",tr58_t:"سجل الصوت وأوامر صوت جديدة",tr58_d:"آخر 20 أمر صوتي، وجنب أي شي انسمع غلط زر «صحّح الكلمة». والصوت صار يغيّر العدادات («زيد الموتات»)، ويشغّل أمر («شغّل أمر ديسكورد»)، ويتجاهل أحد («تجاهل فقبن») ويمسح الشات («امسح الشات»): شغّلها فوق.",tr57_t:"تصحيح الكلمات والفي آي بي / الإشراف",tr57_d:"الصوت صار يصحح اللي يسمعه غلط: أضف تصحيحاتك (يسمع… ← المفروض…)، والأسماء اللي تأكدها يتعلمها لحاله. ويقدر يعطي ويشيل الفي آي بي والإشراف: «عطه في آي بي فقبن»، «خل فقبن مشرف» (شغّل «في آي بي / مشرف» فوق).",tr56_t:"ذكرى المتابعة",tr56_d:"في ذكرى متابعة أي متابع، أول رسالة له ينرد عليها مثل «⁦@sam_99⁩ صار لك سنة كاملة متابع/ة!». والتطبيق صار يحفظ أول تاريخ متابعة لكل واحد، فإلغاء المتابعة بالغلط ما يصفّر مدة متابعته.",tr55_t:"أول مرة في الشات",tr55_d:"أول رسالة لأي أحد في شاتك ينرد عليها بترحيب: «وعليكم السلام ⁦@auk78⁩، نورت/ي وشكرا عالفولو» إذا سلّم وتابع الحين، و«⁦@sara⁩ حياك نورت/ي» إذا ما تابع، وهكذا. اختر الردود، ووقت الانتظار، وهل تتجاهل الأوامر والبوتات. في تجربة الدردشة شغّل «أول مرة» عشان تجربه.",tr54_t:"!فوز: المجموع فقط",tr54_d:"أمر الفوز (⁦!فوز⁩ / ⁦!wins⁩) صار يرد برقم واحد: كل الانتصارات مع بعض، مثل «عندك 8 فوزات»، والعدد مكتوب صح: فوز واحد، فوزتين، 3 فوزات، 11 فوز. بدون الأسبوع والشهر وكل لعبة. لوحة الأوائل لسا تعرضها.",tr52_t:"ردود Falkorie",tr52_d:"لو تستخدم بوت Falkorie: البوت يرد لما Falkorie يقول إن أحد وصل مستوى جديد أو يعرض سلسلته. اكتب الردود هنا، واختر ردود مختلفة حسب المستوى أو السلسلة.",tr46_t:"الاستيراد",tr46_d:"انقل أوامرك ومؤقتاتك من نايت بوت أو StreamElements. أنت تختار وش يدخل، وضغطة وحدة تتراجع عن كل شي.",tr47_t:"أوفرلاي لـ OBS",tr47_d:"انسخ هالرابط الواحد في OBS كـ Browser Source. وبعدين شغّل اللي تبيه يطلع على البث، واسحبه للمكان اللي تبيه في المعاينة تحت. وفايز «أول» يلمع بلون التطبيق.",tr48_t:"الاختصارات",tr48_d:"أضف زر (أو كومبو) يسوي شي حتى وأنت تلعب: +1 لعداد، رسالة، أمر أو لعبة. شغّل الاختصارات من فوق.",tr49_t:"المختبر",tr49_d:"جرّب ميزات جديدة قبل ما تكتمل، مثل الأوامر الصوتية: قول للبوت وش يسوي. شغّلها من هنا.",tr50_t:"عدّل لوحة الأوائل",tr50_d:"أضف فائز راحت انتصاراته، أو اضغط القلم جنب أي واحد عشان تعدّل انتصاراته.",tr45_t:"التصفير من الشات",tr45_d:"المشرفين يكتبون الأمر ⁦+ reset⁩، مثل ⁦!deaths reset⁩، يرجع عدّاداته إلى 0 (أي أمر يستخدم العدّاد يشتغل، بأي لغة). المشاهد اللي يكتبها ياخذ الرد العادي بس. تقدر تقفلها من هنا، أو تخليها لك أنت بس.",

vars:["الاسم الظاهر للمشاهد الذي استخدم الأمر.", "أول اسم بعد الأمر (يُحذف الرمز @). إذا لم يوجد، يكون المشاهد الذي استخدم الأمر.", "كل ما كتبه المشاهد بعد اسم الأمر.", "نفس النص بعد الأمر، لكنه آمن للاستخدام داخل رابط.", "عدد مرات استخدام هذا الأمر.", "عدّاد له اسم، مشترك بين كل الأوامر التي تستخدمه: يزيد 1 ويعرض الرقم الجديد. مثل ⁦$(count deaths)⁩ في ‎!death.", "يعرض عدّادًا له اسم بدون أن يزيده. مثل ⁦$(getcount deaths)⁩ في ‎!deaths.", "اسم قناتك.", "اللعبة أو التصنيف الذي تبثه الآن.", "عنوان بثك الحالي.", "المدة التي مضت منذ بدء بثك. إذا لم تكن مباشرًا، يقول الأمر إنك غير متصل.", "عدد الأشخاص الذين يشاهدون بثك الآن. في رد الغارة، هو عدد المشاهدين الذين جاؤوا مع الغارة.", "جملة تقول إن كان المشاهد يتابعك أم لا. ومع اسم، مثل ⁦$(follow $(touser))⁩، يكون عن ذلك الشخص.", "تاريخ بدء المشاهد متابعتك. ومع اسم، مثل ⁦$(followdate $(touser))⁩، يكون تاريخ ذلك الشخص.", "المدة التي يتابعك فيها المشاهد. ومع اسم، مثل ⁦$(followage $(touser))⁩، يكون مدة متابعة ذلك الشخص (‎!followage @FQPN).", "سلسلة مشاهدة المشاهد: كم بثًا متتاليًا شاهده. تعمل فقط في رد سلسلة المشاهدة.", "نوع الاشتراك: Tier 1 أو Tier 2 أو Tier 3 أو Prime. يعمل فقط في ردّي الاشتراك وإهداء الاشتراكات.", "إجمالي عدد الأشهر التي اشترك فيها الشخص. يعمل فقط في رد الاشتراك.", "الرسالة التي كتبها الشخص مع اشتراكه أو بيتسه أو تبرعه. يعمل فقط في ردود الاشتراك والبيتس والتبرع.", "عدد الاشتراكات المُهداة دفعة واحدة. يعمل فقط في رد إهداء الاشتراكات.", "اسم المذيع الذي أغار عليك. يعمل فقط في رد الغارة.", "مستوى قطار الحماس. يعمل فقط في رد قطار الحماس.", "عدد البيتس المُرسلة. يعمل فقط في رد البيتس.", "مبلغ التبرع، مثل 5 أو 12.50. يعمل فقط في رد التبرع.", "عملة التبرع، مثل USD أو SAR. تعمل فقط في رد التبرع.", "كل ما قدمه هذا الشخص حتى الآن: كل اشتراكاته المهداة، أو كل الـ Bits، أو كل تبرعاته بتلك العملة. في رد الاشتراك: عدد أشهر اشتراكه. يعمل فقط في ردود الأحداث.", "عمر حساب المشاهد في تويتش. مع اسم بعد الأمر (مثل ⁦!age @FQPN⁩) يكون عمر ذلك الحساب.", "مشاهد عشوائي كتب في الدردشة خلال آخر 30 دقيقة (ليس البوت أبدًا).", "عدد متابعي قناتك.", "عدد البثوث المتتالية التي كان فيها المشاهد أول من كتب كلمة «تثبيت أول رسالة». ومع اسم، مثل ⁦$(firststreak $(touser))⁩، تكون سلسلة ذلك الشخص.", "أفضل سلسلة لهذا المشاهد في أن يكون «الأول» على الإطلاق (تثبيت أول رسالة). تبقى حتى لو انقطعت السلسلة. ومع اسم، مثل ⁦$(firststreakpeak $(touser))⁩، تكون أفضل سلسلة لذلك الشخص.", "كم تابع المشاهد بثوثك من وقت، مثل 34 ساعة و12 دقيقة. مع اسم، مثل ⁦$(watchtime $(touser))⁩، يكون وقت هالشخص. البرنامج يحسبه وأنت لايف. نصيحة: انقل أرقامك من WizeBot مرة وحدة (الأوامر › مشاركة › بانل تويتش) عشان يكمل العد بدل ما يبدأ من الصفر.", "كم رسالة كتب المشاهد في شاتك من أول. مع اسم، مثل ⁦$(messages $(touser))⁩، تكون رسايل هالشخص. البرنامج يحسبها. نصيحة: انقل أرقامك من WizeBot مرة وحدة (الأوامر › مشاركة › بانل تويتش) عشان يكمل العد بدل ما يبدأ من الصفر.", "الطقس في مدينة، مثل ⁦$(weather Riyadh)⁩. اكتب ⁦$(weather $(query))⁩ ليكتب المشاهدون اسم المدينة.", "الوقت الآن في مدينة، مثل ⁦$(time Riyadh)⁩. اكتب ⁦$(time $(query))⁩ ليكتب المشاهدون اسم المدينة.", "يصنع كليب في تويتش لآخر لحظات من البث ويعطي رابطه (وقت البث فقط). اجعل الأمر للمشرفين مع وقت انتظار. يحتاج إعادة ربط تويتش مرة وحدة (قائمة الحساب).", "يجري عملية حسابية بسيطة مثل eval في Nightbot. يضيف الزر مثالًا جاهزًا يختار رقمًا صحيحًا عشوائيًا من 0 إلى 100. يمكنك استخدام + - * / % والأقواس والدوال Math.random() وMath.floor() وMath.round() وMath.ceil() وMath.abs() وMath.min() وMath.max().", "يجلب نص صفحة ويب عامة (أول 400 حرف) ويضعه في الرد. استبدل الرابط برابطك."]}

  +'<div class="mfsec mgwords"><b>'+t("mg_words")+'</b><p class="note" style="margin:0 0 8px">'+t("mg_words_note")+'</p>'+MGCATS.map(function(k){var ws=(c.words||{})[k]||[];
    return '<label>'+k+'</label><div class="mfrow"><input data-mgw="'+k+'" dir="rtl" maxlength="40" placeholder="'+attr(t("mg_word_ph"))+'"><button class="btn sm" type="button" data-mgadd="'+k+'">'+t("mf_add")+'</button></div>'+mgTags(ws,k)}).join("")+'</div>';
  $("mgbody").innerHTML=h;mgRestore()}
function mgRestore(){if(!MGKEEP)return;Object.keys(MGKEEP).forEach(function(id){var x=$(id);if(x)x.value=MGKEEP[id]});MGKEEP=null}
function mgRead(){var c=MG,sw=function(id){var b=$(id);return b?b.getAttribute("aria-checked")=="true":undefined};
  mgAlFields().forEach(function(f){mgAlAdd(f,true)});        // a name still typed in a box counts too
  if(MGK=="shared"){c.rounds_per_stream=Math.round(+$("mgrounds").value);c.cooldown_seconds=Math.round(+$("mgcool").value);return}
  c.announce=sw("mgann");c.who_starts=$("mgwho").value;c.round_seconds=Math.round(+$("mgsec").value);c.auto_minutes=Math.round(+$("mgauto").value);
  if(MGQUICK.indexOf(MGK)>=0){var hs=sw("mghint");if(hs!==undefined)c.hint=hs;if($("mglevel"))c.level=$("mglevel").value;if($("mgtq"))c.questions=$("mgtq").value;if($("mgway"))c.way=$("mgway").value;if($("mgwords"))c.words=+$("mgwords").value;return}
  if(MGK=="scramble"){c.hint=sw("mghint");if($("mglen"))c.max_letters=+$("mglen").value;var cs=sw("mgcatshow");if(cs!==undefined)c.show_category=cs;
    var boxes=document.querySelectorAll("[data-mgscat]");if(boxes.length)c.categories_off=Array.prototype.filter.call(boxes,function(b){return !b.checked}).map(function(b){return b.dataset.mgscat});
    var ci=$("mgwcat");if(ci)MGCATIN=ci.value;return}
  c.categories=MGCATS.filter(function(k){var b=document.querySelector('[data-mgcat="'+k+'"]');return b&&b.checked});
  c.letters=MGALL.split("").filter(function(l){var b=document.querySelector('[data-mgl="'+l+'"]');return b&&b.getAttribute("aria-pressed")=="true"}).join("")}
function mgOpen(k){modTipOff();MGK=k||"letters";MG=JSON.parse(JSON.stringify(MGK=="shared"?mgShared():mgCfg(MGK)));
  mgAlFields().forEach(function(f){MG[f]=mgNames(MG[f])});delete MG.wins_cmd_old;
  if(MGK=="letters"){delete MG.wins_cmd;delete MG.top_cmd}        // (moved to All games in 1.9.0)
  if(MGQUICK.indexOf(MGK)>=0){MG=Object.assign({},MGDEF[MGK],MG);if(MGK=="emoji")MG.puzzles=Array.isArray(MG.puzzles)?MG.puzzles:[]}      // 1.14.0
  if(MGK=="scramble"){MG.words=Array.isArray(MG.words)?MG.words:[];MG.word_cats=MG.word_cats||{};MG.categories_off=MG.categories_off||[];MGCATIN=""}else if(MGK=="letters")MG.words=MG.words||{};
  lastFocus=document.activeElement;var nm=MGK=="shared"?t("mg_all_t"):mgTitle(MGK);$("mgt").textContent=t("mf_settings",{n:nm});$("mgd").textContent=t(MGK=="shared"?"mg_all_info":"mg_"+MGT[MGK]+"_info");$("mgerr").hidden=true;mgRender();
  $("mgmodal").classList.add("open");setTimeout(function(){var f=$("mgbody").querySelector("input");if(f)f.focus()},50)}
function mgEmoAdd(){var e=($("mgee").value||"").trim(),a=($("mgea").value||"").split(/[,،]/).map(function(x){return x.replace(/[\u064b-\u065f\u0670\u0640]/g,"").trim()}).filter(Boolean);
  if(!e||!a.length){mgErr(t("mg_emo_need"));($("mgee").value?$("mgea"):$("mgee")).focus();return}
  mgRead();MG.puzzles.push({e:e,a:a.slice(0,5)});mgRender();$("mgee").focus()}
function mgClose(){$("mgmodal").classList.remove("open");MG=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
var MGSCR=/^[\u0621-\u064a]{3,7}$/;
function mgAdd(k){mgRead();var inp=document.querySelector('[data-mgw="'+k+'"]'),v=(inp.value||"").replace(/[\u064b-\u065f\u0670\u0640]/g,"").replace(/\s+/g," ").trim();if(!v)return;
  if(k=="scramble"){if(!MGSCR.test(v)){$("mgerr").textContent=t("mg_scr_bad",{w:v});$("mgerr").hidden=false;inp.focus();return}$("mgerr").hidden=true;if(MG.words.indexOf(v)<0)MG.words.push(v);
    var cat=String(MGCATIN||"").replace(/\s+/g," ").trim();MG.word_cats=MG.word_cats||{};if(cat)MG.word_cats[v]=cat;else delete MG.word_cats[v]}
  else{var ws=MG.words[k]=MG.words[k]||[];if(ws.indexOf(v)<0)ws.push(v)}
  mgRender();var f=document.querySelector('[data-mgw="'+k+'"]');if(f)f.focus()}
$("mgbody").addEventListener("click",function(e){var b=e.target.closest("button");
  if(!b){var box=e.target.closest("[data-mgalbox]");if(box){var i=box.querySelector("input");if(i)i.focus()}return}
  if(b.dataset.mgalrm){mgAlAdd(b.dataset.mgalrm,true);mgKeep();MG[b.dataset.mgalrm].splice(+b.dataset.i,1);mgRender();var fi=document.querySelector('[data-mgal="'+b.dataset.mgalrm+'"]');if(fi)fi.focus();return}
  if(b.dataset.mgl){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!="true");return}
  if(b.id=="mgann"||b.id=="mghint"||b.id=="mgcatshow"){b.setAttribute("aria-checked",b.getAttribute("aria-checked")!="true");return}
  if(b.dataset.mgadd){mgAdd(b.dataset.mgadd);return}
  if(b.id=="mgeadd"){mgEmoAdd();return}
  if(b.dataset.mgerm){mgRead();MG.puzzles.splice(+b.dataset.mgerm,1);mgRender();return}
  if(b.dataset.mgrm){mgRead();var gone=(b.dataset.mgrm=="scramble"?MG.words:MG.words[b.dataset.mgrm]).splice(+b.dataset.i,1)[0];if(b.dataset.mgrm=="scramble"&&MG.word_cats)delete MG.word_cats[gone];mgRender()}});
$("mgbody").addEventListener("keydown",function(e){if(e.key=="Enter"&&e.target.dataset.mgw){e.preventDefault();mgAdd(e.target.dataset.mgw);return}
  if(e.key=="Enter"&&e.target.id=="mgwcat"){e.preventDefault();mgAdd("scramble");return}
  if(e.key=="Enter"&&(e.target.id=="mgee"||e.target.id=="mgea")){e.preventDefault();mgEmoAdd();return}
  var f=e.target.dataset.mgal;if(!f)return;
  if(e.key=="Enter"||e.key==" "||e.key==","||e.key=="،"){if(e.target.value.trim()){e.preventDefault();mgAlAdd(f)}else if(e.key!="Enter")e.preventDefault();return}
  if(e.key=="Backspace"&&!e.target.value&&(MG[f]||[]).length){e.preventDefault();mgKeep();MG[f].pop();mgRender();var fi=document.querySelector('[data-mgal="'+f+'"]');if(fi)fi.focus()}});
$("mgcancel").onclick=mgClose;$("mgmodal").addEventListener("mousedown",function(e){if(e.target===$("mgmodal"))mgClose()});
$("mgsave").onclick=async function(){if(!MG)return;if(mgAlFields().some(function(f){return !mgAlAdd(f,true)}))return;mgRead();var c=MG,k=MGK;
  var empty=mgAlFields().filter(function(f){return !(c[f]||[]).length})[0];
  if(empty){mgErr(t("mg_al_need"));var fi=document.querySelector('[data-mgal="'+empty+'"]');if(fi)fi.focus();return}
  try{await mutate("games",function(g){g[k]=Object.assign(g[k]||{},c);if(k=="letters"){delete g[k].wins_cmd;delete g[k].top_cmd}});say(t("mf_saved",{n:k=="shared"?t("mg_all_t"):mgTitle(k)}));mgClose();renderMinigames()}
  catch(e){$("mgerr").textContent=(e&&e.message)||String(e);$("mgerr").hidden=false}};
