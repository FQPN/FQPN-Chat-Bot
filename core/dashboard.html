<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FQPN's Chat Bot</title>
<link rel="icon" href="/icon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#0b0b0c;--side:#0d0d0e;--panel:#0f0f10;--line:#222224;--text:#d3d3d8;--mute:#8a8a92;--red:#7d0b0f;--red2:#9a1118;--chip:#1c1c1e;--mod-bg:#12332a;--mod-t:#4fb386;--ev-bg:#2b2b2e;--ev-t:#b4b4bb;--soft:#b2b2ba;--hover:#151517;--off:#3a3a3d;--menu-h:#2a1214;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f4f6;--side:#fff;--panel:#fff;--line:#e2e2e7;--text:#17171a;--mute:#6b6b73;--chip:#eeeef1;--mod-bg:#d6f3e5;--mod-t:#0f7a46;--ev-bg:#e6e6ea;--ev-t:#44444a;--soft:#44444a;--hover:#f4f4f6;--off:#c4c4ca;--menu-h:#fde8e8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Outfit','Tajawal',system-ui,sans-serif;display:flex;min-height:100vh}
aside{position:sticky;top:0;height:100vh;height:100dvh;align-self:flex-start;overflow-y:auto;width:14.5rem;background:var(--side);border-inline-end:1px solid var(--line);padding:1.875rem 1rem;display:flex;flex-direction:column;flex-shrink:0}
.brand{margin:0 0.875rem 2.125rem;font-weight:700;font-size:1.4375rem;line-height:1.15}
.brand small{display:block;font-weight:500;font-size:0.8125rem;letter-spacing:.45em;margin-top:0.375rem}
nav a{display:flex;gap:0.75rem;align-items:center;padding:0.6875rem 0.875rem;border-radius:0.5rem;color:var(--soft);text-decoration:none;margin-bottom:0.375rem;font-weight:500}
nav a.on{background:var(--red);color:var(--on-red,#fff)}
.acct{margin-top:auto;position:relative}
.acct small{display:block;font-size:0.6875rem;color:var(--mute);margin:0 0 0.25rem;padding-inline-start:0.625rem}
.me{width:100%;display:flex;gap:0.625rem;align-items:center;padding:0.5rem 0.625rem;background:none;border:0;border-radius:0.625rem;color:inherit;font-family:inherit;cursor:pointer;text-align:start}
.me:hover{background:var(--hover)}
.av{width:2.75rem;height:2.75rem;border-radius:50%;flex-shrink:0}
.who{display:block}.who b{display:block;unicode-bidi:isolate;font-size:1.1875rem;line-height:1.1}.who i{display:flex;align-items:center;gap:0.375rem;white-space:nowrap;font-style:normal;font-size:0.8125rem;color:#4ade80}.dot{width:0.4375rem;height:0.4375rem;border-radius:50%;background:currentColor;flex-shrink:0}
.tw{margin-inline-start:auto;display:flex;gap:0.625rem;align-items:center;color:var(--mute)}
.chev{transition:transform .2s}.me[aria-expanded=true] .chev{transform:rotate(180deg)}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 0.375rem);background:var(--panel);border:1px solid var(--line);border-radius:0.625rem;padding:0.375rem;display:none;box-shadow:0 0.5rem 1.5rem rgba(0,0,0,.5)}
.menu.open{display:block}
.menu button{width:100%;background:none;border:0;color:#ff6b6b;font:500 0.9375rem 'Outfit','Tajawal',sans-serif;text-align:start;padding:0.625rem 0.75rem;border-radius:0.4375rem;cursor:pointer}
.menu button:hover{background:var(--menu-h)}
main{flex:1;min-width:0}
.top{height:5.25rem;border-bottom:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;padding:0 2.25rem;color:var(--mute)}
.wrap{padding:1.75rem 1.625rem}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
h1{font-size:2.25rem;font-weight:600;margin:0}
header p{margin:0.25rem 0 0;color:var(--mute);font-size:1.0625rem}
.btn{background:var(--red);color:var(--on-red,#fff);border:1px solid var(--red2);padding:0.875rem 1.625rem;border-radius:0.5rem;font:500 1.0625rem 'Outfit','Tajawal',sans-serif;cursor:pointer}
.btn:hover{background:var(--red2)}
.bar{display:flex;gap:0.875rem;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:0.5rem;overflow:hidden}
.tabs button{border:0;background:none;color:var(--soft);padding:0.75rem 1.625rem;font:500 0.9375rem 'Outfit','Tajawal',sans-serif;cursor:pointer}
.tabs button.on{background:var(--red);color:var(--on-red,#fff)}
input[type=search]{flex:1;min-width:11.25rem;max-width:18.75rem;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0.75rem 1rem;border-radius:0.5rem;font:0.9375rem 'Outfit','Tajawal',sans-serif}
.count{margin-inline-start:auto;color:var(--mute);font-size:0.875rem}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.tbl{border:1px solid var(--line);border-radius:0.625rem;background:var(--panel);overflow-x:auto}
.row{display:grid;grid-template-columns:11.875rem 1fr 7.5rem 6.25rem 5.625rem 6.25rem;gap:0.875rem;align-items:center;padding:0.5rem 1.625rem;min-width:47.5rem;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:not(.head):hover{background:var(--hover);box-shadow:inset 3px 0 0 var(--red2)}
.row.head{font-weight:600;font-size:0.9375rem;padding:1.125rem 1.625rem}
.cmd{display:inline-flex;gap:0.75rem;align-items:center;background:var(--chip);color:var(--text);padding:0.5625rem 0.75rem;border-radius:0.4375rem;border:0;font:500 1rem 'Outfit','Tajawal',sans-serif;cursor:pointer;justify-self:start}
.cmd span{opacity:.6}
.msg{font-size:1rem;overflow-wrap:anywhere}
.lvl{font-size:0.875rem;font-weight:500;padding:0.375rem 0.75rem;border-radius:0.3125rem;justify-self:start}
.lvl.mod{background:var(--mod-bg);color:var(--mod-t)}.lvl.all{background:var(--ev-bg);color:var(--ev-t)}
.cd{color:var(--soft)}
.sw{width:2.875rem;height:1.625rem;border-radius:62.4375rem;background:var(--off);border:0;position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:1.25rem;height:1.25rem;border-radius:50%;background:#dcdce0;transition:transform .2s}
.sw[aria-checked=true]{background:var(--red2)}.sw[aria-checked=true]::after{transform:translateX(1.25rem)}
.act{display:flex;gap:0.875rem;justify-content:center}.act button{border:0;background:none;color:var(--soft);cursor:pointer;font-size:1.0625rem;padding:0.25rem}
.act button{display:flex;transition:color .2s,transform .2s}.act button:hover{color:var(--text)}.act .del:hover,.act .del:focus-visible{color:#ff3b3b;transform:scale(1.15)}.act .del:active{transform:scale(.9)}
.empty{padding:1.875rem;text-align:center;color:var(--mute)}
.toast{position:fixed;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--red);color:var(--on-red,#fff);padding:0.625rem 1.125rem;border-radius:0.5rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.view{display:none}.view.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(12.5rem,1fr));gap:0.875rem;margin-bottom:1.375rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:0.625rem;padding:1.25rem}
.card span{color:var(--mute);font-size:0.9375rem}.card b{display:block;font-size:2.125rem;font-weight:600;margin-top:0.375rem}
.card.red{border-color:var(--red2);box-shadow:inset 3px 0 0 var(--red2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0.625rem;overflow:hidden}
.panel h2{margin:0;padding:1.125rem 1.5rem;font-size:1.125rem;font-weight:600;border-bottom:1px solid var(--line)}
.line{display:flex;gap:1rem;align-items:center;padding:0.875rem 1.5rem;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .grow{flex:1;min-width:0;overflow-wrap:anywhere}.line small{display:block;color:var(--mute);font-size:0.8125rem;margin-top:2px}
.time{color:var(--mute);font-size:0.875rem;min-width:4rem}
.field{display:flex;flex-direction:column;gap:0.375rem;padding:1rem 1.5rem;border-top:1px solid var(--line)}
.field label{font-weight:500}.field small{color:var(--mute)}
.field input,.field select{max-width:20rem;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0.6875rem 0.875rem;border-radius:0.5rem;font:0.9375rem 'Outfit','Tajawal',sans-serif}
.sp{padding:1rem 1.5rem}
@media (max-width:900px){.mnav{display:flex!important}}
.mnav{display:none;gap:0.375rem;overflow-x:auto;padding:0.625rem 0.875rem;border-bottom:1px solid var(--line)}
.mnav a{color:var(--soft);text-decoration:none;padding:0.5rem 0.875rem;border-radius:0.5rem;white-space:nowrap;font-weight:500}.mnav a.on{background:var(--red);color:var(--on-red,#fff)}
@media (max-width:900px){aside{display:none}.wrap{padding:1.25rem 0.875rem}.top{padding:0 1rem;height:3.75rem}h1{font-size:1.875rem}.count{display:none}}

nav{position:relative}
nav a{position:relative;z-index:1;transition:color .25s}
nav a.on{background:transparent!important}
.pill{position:absolute;left:0;right:0;top:0;height:2.75rem;border-radius:0.5rem;background:var(--red);box-shadow:0 0.25rem 0.875rem -0.5rem var(--red2);transition:transform .45s cubic-bezier(.3,1.25,.5,1),height .3s}
.ic{flex-shrink:0;overflow:visible}
nav a .ic{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
nav a:hover .ic{transform:scale(1.15)}
nav a:hover .wand{transform:scale(1.15) rotate(-14deg)}
nav a:hover .gear{transform:scale(1.15) rotate(90deg)}
.spark{transform-origin:15px 7px}.spark2{transform-origin:19px 16px}
nav a.on .spark{animation:twinkle 2.4s ease-in-out infinite}
nav a.on .spark2{animation:twinkle 2.4s ease-in-out .8s infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
main{position:relative;overflow:hidden}
main::before{content:"";position:absolute;width:35rem;height:35rem;right:-10rem;top:-15rem;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(163,18,26,.12)),transparent 68%);animation:drift 16s ease-in-out infinite alternate;pointer-events:none}
.top,.wrap{position:relative;z-index:1}
@keyframes drift{to{transform:translate(-7.5rem,5.625rem) scale(1.15)}}
.line{flex-wrap:wrap;transition:opacity .25s,transform .25s}.line.out{opacity:0;transform:translateX(1.5rem)}
.eform .grow{display:flex;flex-direction:column;gap:0.5rem;min-width:13.75rem}
.eform input,.eform select{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0.625rem 0.75rem;border-radius:0.5rem;font:0.9375rem 'Outfit','Tajawal',sans-serif}
.btn.sm{padding:0.625rem 1.125rem;font-size:0.9375rem}
.ghost{background:none;border:1px solid var(--line);color:var(--soft);padding:0.625rem 1rem;border-radius:0.5rem;font:500 0.9375rem 'Outfit','Tajawal',sans-serif;cursor:pointer}.ghost:hover{color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(0.25rem);display:none;align-items:center;justify-content:center;padding:1.25rem;z-index:50}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:30rem;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red2);border-radius:0.75rem;padding:1.5rem;box-shadow:0 1.5rem 3.75rem rgba(0,0,0,.55);animation:pop2 .35s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop2{from{opacity:0;transform:translateY(1.125rem) scale(.95)}}
.sheet h2{margin:0 0 0.875rem;font-size:1.375rem;font-weight:600}
.sheet label{display:block;font-weight:500;font-size:0.875rem;margin:0.875rem 0 0.375rem}
.sheet input,.sheet textarea,.sheet select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0.6875rem 0.875rem;border-radius:0.5rem;font:0.9375rem 'Outfit','Tajawal',sans-serif;resize:vertical}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:0.875rem}
.mact{display:flex;justify-content:flex-end;gap:0.625rem;margin-top:1.375rem}
.err{border-color:var(--red2)!important}
.sheet{max-width:35rem;max-height:92vh;overflow-y:auto}
.hint{margin:0 0 0.25rem;color:var(--mute);font-size:0.8125rem;line-height:1.45}
.sheet label+.hint,.sheet textarea+.hint{margin-top:0.625rem}
.sub{color:var(--mute);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:0.375rem;margin-top:0.5rem}
.chip{display:inline-flex;align-items:center;gap:0.4375rem;background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:0.375rem;padding:0.375rem 0.625rem;cursor:pointer;font:500 0.8125rem ui-monospace,Menlo,Consolas,monospace;transition:background .2s,border-color .2s,transform .15s}
.chip i{width:0.5rem;height:0.5rem;border-radius:50%;display:inline-block}
.chip:hover{border-color:var(--red2);transform:translateY(-1px)}.chip:active{transform:scale(.95)}
.chip.on{background:var(--red);border-color:var(--red2);color:var(--on-red,#fff)}
#annchips .chip{font-family:'Outfit','Tajawal',sans-serif;font-size:0.875rem}
.al{display:block;color:var(--mute);font-size:0.75rem;margin-top:3px}
.tip{position:fixed;z-index:80;max-width:16.25rem;background:var(--text);color:var(--bg);padding:0.625rem 0.75rem;border-radius:0.5rem;font-size:0.8125rem;line-height:1.4;display:flex;flex-direction:column;gap:0.25rem;pointer-events:none;opacity:0;transform:translateY(0.25rem) scale(.97);transition:opacity .15s,transform .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0.625rem 1.75rem rgba(0,0,0,.45)}
.tip.below{transform:translateY(-0.25rem) scale(.97)}
.tip.on{opacity:1;transform:none}
.tip b{font:600 0.8125rem ui-monospace,Menlo,Consolas,monospace;color:var(--red2)}
.tip em{font-style:normal;opacity:.7;font-size:0.75rem}
.eform .hint{margin:0}.eform .chips{margin-top:0}

:root[dir=rtl]{--dx:0.875rem}
[dir=rtl] .sw[aria-checked=true]::after{transform:translateX(-1.25rem)}
[dir=rtl] .row:not(.head):hover,[dir=rtl] .card.red{box-shadow:inset -3px 0 0 var(--red2)}
[dir=rtl] main::before{right:auto;left:-10rem}
[dir=rtl] .line.out{transform:translateX(-1.5rem)}
[lang=ar] .brand small{letter-spacing:0;font-size:0.875rem}
[lang=ar] body{line-height:1.55}
[lang=ar] .cmd,[lang=ar] .chip{font-family:ui-monospace,Menlo,Consolas,'Tajawal',monospace}
[lang=ar] #annchips .chip{font-family:'Outfit','Tajawal',sans-serif}
.xtra{border-style:dashed}
.hint.warn{color:#f59e0b}
[hidden]{display:none!important}
.view.on{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(0.625rem)}}
.fresh .row:not(.head){animation:rowIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(var(--dx,-0.875rem))}}
.row{transition:background .2s,box-shadow .2s}
.cmd{transition:background .2s,transform .2s}.cmd:hover{background:var(--red);color:var(--on-red,#fff);transform:translateY(-1px)}
.cmd:active{transform:scale(.95)}
.btn{transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0.625rem 1.5rem -0.5rem var(--red2)}.btn:active{transform:scale(.96)}
.sw::after{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.sw[aria-checked=true]{box-shadow:0 0 0.5rem -0.25rem var(--red2)}
.sw:active::after{width:1.5rem}
.card{transition:transform .25s,border-color .25s}.card:hover{transform:translateY(-3px);border-color:var(--red2)}
.dot{animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}100%{box-shadow:0 0 0 0.5rem rgba(74,222,128,0)}}
.menu.open{animation:pop .22s cubic-bezier(.34,1.56,.64,1);transform-origin:bottom}
@keyframes pop{from{opacity:0;transform:translateY(0.5rem) scale(.94)}}
.toast{transform:translate(-50%,0.75rem);transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}

/* ---- linked-dashboard additions ---- */
:root[data-theme="light"] .sw::after{background:#fff}
.lvl.sub{background:#2d2250;color:#c4a8ff}.lvl.vip{background:#4a1d38;color:#ff9ccf}.lvl.bc{background:#4a1518;color:#ff9a9a}
:root[data-theme="light"] .lvl.sub{background:#ece4ff;color:#5b34b0}:root[data-theme="light"] .lvl.vip{background:#ffe3f1;color:#a01d62}:root[data-theme="light"] .lvl.bc{background:#ffe0e0;color:#a31616}
.row.dim .msg,.row.dim .cmd{opacity:.5}
.row .bi{font-size:0.8125rem;color:var(--mute);justify-self:center}
.who i.st-ok{color:#3fb871}.who i.st-wait{color:#f59e0b}.who i.st-off{color:var(--mute)}
.who i.st-wait .dot,.who i.st-off .dot{animation:none}
.menu button.neutral{color:var(--text)}.menu button.neutral:hover{background:var(--hover)}
.banner{display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;margin:1.125rem 1.625rem 0;padding:0.75rem 1.125rem;border-radius:0.625rem;border:1px solid var(--line);background:var(--panel);position:relative;z-index:2}
.banner.bad{border-color:#b4161d;background:rgba(180,22,29,.12)}.banner.warn{border-color:#f59e0b;background:rgba(245,158,11,.1)}.banner.info{border-color:var(--red2)}
.banner span{flex:1;min-width:12.5rem}.banner .code{font:600 1.25rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;margin-inline:0.375rem;padding:2px 0.625rem;border-radius:0.375rem;background:var(--chip);color:var(--text)}
.bbtn{background:var(--red);color:var(--on-red,#fff);border:1px solid var(--red2);padding:0.5rem 1rem;border-radius:0.5rem;font:500 0.875rem 'Outfit','Tajawal',sans-serif;cursor:pointer;text-decoration:none}
.bbtn:hover{background:var(--red2)}
.btn.danger{background:#b4161d;border-color:#d11f27}.btn.danger:hover{background:#d11f27}
.btn:disabled{opacity:.6;cursor:wait}
.sheet.small{max-width:26.25rem}
.dcards{display:flex;flex-direction:column;gap:0.875rem;padding:0.375rem 1.5rem 1.5rem}
.dcard{border:1px solid var(--line);border-radius:0.875rem;background:var(--bg);padding:1.25rem 1.375rem;display:flex;flex-direction:column;gap:0.875rem}
.dhead{display:flex;align-items:center;gap:0.875rem}
.dhead b{display:block;font-size:1.0625rem;font-weight:600}
.dhead small{display:block;color:var(--mute);font-size:0.8438rem;margin-top:2px}
.dico{width:2.75rem;height:2.75rem;border-radius:0.75rem;background:var(--chip);color:var(--soft);display:grid;place-items:center;font-size:1.25rem;font-weight:600;flex:none}
.ddot{margin-inline-start:auto;width:0.5625rem;height:0.5625rem;border-radius:50%;background:var(--off);flex:none}
.ddot.ok{background:#22c984;box-shadow:0 0 0.5rem rgba(34,201,132,.6)}.ddot.wait{background:#f59e0b}.ddot.bad{background:#ff5a5f}
.dst.ok{color:#22c984}.dst.wait{color:#f59e0b}.dst.bad{color:#ff7b82}
.drow{display:flex;align-items:center;gap:0.875rem;flex-wrap:wrap}
.drow input{flex:1;min-width:13.75rem;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0.75rem 1rem;border-radius:0.625rem;font:0.9375rem 'Outfit','Tajawal',sans-serif;direction:ltr;text-align:left}
.dlabel{font-weight:500;font-size:0.875rem;margin-bottom:-0.375rem}
.dok{color:#22c984;font-weight:600}
.dwarn{margin:0;color:#f59e0b;font-size:0.8438rem;line-height:1.45}
.dhint{margin:0;color:var(--mute);font-size:0.8125rem;line-height:1.5}
@media (max-width:900px){.dcards{padding-left:0.875rem;padding-right:0.875rem}.dcard{padding:1rem}}
/* ===== PREVIEW: styling of the planned "separate bot account" screens (rem units, so Font size still scales them) ===== */
.bacgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.875rem;padding:1rem 1.5rem 1.125rem;border-top:1px solid var(--line)}
.acard{border:1px solid var(--line);border-radius:.625rem;padding:1rem;background:var(--bg);display:flex;flex-direction:column;gap:.625rem}

async function req(path,opts){
  var r;try{r=await fetch(path,opts)}catch(e){throw new Error(t("err_net"))}
  var d=null;try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error((d&&d.error)||("Error "+r.status));
  return d}
var API={get:function(s){return req("/api/"+s)},
  put:function(s,data){return req("/api/"+s,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})},
  post:function(p){return req(p,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})},
  postJson:function(p,data){return req(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})}};
function Gone(){var e=new Error(t("err_gone"));e.gone=true;return e}

function mutate(sec,fn){var run=mutQ.then(async function(){var fresh=await API.get(sec);var r=fn(fresh);if(r!==undefined)fresh=r;var saved=await API.put(sec,fresh);D[sec]=saved;return saved});mutQ=run.catch(function(){});return run}

  var reply=(a.enabled&&!by)?'<div class="mute">'+t("bac_silent")+'</div>':'<div>'+bd+'<span class="nm" style="color:'+col+'">'+esc(n)+'</span>: Join the Discord! https://discord.gg/example</div>';
  $("chatprev").innerHTML='<div><span class="nm" style="color:#3b9cff">sami_gamer</span>: discord</div>'+reply}
function renderBotAccount(){
  var a=BA();
  $("bacsw").setAttribute("aria-checked",a.enabled);$("bacbox").hidden=!a.enabled;
  $("bac-cards").innerHTML=baCardChannel()+baCardBot();baModLine();baChatPrev();
  $("bactestl").textContent=t("bac_test_s",{n:a.login||"—"});$("bactest").disabled=!(a.enabled&&a.running);
  var rb=$("botrow");rb.hidden=!a.enabled;
  if(a.enabled){var s=baStat(a),none=a.state=="none";rb.innerHTML='<span class="aav '+(none?"add":"bot")+'">'+(none?"+":BA_ROBOT)+'</span><span><b dir="ltr">'+esc(none?t("bac_none"):(a.login||"…"))+'</b><i class="'+s[0]+'">'+t("side_bot")+' · '+s[1]+'</i></span>'}}
function botDashCard(){var a=BA();return '<div class="card"><span>'+t("dash_chat")+'</span><b class="s" dir="ltr">'+esc(a.enabled?(a.login||"—"):(S.account||"—"))+'</b><small>'+t(a.enabled?"dash_chat_on":"dash_chat_off")+'</small></div>'}
function botBanner(){
  var a=BA();if(!a.enabled)return null;
  if(a.state=="connecting"){var safe=a.uri&&/^https:\/\/([a-z0-9-]+\.)*twitch\.tv(\/|$)/i.test(a.uri);   // no "Open Twitch" button: your normal browser is logged in as YOU
    return ['<span>'+t("bb_login_bot")+' <b class="code" dir="ltr">'+esc(a.code||"…")+'</b></span>'+(safe?'<button class="bbtn" data-bx="copylink" type="button">'+t("bac_copy_link")+'</button>':'')+'<button class="bbtn" data-bx="copycode" type="button">'+t("ban_copy")+'</button><button class="bbtn" data-bx="cancel" type="button">'+t("cancel")+'</button>',"info"]}
  if(a.state=="none"){
    if(a.error)return ['<span>'+t("bac_err_conn",{m:esc(a.error)})+'</span><button class="bbtn" data-bx="connect" type="button">'+t("retry")+'</button>',"bad"];
    return ['<span>'+t(a.problem=="permissions"?"bb_perm":"bb_none")+'</span><button class="bbtn" data-bx="connect" type="button">'+t("bac_connect")+'</button>',"warn"]}
  if(a.is_mod===false)return ['<span>'+t("bb_nomod",{n:'<bdi>'+esc(a.login)+'</bdi>'})+' <span class="codechip">/mod '+esc(a.login)+'</span></span><button class="bbtn" data-bx="copymod" type="button">'+t("bac_copy")+'</button><button class="bbtn" data-bx="check" type="button">'+t("bac_check")+'</button>',"warn"];
  return null}
function baRefresh(){renderBotAccount();renderBanner();renderDashboard()}
function openBotModal(change){$("bmt").textContent=t(change?"bm_title2":"bm_title");$("bmodal").classList.add("open");$("bmgo").focus()}
function closeBotModal(){$("bmodal").classList.remove("open")}
var baFastOn=false;
async function botFast(){   // while the Twitch code is waiting, look every second so the result shows up quickly
  if(baFastOn)return;baFastOn=true;
  try{for(var i=0;i<1800;i++){await new Promise(function(r){setTimeout(r,1000)});await loadStatus();baRefresh();var a=BA();
      if(a.state!="connecting"){if(a.state=="connected")say(t("bac_conn_toast",{n:a.login}));else if(a.error)say(t("bac_err_conn",{m:a.error}),true);break}}}
  finally{baFastOn=false}}
async function botAct(a,el){
  try{
    if(a=="connect"||a=="change"){openBotModal(a=="change");return}
    if(a=="cancel"){await API.post("/api/botaccount/cancel");await loadStatus();baRefresh();return}
    if(a=="disc"){confirmBox({title:t("bac_disc_q"),body:t("bac_disc_body"),ok:t("bac_disc"),danger:true,run:async function(){await API.post("/api/botaccount/disconnect");await loadStatus();baRefresh();say(t("bac_disc_toast"))}});return}
    if(a=="copymod"){copyText("/mod "+BA().login);say(t("bac_copied"));return}
    if(a=="copycode"){copyText(BA().code||"");say(t("ban_copied"));return}
    if(a=="copylink"){copyText(BA().uri||"");say(t("bac_link_copied"));return}
    if(a=="check"){if(el)el.disabled=true;say(t("bac_checking"));var r=await API.post("/api/botaccount/check");await loadStatus();baRefresh();var b=BA();
      if(b.is_mod)say(t("bac_now_mod",{n:b.login}));else if(b.is_mod===false)say(t("bac_still_no",{n:b.login}),true);return}
  }catch(e){await loadStatus();baRefresh();fail(e)}}
document.addEventListener("click",function(e){var b=e.target.closest("[data-bx]");if(b)botAct(b.dataset.bx,b)});
$("bmgo").onclick=async function(){closeBotModal();
  try{await API.post("/api/botaccount/connect");await loadStatus();baRefresh();botFast()}catch(e){fail(e)}};
$("bmcancel").onclick=closeBotModal;$("bmodal").addEventListener("mousedown",function(e){if(e.target===$("bmodal"))closeBotModal()});
document.addEventListener("keydown",function(e){if(e.key=="Escape"&&$("bmodal").classList.contains("open"))closeBotModal()});
$("bacsw").onclick=async function(){
  var on=this.getAttribute("aria-checked")!="true";S.bot_account=Object.assign(BA(),{enabled:on});baRefresh();
  try{await mutate("settings",function(s){s.separate_bot=on});await loadStatus();baRefresh();
    if(on){say(t("bac_on_toast"));if(BA().state=="none")openBotModal(false)}else say(t("bac_off_toast",{n:S.account||""}))}
  catch(e){await loadStatus();baRefresh();fail(e)}};
$("bactest").onclick=async function(){
  try{var r=await API.post("/api/botaccount/test");say(t("bac_test_done",{n:r.name}))}catch(e){fail(e)}};
$("botrow").onclick=function(){location.hash="#settings";setTab("b")};

/* ===== Donations (Settings > Donations): Streamlabs and StreamElements tokens ===== */
var DON=[{k:"streamlabs",name:"Streamlabs",p:"sl"},{k:"streamelements",name:"StreamElements",p:"se"}];
function DS(k){return Object.assign({state:"none",detail:"",account:""},(S.donations||{})[k]||{})}
function renderDonations(){
  var box=$("dcards");if(!box)return;
  var keep={};box.querySelectorAll("input[data-tok]").forEach(function(i){keep[i.dataset.tok]={v:i.value,f:document.activeElement===i,s:i.selectionStart}});   // never wipe a token someone is typing
  var enc=!!(S.donations||{}).encrypted,h="";
  DON.forEach(function(s){
    var d=DS(s.k),cls={connected:"ok",connecting:"wait",invalid:"bad",error:"bad"}[d.state]||"",linked=d.state!="none",askToken=!linked||d.state=="invalid";
    h+='<div class="dcard" data-svc="'+s.k+'"><div class="dhead"><span class="dico">$</span><div><b>'+t("don_"+s.p)+'</b><small>'+t("don_"+s.p+"_kind")+' · <span class="dst '+cls+'">'+t("don_st_"+d.state)+'</span>'+(d.account&&d.state=="connected"?' · <bdi>'+esc(d.account)+'</bdi>':'')+'</small></div><span class="ddot '+cls+'"></span></div>';
    if(d.detail&&(d.state=="invalid"||d.state=="error"))h+='<p class="dwarn">'+esc(d.detail)+'</p>';
    if(linked)h+='<div class="drow"><span class="dok">'+t("don_saved")+'</span><button class="ghost" data-don="remove" data-svc="'+s.k+'" type="button">'+t("don_remove")+'</button></div>';
    if(askToken)h+='<label class="dlabel" for="dtok-'+s.p+'">'+t("don_"+s.p+"_label")+'</label><div class="drow"><input id="dtok-'+s.p+'" type="password" data-tok="'+s.k+'" autocomplete="off" spellcheck="false" maxlength="4000" placeholder="'+attr(t("don_"+s.p+"_ph"))+'"><button class="btn sm" data-don="connect" data-svc="'+s.k+'" type="button" disabled>'+t("don_connect")+'</button></div>';
    h+='<p class="dhint">'+t("don_"+s.p+"_hint")+' '+t(enc?"don_enc":"don_plain")+'</p></div>'});
  box.innerHTML=h;
  box.querySelectorAll("input[data-tok]").forEach(function(i){var k=keep[i.dataset.tok];if(k){i.value=k.v;if(k.f){i.focus();try{i.setSelectionRange(k.s,k.s)}catch(e){}}}
    var b=box.querySelector('button[data-don=connect][data-svc="'+i.dataset.tok+'"]');if(b)b.disabled=!i.value.trim()})}
async function donConnect(k){
  var inp=document.querySelector('#dcards input[data-tok="'+k+'"]');if(!inp||!inp.value.trim())return;var token=inp.value;inp.value="";   // the token leaves the page the moment it is sent
  var btn=document.querySelector('#dcards button[data-don=connect][data-svc="'+k+'"]');if(btn)btn.disabled=true;
  try{await API.postJson("/api/donations/"+k+"/connect",{token:token});await loadStatus();renderDonations();donFast(k)}
  catch(e){await loadStatus();renderDonations();fail(e)}}
var donFastOn={};
async function donFast(k){   // after Connect: look every second until the service answers
  if(donFastOn[k])return;donFastOn[k]=true;var name=DON.filter(function(s){return s.k==k})[0].name;
  try{for(var i=0;i<90;i++){await new Promise(function(r){setTimeout(r,1000)});await loadStatus();renderDonations();renderEvents();var d=DS(k);
      if(d.state=="connected"){say(t("don_connected_toast",{n:name}));break}
      if(d.state=="invalid"||d.state=="none"){if(d.detail)say(d.detail,true);break}}}
  finally{donFastOn[k]=false}}
$("dcards").addEventListener("input",function(e){var i=e.target.closest("input[data-tok]");if(!i)return;var b=$("dcards").querySelector('button[data-don=connect][data-svc="'+i.dataset.tok+'"]');if(b)b.disabled=!i.value.trim()});
$("dcards").addEventListener("keydown",function(e){var i=e.target.closest("input[data-tok]");if(i&&e.key=="Enter"){e.preventDefault();donConnect(i.dataset.tok)}});
$("dcards").addEventListener("click",function(e){
  var b=e.target.closest("[data-don]");if(!b)return;var k=b.dataset.svc,name=DON.filter(function(s){return s.k==k})[0].name;
  if(b.dataset.don=="connect")donConnect(k);
  else confirmBox({title:t("don_remove_q",{n:name}),body:t("don_remove_body"),ok:t("don_remove"),danger:true,run:async function(){await API.post("/api/donations/"+k+"/disconnect");await loadStatus();renderDonations();renderEvents();say(t("don_removed_toast",{n:name}))}})});

/* account menu + banner */
var me=$("me"),menu=$("menu");
function closeMenu(){menu.classList.remove("open");me.setAttribute("aria-expanded","false")}
me.onclick=function(e){e.stopPropagation();var o=menu.classList.toggle("open");me.setAttribute("aria-expanded",o)};
document.addEventListener("click",closeMenu);document.addEventListener("keydown",function(e){if(e.key=="Escape")closeMenu()});
var fastOn=false;
async function fastPoll(){   // while a Twitch login is waiting, check every second so the code shows up quickly
  if(fastOn)return;fastOn=true;
  try{for(var i=0;i<1800;i++){await new Promise(function(r){setTimeout(r,1000)});await loadStatus();renderAccount();renderBanner();if(!S.login||S.login.status!="waiting")break}
    await loadSections();anim=false;renderAll();anim=true}finally{fastOn=false}}
async function doConnect(){try{say(t("conn_started"));await API.post("/api/connect");await loadStatus();renderAccount();renderBanner();fastPoll()}catch(e){fail(e)}}
$("menubtn").onclick=function(){closeMenu();
  if(S.account)confirmBox({title:t("disc_q"),body:t("disc_body"),ok:t("disc_yes"),danger:true,run:async function(){await API.post("/api/disconnect");await loadStatus();renderAccount();renderBanner();renderDashboard();say(t("disc_toast"))}});
  else doConnect()};
$("banner").addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;
  if(b.dataset.a=="connect")doConnect();
  else if(b.dataset.a=="resume")setPaused(false);
  else if(b.dataset.a=="reconnect"){API.post("/api/reconnect").then(function(){return loadStatus()}).then(function(){renderAccount();renderBanner()}).catch(fail)}
  else if(b.dataset.a=="upd_install")startInstall();
  else if(b.dataset.a=="upd_download"){S.update=Object.assign({},S.update,{status:"downloading",progress:0});renderBanner();updFast();API.post("/api/update/download").catch(fail)}
  else if(b.dataset.a=="copycode"){copyText((S.login||{}).code||"");say(t("ban_copied"))}});

/* ===================== views, language, polling ===================== */
function placePill(){var a=document.querySelector("#nav a.on"),pl=$("pill");if(a){pl.style.transform="translateY("+a.offsetTop+"px)";pl.style.height=a.offsetHeight+"px"}}
function countUp(el,to){var t0=null;function f(ts){if(!t0)t0=ts;var k=Math.min((ts-t0)/700,1);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
var SPANES={a:"spane-a",app:"spane-app",b:"spane-b",d:"spane-d",n:"spane-n",l:"spane-l"};
function setTab(x){document.querySelectorAll("#settabs button").forEach(function(b){var on=b.dataset.st==x;b.setAttribute("aria-selected",on);b.tabIndex=on?0:-1});Object.keys(SPANES).forEach(function(k){$(SPANES[k]).hidden=k!=x})}
$("settabs").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setTab(b.dataset.st)});
["settabs","cmdtabs","evtabs"].forEach(function(id){$(id).addEventListener("keydown",function(e){if(e.key!="ArrowRight"&&e.key!="ArrowLeft")return;
  var bs=[].slice.call($(id).querySelectorAll("button")),i=bs.findIndex(function(b){return b.getAttribute("aria-selected")=="true"}),rtl=document.documentElement.dir=="rtl",step=(e.key=="ArrowRight")!=rtl?1:-1,n=bs[(i+step+bs.length)%bs.length];
  n.click();n.focus()})});
var evSel="g",evSig="";
function renderEvTabs(){   // Greetings first, then one tab per Twitch event; a green dot means that reply is on
  var box=$("evtabs"),on=function(k){return k=="g"?((D.greetings||{}).enabled!==false):(((D.events||{})[k]||{}).enabled!==false&&!!(D.events||{})[k])},
      keys=["g"].concat(EVORDER),sig=lang+"|"+keys.map(function(k){return on(k)?1:0}).join("");
  if(sig!==evSig){evSig=sig;var had=box.contains(document.activeElement);
    box.innerHTML=keys.map(function(k){return '<button type="button" role="tab" aria-selected="false" tabindex="-1" data-x="'+k+'"><i class="tdot'+(on(k)?" on":"")+'" aria-hidden="true"></i>'+t(k=="g"?"nav_greetings":EVM[k].t)+'</button>'}).join("");
    if(had){var s=box.querySelector('[data-x="'+evSel+'"]');if(s)s.focus()}}
  box.querySelectorAll("button").forEach(function(b){var sel=b.dataset.x==evSel;b.setAttribute("aria-selected",sel);b.tabIndex=sel?0:-1;if(sel&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"nearest"})})}   // on a phone, bring the chosen tab into view
function evTab(x){evSel=(x=="g"||EVM[x])?x:"g";$("paneG").hidden=evSel!="g";$("paneE").hidden=evSel=="g";renderEvents()}
$("evtabs").addEventListener("click",function(e){var b=e.target.closest("button");if(b)evTab(b.dataset.x)});
async function show(){
  var v=(location.hash||"#commands").slice(1);
  if(v=="greetings"){v="events";evTab("g");try{history.replaceState(null,"","#events")}catch(e){}}   // Greetings now lives inside Events
  if(!$("v-"+v))v="commands";curView=v;
  document.querySelectorAll(".view").forEach(function(x){x.classList.toggle("on",x.id=="v-"+v)});
  document.querySelectorAll("#nav a,#mnav a").forEach(function(a){a.classList.toggle("on",a.dataset.v==v)});placePill();
  if(v=="events")renderEvTabs();   // a hidden page forgets its tab-bar scroll position: bring the chosen tab back into view
  if(v=="commands"){anim=true;renderCommands()}
  if(v=="dashboard"||v=="logs"){await loadLogs();renderLogs();renderDashboard();if(v=="dashboard")document.querySelectorAll("#d-cards b[data-n]").forEach(function(el){countUp(el,+el.dataset.n)})}
  window.scrollTo(0,0)}
function setLang(l,save){
  lang=l;var d=document.documentElement;d.lang=l;d.dir=l=="ar"?"rtl":"ltr";$("lg").value=l;
  if(save){try{localStorage.setItem("fqpn-lang",l)}catch(e){}}
  fillSelects();applyStatic();buildAnn();anim=true;renderAll();placePill()}
async function tick(){
  try{await loadStatus();maybeShowUpdatePopup();renderUpdatePopup();
    if(!modalOpen()){await loadSections();if(curView=="logs"||curView=="dashboard")await loadLogs();
      var sig=JSON.stringify([D,S,LOGS,offline]);if(sig!==lastSig){lastSig=sig;anim=false;renderAll();anim=true}}
  }catch(e){}
  setTimeout(tick,(S.login&&S.login.status=="waiting")?2000:6000)}
window.addEventListener("hashchange",show);
(async function boot(){
  var th=null,lg=null,saved=null;try{th=localStorage.getItem("fqpn-theme");lg=localStorage.getItem("fqpn-lang");saved=localStorage.getItem("fqpn-ui")}catch(e){}
  if(saved){try{UI=cleanUi(JSON.parse(saved))}catch(e){UI=cleanUi()}}else UI=cleanUi({dark:th!="light",language:lg=="ar"?"ar":"en"});
  setLang(UI.language,false);applyUi();   // this device's copy first, so nothing flashes
  await loadStatus();await loadSections();
  if(D.ui){UI=cleanUi(D.ui);applyUi();try{localStorage.setItem("fqpn-ui",JSON.stringify(UI))}catch(e){}}   // the bot's copy wins
  lastSig=JSON.stringify([D,S,LOGS,offline]);anim=true;renderAll();await show();tick()})();

</script>
